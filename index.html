<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#12443B">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F1513">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Khảo sát tuyến</title>
<style>
/* Bố cục: một màn hình — thanh trên, bảng vẽ chiếm giữa, thanh công cụ dưới; ô nhập cột trượt lên từ dưới */
:root{
  --bg:#F4F6F5; --paper:#FFFFFF; --grid:#E3E9E6; --line:#CBD5D0; --fg:#15201C; --muted:#5A6964;
  --ink:#12443B; --ink-fg:#FFFFFF; --hi:#F2B01E; --hi-fg:#241A00; --hi-soft:#FBEFCB;
  --wire:#2F5FA8; --warn:#B4361F; --road:rgba(120,130,126,.22); --road-c:rgba(120,130,126,.55); --moc:#B4361F;
  --k-cot:#12443B; --k-day:#2F5FA8; --k-ct:#8A4B00; --k-sau:#6B3FA0; --k-kc:#1F7A4D; --k-gc:#56655F;
  --q-xanh:#1E9E50; --q-vang:#E0A100; --q-do:#D93025;
  --f:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Roboto Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1513; --paper:#141C19; --grid:#1F2A26; --line:#2E3B36; --fg:#E5ECE8; --muted:#ABBCB5;
  --ink:#17594C; --ink-fg:#FFFFFF; --hi:#F5BD3A; --hi-fg:#241A00; --hi-soft:#3A2F10;
  --wire:#7FA8EC; --warn:#F08A6E; --road:rgba(170,185,178,.16); --road-c:rgba(170,185,178,.4); --moc:#F08A6E;
  --k-cot:#6FD0B6; --k-day:#8FB4F0; --k-ct:#F0B060; --k-sau:#C3A0F0; --k-kc:#7AD6A0; --k-gc:#9AABA4;
  --q-xanh:#4CC77F; --q-vang:#F5C542; --q-do:#FF6B5E;
  color-scheme:dark }}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:16px;display:flex;flex-direction:column;overflow:hidden;
  -webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}

.top{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--ink);color:var(--ink-fg);min-height:54px}
.ib{min-width:40px;height:42px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:transparent;font-size:22px;line-height:1;padding:0 6px}
.ib.pri{background:var(--hi);color:var(--hi-fg);border-color:var(--hi);font-size:15px;font-weight:700}
.ttl{flex:1;min-width:0;height:42px;border:0;background:transparent;text-align:left;font-weight:700;font-size:16.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}

#stage{flex:1;position:relative;min-height:0;background:var(--paper);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
/* ảnh nền vệ tinh vẽ lên canvas riêng dưới sơ đồ; kéo / phóng chỉ dịch lớp SVG bằng transform, thả tay mới dựng lại */
#nen{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#cv{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transform-origin:0 0;will-change:transform;touch-action:none;user-select:none;-webkit-user-select:none}
#nenattr{position:absolute;right:6px;bottom:4px;max-width:70%;font-size:10px;line-height:1.3;color:#fff;text-shadow:0 0 2px #000,0 0 3px #000;text-align:right;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mapctl{position:absolute;right:6px;bottom:20px;display:flex;flex-direction:column;gap:5px;z-index:5}
.mb{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--paper);color:var(--fg);box-shadow:0 2px 8px rgba(0,0,0,.2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;font-size:14px;line-height:1}
.mb small{font-size:7.5px;font-weight:700;color:var(--muted);letter-spacing:-.2px}
.mb.on{background:var(--hi-soft);border-color:var(--hi);border-width:2px}.mb:active{transform:scale(.94)}
#status{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
#status .pill{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;background:var(--fg);color:var(--paper);
  border-radius:999px;padding:5px 5px 5px 12px;font-size:13.5px;font-weight:600;min-height:34px}
#status .pill.solo{padding-right:12px}
#status .pill button{border:0;background:rgba(255,255,255,.2);border-radius:999px;height:26px;min-width:30px;padding:0 10px;font-size:12.5px;font-weight:700;color:inherit}
@media (prefers-color-scheme:dark){#status .pill button{background:rgba(0,0,0,.18)}}

.ib.on{background:rgba(255,255,255,.28);border-color:#fff}
.road{stroke:var(--road);fill:none;stroke-linecap:round;stroke-linejoin:round}
.road.sel{stroke:var(--hi);opacity:.45}
.roadc{stroke:var(--road-c);fill:none;stroke-width:1.2;stroke-dasharray:6 6}
.jn{fill:var(--paper);stroke:var(--muted);stroke-width:1.6}
.ed{stroke:var(--wire);stroke-width:2.2}
.pole{fill:var(--paper);stroke:var(--fg);stroke-width:2.2}
.pole.act{stroke:var(--hi);stroke-width:3.5}
/* thẻ đèn cạnh cột (21/11 Truong «các loại đèn cần phân biệt rõ hơn, không phải chấm nhỏ»): màu + chữ 60 / 100 / 150 / SĐ */
.db{stroke:var(--paper);stroke-width:1.5}.db-L60{fill:#8E44AD}.db-L100{fill:#2E9E5B}.db-L150{fill:#2F6FD0}.db-SD{fill:#F0A30A}.db-x{fill:#7A8580}.db-L200{fill:#8D5524}
.db.dbh{stroke:#E0412F;stroke-width:3}
.dbt{font:800 11px var(--f);fill:#fff;pointer-events:none}.dbt.dk{fill:#2A1A00}
/* đèn hỏng: vòng đỏ nét đứt quanh cột (21/11 Truong: gạch chéo là ký hiệu bóng thu hồi) */
.dnh{stroke:#E0412F;stroke-width:3.4;fill:none;stroke-dasharray:6 3.5}.dnl{stroke:#fff;stroke-width:6.5;fill:none;opacity:.9}
.fillk{fill:var(--fg)}
.ring{fill:none;stroke:var(--hi);stroke-width:2;stroke-dasharray:4 3}
.noiA{fill:var(--hi)}
.lb{fill:var(--fg);paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round}
.lb.so{font:700 13.5px var(--f)}
.lb.so.q{fill:var(--warn)}
.ld{stroke:var(--muted);stroke-width:1;fill:none}
.lb.dt{font:500 11px var(--f);fill:var(--muted)}
.lb.kc{font:700 11px var(--mono);fill:var(--k-kc)}
.lb.mc{font:700 12px var(--f);fill:var(--moc)}
.lb.jt{font:600 10.5px var(--f);fill:var(--muted)}
.moc{fill:var(--moc);stroke:var(--paper);stroke-width:1.5}
.hd{fill:var(--hi);stroke:var(--hi-fg);stroke-width:2}.hm{fill:var(--paper);stroke:var(--hi);stroke-width:2;stroke-dasharray:3 2}
.lb.rn{font:italic 600 12px var(--f);fill:var(--muted)}
.tmp{stroke:var(--hi);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.me{fill:#2F7DF6;stroke:#fff;stroke-width:2.5}
.meacc{fill:rgba(47,125,246,.14);stroke:rgba(47,125,246,.4)}
/* chất lượng GPS: chấm màu cạnh cột (xanh < 3 m, vàng 3–6 m, đỏ > 6 m); viền đậm = đã hiệu chỉnh theo mốc; khung vuông = đã nắn theo khoảng đo */
.qd{stroke:var(--paper);stroke-width:1.2}.qd.hc{stroke:var(--fg);stroke-width:1.8}
.q-xanh{fill:var(--q-xanh)}.q-vang{fill:var(--q-vang)}.q-do{fill:var(--q-do)}
.nanmk{fill:none;stroke:var(--k-kc);stroke-width:1.8}
.mdo{fill:var(--paper);stroke:var(--moc);stroke-width:2.2}
.qdot{display:inline-block;width:11px;height:11px;border-radius:50%;flex:0 0 auto;vertical-align:-1px;background:var(--muted)}
.qdot.q-xanh{background:var(--q-xanh)}.qdot.q-vang{background:var(--q-vang)}.qdot.q-do{background:var(--q-do)}
#status .pill.nhac{background:var(--q-do);color:#fff}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg .btn{height:44px}
.kq{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.5}
.kq b.mono,.mono{font-family:var(--mono)}
.h3{margin:6px 0 0;font-size:16px}

.tools{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
  background:var(--bg);border-top:1px solid var(--line)}
.tools button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:56px;border-radius:12px;
  border:1.5px solid transparent;background:transparent;font-size:11.5px;font-weight:600;color:var(--muted);min-width:0}
.tools button i{font-style:normal;font-size:19px;line-height:22px;color:var(--fg);display:flex;align-items:center;justify-content:center;height:22px}
.tools button.on{background:var(--hi-soft);border-color:var(--hi);color:var(--fg)}
.tools .che{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-bottom:2px}
.tools .che button{height:32px;flex-direction:row;font-size:13px;border:1.5px solid var(--line);border-radius:9px;color:var(--fg)}
.tools .che button.on{background:var(--ink);border-color:var(--ink);color:var(--ink-fg)}
.tools [data-den]{display:none}.tools.che-cs [data-den]{display:flex}.tools.che-cs .ha{display:none}
.ic-den{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:21px;padding:0 4px;border-radius:6px;
  font:800 11.5px var(--f);color:#fff;border:1.5px solid var(--paper);box-shadow:0 0 0 1px rgba(0,0,0,.28)}
.ic-den.L60{background:#8E44AD}.ic-den.L100{background:#2E9E5B}.ic-den.L150{background:#2F6FD0}.ic-den.SD{background:#F0A30A;color:#2A1A00}.ic-den.L200{background:#8D5524}
.ic-den.hong{background:var(--paper);color:#E0412F;border:2.5px dashed #E0412F;border-radius:50%;min-width:24px;width:24px;height:24px;padding:0;box-shadow:none}
.tools.che-cs{grid-template-columns:repeat(8,minmax(0,1fr))}.tools.che-cs button{font-size:10px;white-space:nowrap}.tools.che-cs .ic-den{min-width:0;padding:0 3px;font-size:10.5px}
.ic-tron{display:inline-block;width:17px;height:17px;border-radius:50%;border:2.5px solid currentColor}
.ic-vuong{display:inline-block;width:15px;height:15px;border:2.5px solid currentColor}
.ic-road{display:inline-block;width:22px;height:9px;border-radius:5px;background:var(--road-c)}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);
  border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);padding:8px 10px 0;
  display:flex;flex-direction:column;gap:4px;max-height:62%;overflow:hidden}
/* ô nhập cột: cột dọc cố định — thanh kéo, hàng nút, lưới ô (không cuộn), vùng lựa chọn (tự cuộn), hàng nút dưới.
   Cao cố định 62% để lưới ô không nhảy khi đổi ô; màn hình thấp (xoay ngang) thì cuộn cả ô nhập như cũ. */
#sheet:not(.mini){height:62%}
@media (max-height:520px){#sheet:not(.mini){height:auto;max-height:85%;overflow-y:auto}#sheet .opts{flex:0 0 auto;overflow:visible}}
.grip{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0 3px;margin-top:-2px;width:100%;flex:0 0 auto;touch-action:none}
.grip span{width:46px;height:5px;border-radius:3px;background:var(--line)}
.grip em{display:none;font-style:normal;font-size:12.5px;font-weight:600;color:var(--fg);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet.mini .slots,.sheet.mini .opts,.sheet.mini .shh,.sheet.mini #sh-noi{display:none}
.sheet.mini .grip em{display:block}
.shh{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.grow{flex:1}
.btn{height:38px;border-radius:9px;border:1.5px solid var(--line);background:var(--paper);padding:0 10px;font-weight:700;font-size:13.5px;white-space:nowrap}
.btn.sm{height:34px;padding:0 8px;font-size:12.5px}
/* ảnh cột (03/11): dải ảnh nhỏ trong ô nhập + màn xem ảnh */
.anhs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 2px;flex:0 0 auto}
.anhs img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid #0002;flex:0 0 auto}
#sh-anh-n:not(:empty){margin-left:3px;font-weight:700}
.anhxem{position:fixed;inset:0;z-index:60;background:#000e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px}
.anhxem img{max-width:100%;max-height:78vh;border-radius:6px}
.anhxem .row{display:flex;gap:10px}
.btn.pri{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.btn.danger{color:var(--warn);border-color:currentColor;background:transparent}
/* bảng chi tiết đèn (21/11 Truong «chưa có phần chi tiết, chỉ thêm mà không xoá / sửa được đèn») */
#dsheet{gap:9px;padding-bottom:12px}
#ds-so,.qso{font-size:15.5px;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dsg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.dsg button{height:46px;border-radius:10px;border:2px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center;padding:0}
.dsg button.on{border-color:var(--fg);box-shadow:inset 0 0 0 2px var(--fg)}
.dsr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dsr .k{font-size:13px;color:var(--muted);font-weight:700}
.dsn{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.dsn button{width:46px;height:42px;border:0;background:transparent;font:800 21px var(--f);color:var(--fg)}
.dsn button:disabled{opacity:.3}
.dsn b{min-width:36px;text-align:center;font-size:18px}
#ds-hong.on{background:#E0412F;color:#fff;border-color:#E0412F}
/* bảng chi tiết cột Hạ / Trung + phím nhanh bên phải (22/11) */
#qsheet{gap:7px;padding-bottom:12px}
.qsg button{height:40px;font:800 12.5px var(--f);color:var(--fg);white-space:nowrap;overflow:hidden}
.qdd{display:flex;gap:6px;flex-wrap:wrap}
.qdd button{height:34px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font:700 13px var(--f);color:var(--fg)}
.qdd button.on{background:var(--fg);color:var(--paper);border-color:var(--fg)}
#qs-nho.on,#qs-thu.on{background:#E0412F;color:#fff;border-color:#E0412F}
#nhanh{position:absolute;right:6px;top:64px;display:flex;flex-direction:column;gap:4px;z-index:6}
#nhanh button{width:34px;min-height:26px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);color:var(--fg);font:800 9px var(--f);box-shadow:0 1px 5px rgba(0,0,0,.2);padding:1px;line-height:1.1}
#nhanh button.on{background:var(--fg);color:var(--paper);border-color:var(--fg)}
#nhanh small{display:block;font-size:7px;font-weight:700;opacity:.8;letter-spacing:-.2px}
#nhanh .mic{font-size:15px;min-height:32px}
#nhanh .phu{min-height:24px;margin-top:-2px;font-size:10px}
#nhanh .hinh{font-size:15px;line-height:1}#nhanh .hinh+button:not(.hinh){margin-top:4px}
#nhanh .phu.tat{border-style:dashed;opacity:.85}
#nhanh .nh2{display:flex;gap:4px;align-items:flex-start}#nhanh .nhc{display:flex;flex-direction:column;gap:4px}
#nhanh .nhg{display:grid;grid-template-columns:34px 34px;gap:4px;margin-top:4px}#nhanh .nh2 .phu,#nhanh .nhg .phu{margin-top:0}
#nhanh .day.tat{border:1.5px dashed #E0412F;color:#E0412F;opacity:1}
#khoa{position:fixed;inset:0;z-index:35;background:rgba(21,32,28,.93);display:flex;align-items:center;justify-content:center;padding:16px}
#khoa .kh{background:var(--bg);border-radius:12px;max-width:440px;width:100%;padding:16px 16px 8px}#khoa h2{margin:0 0 8px}#khoa a.btn{text-decoration:none;text-align:center}
#mapctl.trai{right:auto;left:6px}
#nhanh .nhv{display:block;height:3px}#nhanh .dm{font-size:9px;letter-spacing:-.3px}#nhanh .dm small{color:var(--hi)}#nhanh .dm.on small{color:inherit}
#nhanh .lo{font-size:11px}
#nhanh .moc{font-size:13px;color:var(--moc)}#nhanh .moc.on{background:var(--moc);color:#fff;border-color:var(--moc)}
.mtw{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
#nhanh .mic.on{background:#E0412F;color:#fff;border-color:#E0412F;animation:nhm 1.2s infinite}
@keyframes nhm{50%{box-shadow:0 0 0 7px rgba(224,65,47,.28)}}
.btn.armed{background:var(--warn);color:#fff;border-color:var(--warn)}
.sact{flex:0 0 auto;background:var(--bg);display:flex;gap:6px;padding:6px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.sact .btn{flex:1;padding:0 6px}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;flex:0 0 auto}
#slots{grid-template-columns:repeat(3,minmax(0,1fr))}
.sl{position:relative;min-height:32px;border:1.5px solid var(--line);border-radius:7px;background:var(--paper);padding:1px 20px 1px 5px;
  display:flex;flex-direction:column;justify-content:center;min-width:0;cursor:pointer}
.sl .k{font-size:9.5px;font-weight:600;color:var(--muted);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl .k.e{font-size:11px;font-weight:600;color:var(--muted)}
.sl.e{padding-right:5px}
.sl .v{font:700 12.5px var(--f);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl.mono .v{font-family:var(--mono)}
.sl.on{border:2px solid var(--hi);background:var(--hi-soft)}
.sl.on .k.e{color:var(--fg)}
.sl.wide{grid-column:1/-1}
.sl.vn{display:flex;flex-direction:column;gap:2px;padding:8px 12px;border-radius:14px;min-height:0}
.sl.vn .k{font-size:12.5px}.sl.vn select{font:700 15.5px var(--f);border:0;background:transparent;color:var(--fg);padding:4px 0;width:100%}
.sl .x{position:absolute;right:0;top:50%;transform:translateY(-50%);width:22px;height:30px;border:0;background:transparent;color:var(--muted);font-size:15px;padding:0}
.rin{border:0;background:transparent;color:var(--fg);font:700 15px var(--f);padding:0;min-width:0;width:100%}
.opts{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding:4px 0 6px;flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ot{font-size:10px;line-height:1.2;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;flex:0 0 auto}
.og{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:4px}
.og.wv{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.o{min-height:34px;border-radius:7px;border:1.5px solid var(--line);background:var(--paper);font:600 13px var(--mono);padding:1px 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.o.t{font-family:var(--f)}
.o.on{background:var(--hi);border-color:var(--hi);color:var(--hi-fg)}
.typ{display:flex;gap:4px}
.typ .inp{flex:1;min-width:0;height:34px;border-radius:7px;border:1.5px solid var(--line);background:var(--paper);color:var(--fg);font:600 15px var(--mono);padding:0 8px}
#sh-noi{flex:0 0 auto}#o-noi{font:500 14px var(--f)}#o-noi.lenh{border-color:var(--hi);box-shadow:0 0 0 2px var(--hi-soft)}
#o-noi.cho{background-image:linear-gradient(#2E9E5B,#2E9E5B);background-repeat:no-repeat;background-position:left bottom;background-size:0% 4px;animation:nhc 3s linear forwards}
@keyframes nhc{to{background-size:100% 4px}}   /* vạch xanh chạy 3 giây: hết vạch là tự điền */
.gs summary{cursor:pointer;font-weight:600;font-size:14.5px;padding:8px 0}.gs-ds{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.gs-i{font:13px var(--f);color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:5px 10px}.gs-i small{color:var(--muted)}
.gs-i.tat{text-decoration:line-through;opacity:.45}
#o-noi-x{padding:0 9px}
.sl.vn input.gt{font:600 15.5px var(--f);border:0;background:transparent;color:var(--fg);padding:4px 0;width:100%;outline:none}
#sh-mic.on{background:var(--warn);border-color:var(--warn);color:#fff;animation:nhay 1s ease-in-out infinite}
@keyframes nhay{50%{opacity:.6}}
.cnt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.cn{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:7px;background:var(--paper);min-width:0}
.cn.has{border-color:var(--hi);background:var(--hi-soft)}
.cn span{flex:1;padding-left:7px;font-weight:600;font-size:12.5px;min-width:0}
.cn b{min-width:20px;text-align:center;font:700 14.5px var(--mono)}
.cn button{flex:0 0 36px;height:34px;border:0;background:transparent;font-size:19px;font-weight:700}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0 0 10px}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.tbl{border-collapse:collapse;width:max-content;min-width:100%;font-size:13.5px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;white-space:nowrap}
.tbl th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tbl td.m{font-family:var(--mono);font-weight:600}
.tbl tr[data-id]{cursor:pointer}
.tbl tr[data-id]:active{background:var(--hi-soft)}

#panel{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.pin{max-width:640px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:12px}
.pin h2{margin:0;font-size:20px}
.card{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 14px}
.card .tx{flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:0}
.card .tx b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .tx span{font:13px var(--mono);color:var(--muted)}
.card.cur{border-color:var(--hi);border-width:2px}
.big.chinh{border:2px solid var(--hi)}.big.chinh>b{color:var(--hi)}
.big{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:var(--paper);
  border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.big b{font-size:16.5px}.big span{font-size:13.5px;color:var(--muted)}
.big.pri{border-color:var(--ink)}
.note{font-size:13.5px;color:var(--muted);line-height:1.55;margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 160px}
label.btn{display:flex;align-items:center;justify-content:center}
#toast{position:fixed;left:50%;bottom:calc(124px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .16s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}}}
</style>

<!-- xlsx.full.min.js (881 KB) nạp khi mở Xuất (napXlsx) — không làm chậm lúc mở app; sw.js vẫn lưu sẵn để dùng mất mạng -->
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const LSK='kstuyen_v1';
const SHAPE_NAME={tron:'Cột tròn',vuong:'Cột vuông',cs:'Cột CS',tba:'TBA'};

/* ================= lưu trữ ================= */
/* 24/11 (bản 48): dữ liệu đọc không được thì CẤT bản hỏng sang khoá riêng trước khi ghi bản mới; cất không được (máy đầy)
   thì chặn ghi tới lúc khởi động xong đã tải bản hỏng ra Tải xuống — không ghi đè mất dữ liệu cũ */
let DB_HONG=null,chanGhi=false;
let DB=(()=>{let s=null;try{s=localStorage.getItem(LSK);return JSON.parse(s)||{ds:{},cur:null}}catch(e){
  if(s){DB_HONG={s,k:LSK+'_hong_'+Date.now()};try{localStorage.setItem(DB_HONG.k,s)}catch(_){DB_HONG.k=null;chanGhi=true}}
  return {ds:{},cur:null}}})();
DB.snap=true;
/* nâng cấp một lần: đường vẽ mới mặc định rộng 15 m (bản cũ 7 m); người dùng vẫn chỉnh −/+ như cũ, đường đã vẽ giữ nguyên */
if(DB.roadWv!==2){if(!DB.roadW||DB.roadW<15)DB.roadW=15;DB.roadWv=2}
/* dây: bỏ chữ VX (cáp vặn xoắn) — đổi sang ABC; chỉ đổi mã dây (dây dẫn, thay dây, dây sau công tơ), ghi chú để nguyên */
function doiVX(code){
  const t=String(code||'').split(';');
  return t.map((x,i)=>{if(!i||!/vx/i.test(x))return x;const k=kindOf(x);if(k!=='day'&&k!=='sau')return x;
    return x.replace(/(^|[>→:]\s*)(\s*\d*)VX(?=\s*\d)/gi,(m,a,b)=>a+b+'ABC')}).join(';');
}
/* nạp danh sách cột (localStorage, file mở / gộp): đổi VX → ABC, bỏ cột toạ độ VN-2000 do lần xuất trước ghi kèm */
function napPoles(ps){let n=0;for(const p of ps||[]){const c=doiVX(p.code);if(c!==p.code){p.code=c;n++}for(const k of ['X_VN2000','Y_VN2000','X_VN2000_goc','Y_VN2000_goc','hieuChinhTheoMoc','chatLuongGPS'])delete p[k]}return n}
let saveT=null;
/* lưu không được (bộ nhớ đầy): băng đỏ đứng yên trên màn + tự tải bản sao lưu MỘT lần; lần lưu sau được thì băng tự tắt */
let luuLoi=false;
function baoLuuLoi(bat){let el=document.getElementById('luu-loi');
  if(!bat){if(el)el.remove();return}
  if(!el){el=document.createElement('div');el.id='luu-loi';
    el.style.cssText='position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top));z-index:60;background:#b00020;color:#fff;padding:10px 12px;border-radius:10px;font:600 14px/1.35 system-ui,sans-serif;box-shadow:0 2px 10px #0006';
    el.innerHTML='Chưa lưu được — bộ nhớ máy đầy. Đã tải bản sao lưu về máy. Xoá bớt bản vẽ cũ rồi làm tiếp. <button style="margin-left:6px;font:inherit;padding:4px 10px;border-radius:8px;border:0" id="luu-loi-sl">Sao lưu lại</button>';
    document.body.append(el);el.querySelector('#luu-loi-sl').addEventListener('click',()=>{try{saoLuuHet()}catch(e){}})}}
function saveNow(){clearTimeout(saveT);saveT=null;if(chanGhi)return;
  try{localStorage.setItem(LSK,JSON.stringify(DB));if(luuLoi){luuLoi=false;baoLuuLoi(false)}}
  catch(e){if(!luuLoi){luuLoi=true;try{baoLuuLoi(true);saoLuuHet()}catch(_){}}}}
function save(){if(D)D.capNhat=Date.now();clearTimeout(saveT);saveT=setTimeout(saveNow,400)}
/* khung nhìn (kéo / phóng) cất ở khoá nhỏ riêng: không ghi lại cả kho, không đổi giờ "sửa gần nhất" của bản vẽ (bản 48).
   D.view vẫn nằm trong kho chính (lần lưu sau mang theo) → lùi về bản cũ vẫn đọc được */
const LSV=LSK+'_view';let viewT=null;
function luuView(){clearTimeout(viewT);viewT=null;const o={};for(const d of Object.values(DB.ds))if(d.view)o[d.id]=d.view;
  try{localStorage.setItem(LSV,JSON.stringify(o))}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(saveT)saveNow();if(viewT)luuView()}});
window.addEventListener('pagehide',()=>{if(saveT)saveNow();if(viewT)luuView()});
function newD(ten){const d={id:uid(),ten:ten||('Tuyến '+today()),ngay:today(),poles:[],edges:[],roads:[],mocs:[],mocDo:[],geo:null,active:null,view:null,capNhat:Date.now()};
  DB.ds[d.id]=d;DB.cur=d.id;saveNow();return d}
for(const d of Object.values(DB.ds)){d.poles=d.poles||[];d.roads=d.roads||[];d.mocs=d.mocs||[];d.edges=d.edges||[];d.mocDo=d.mocDo||[]}  /* bản vẽ cũ thiếu mảng -> trắng trang (rà 01/11) */
try{const vw=JSON.parse(localStorage.getItem(LSV)||'{}');for(const id in vw)if(DB.ds[id]&&vw[id]&&isFinite(vw[id].s))DB.ds[id].view=vw[id]}catch(e){}
let D=DB.ds[DB.cur]||Object.values(DB.ds).sort((a,b)=>b.capNhat-a.capNhat)[0]||newD();
DB.cur=D.id;D.mocDo=D.mocDo||[];

/* ================= đọc mã cột ================= */
const norm=t=>String(t).toUpperCase().replace(/\s+/g,'');
const DD=/^(ĐỠ|NÉO|GÓC|CUỐI|RẼ|ĐẦU|NGHIÊNG|NỨT|GÃY|TRONGNGÕ|RUỘNG|VƯỜN|CẦUDAO)/;
const SAU_RE=/^\s*(s|sau|sct)\s*:\s*/i;
function kindOf(tok){
  const u=norm(tok);if(!u)return '';
  if(/^GC:/.test(u))return 'gc';
  if(/^(S|SAU|SCT):/.test(u))return 'sau';
  if(/^\d+([.,]\d+)?M$/.test(u))return 'kc';
  if(/^(H1|H2|H4|3P|3PHA)[:=]\d+$/.test(u))return 'ct';
  if(/^TỦCŨ[:=]?\d+$/.test(u))return 'tucu';
  if(/^(TỦ|TỦMỚI|TM)[:=]?\d+$/.test(u))return 'tu';
  const parts=u.split(/>|→/), base=parts[0]||parts[1]||'';
  if(/^\d*(LT|H|BT|NPC)\d+([.,]\d+)?M?$/.test(base)||/^\d*CỘT(GỖ|THÉP|SẮT)$/.test(base)||base==='NHỔBỎ')return 'cot';
  if(/^\d*(CXV|DSTA)/.test(base)||/^\d*MULLER/.test(base))return 'sau';   /* cáp ngầm Cu/XLPE/PVC/DSTA đi cùng nhóm CXV */
  if(/^\d*(ABC|VX|AV|A|CU|M|AC)\d/.test(base)||base==='THUHỒI')return 'day';   /* VX = mã cũ của ABC, vẫn nhận khi đọc dữ liệu cũ */
  if(DD.test(u))return 'dd';
  return 'gc';
}
function splitCode(s){const t=String(s||'').split(';').map(x=>x.trim());return [t[0]||''].concat(t.slice(1).filter(Boolean))}
function parse(code){
  const toks=splitCode(code);
  const r={so:toks[0],cotHT:[],cotTT:[],dayHT:[],dayTT:[],sau:[],dd:[],gc:[],kc:'',h1:0,h2:0,h4:0,p3:0,tuMoi:0,tuCu:0,toks:[]};
  for(const t of toks.slice(1)){
    const k=kindOf(t);r.toks.push({t,k});
    if(k==='cot'||k==='day'){const [a,b]=t.split(/>|→/).map(s=>s.trim());if(a)r[k+'HT'].push(a);if(b)r[k+'TT'].push(b)}
    else if(k==='sau')r.sau.push(t.replace(SAU_RE,''));
    else if(k==='kc')r.kc=parseFloat(t.replace(',','.'));

function nearestOn(pts,x,y){

    acc+=L;
  }
  return best;
}
function pointAt(pts,s){

    const [ax,ay]=pts[i],[bx,by]=pts[i+1],L=Math.hypot(bx-ax,by-ay);if(!L)continue;const ux=(bx-ax)/L,uy=(by-ay)/L;
    if(s<=acc+L||i===pts.length-2){const t=Math.max(s-acc,i===0?s-acc:0);return {x:ax+ux*t,y:ay+uy*t,ux,uy}}
    acc+=L;

}
function nearestRoad(x,y,extra){

  return best;
}

  const R=D.roads;
  for(let i=0;i<R.length;i++)for(let j=0;j<R.length;j++){if(i===j)continue;
    for(const e of [R[i].pts[0],R[i].pts[R[i].pts.length-1]]){const n=nearestOn(R[j].pts,e[0],e[1]);
      if(n&&n.d<0.8){const L=R[j].pts.length,end=Math.hypot(n.px-R[j].pts[0][0],n.py-R[j].pts[0][1])<0.8||Math.hypot(n.px-R[j].pts[L-1][0],n.py-R[j].pts[L-1][1])<0.8;
        if(!end)add(n.px,n.py,3)}}
    if(j<i)continue;
    const A=R[i].pts,B=R[j].pts;
    for(let a=0;a<A.length-1;a++)for(let b=0;b<B.length-1;b++){
      const [x1,y1]=A[a],[x2,y2]=A[a+1],[x3,y3]=B[b],[x4,y4]=B[b+1],den=(x1-x2)*(y3-y4)-(y1-y2)*(x3-x4);if(Math.abs(den)<1e-9)continue;

  if(G.type==='pan'){V.tx=G.v0.tx+pt.x-G.p0.x;V.ty=G.v0.ty+pt.y-G.p0.y;nhanh()}
  else if(G.type==='cadlech'){const m=cadMuc(cadDoi);if(m){m.lech=[G.l0[0]+(pt.x-G.p0.x)/V.s,G.l0[1]+(pt.y-G.p0.y)/V.s];nenHen();status()}}
  else if(G.type==='lech'){const l=nenLech();l[0]=G.l0[0]+(pt.x-G.p0.x)/V.s;l[1]=G.l0[1]+(pt.y-G.p0.y)/V.s;nenHen();status()}
  else if(G.type==='drag'){const [x,y]=toW(pt);G.hit.x=x;G.hit.y=y;if(G.hit.auto)G.hit.auto=false;draw()}
  else if(G.type==='road'){tmpRoad[1]=toW(pt);draw()}
  else if(G.type==='rdrag'){G.hh.r.pts[G.vi]=toW(pt);draw()}
  else if(G.type==='pinch'&&ptrs.size===2){const [a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y),c={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    const s=Math.min(Math.max(G.v0.s*d/G.d0,0.05),60);
    const wx=(G.c0.x-G.v0.tx)/G.v0.s,wy=(G.c0.y-G.v0.ty)/G.v0.s;

});
function pEnd(e){
  if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(!G)return;
  if(G.lp)clearTimeout(G.lp);
  if(G.type==='tap'&&ptrs.size===0){if(cadDoi)toast('Đang dời bản vẽ CAD: kéo cho khớp rồi bấm Xong');else if(nenDoi)toast('Đang dời ảnh nền: kéo ảnh cho khớp cột GPS rồi bấm Xong');else if(G.hh)draw();else onTap(G.p0,G.hit)}
  if(G.type==='lech'&&ptrs.size===0){const l=nenLech();l[0]=+l[0].toFixed(2);l[1]=+l[1].toFixed(2);save();status()}
  if(G.type==='rdrag'){const r=G.hh.r,L=r.pts.length;
    if(G.vi===0||G.vi===L-1){const sp=snapRoadPt(r.pts[G.vi],r);r.pts[G.vi]=[+sp.pt[0].toFixed(3),+sp.pt[1].toFixed(3)]}
    save();draw()}
  if(G.type==='drag'){save();draw()}   /* thả cột: xếp lại nhãn */
  if(G.type==='road'&&ptrs.size===0){const t=tmpRoad;tmpRoad=null;if(t)makeRoad(t[0],t[1]);else draw()}
  if(G.type==='pan'||G.type==='pinch')persistView();

  if(G.type==='pinch'&&ptrs.size===1){const [q]=[...ptrs.values()];G={type:'pan',p0:q,v0:{...V}};return}

stage.addEventListener('pointerup',pEnd);stage.addEventListener('pointercancel',e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);G=null;tmpRoad=null;draw()});
let wheelT=null;
stage.addEventListener('wheel',e=>{e.preventDefault();const pt=loc(e),f=Math.exp(-e.deltaY*(e.deltaMode===1?0.05:e.deltaMode===2?1:0.0015));
  const s=Math.min(Math.max(V.s*f,0.05),60),wx=(pt.x-V.tx)/V.s,wy=(pt.y-V.ty)/V.s;V.s=s;V.tx=pt.x-wx*s;V.ty=pt.y-wy*s;nhanh();
  clearTimeout(wheelT);wheelT=setTimeout(()=>{wheelT=null;draw();persistView()},160)},{passive:false});
/* điểm đầu/cuối đường: hít vào đầu mút đường cũ (nối dài) hoặc vào thân đường (ngã ba) */
function snapRoadPt(p,bo){
  let best=null;const tolE=24/V.s;
  for(const r of D.roads){if(r===bo)continue;const L=r.pts.length;for(const [e,first] of [[r.pts[0],true],[r.pts[L-1],false]]){
    const d=Math.hypot(e[0]-p[0],e[1]-p[1]);if(d<tolE&&(!best||d<best.d))best={d,pt:[e[0],e[1]],end:{r,first}}}}
  if(best)return best;
  for(const r of D.roads){if(r===bo)continue;const n=nearestOn(r.pts,p[0],p[1]);if(n&&n.d<Math.max(r.w/2,22/V.s)&&(!best||n.d<best.d))best={d:n.d,pt:[n.px,n.py]}}
  return best||{pt:p};
}
function makeRoad(a,b){
  const A=snapRoadPt(a),B=snapRoadPt(b),r3=q=>[+q[0].toFixed(3),+q[1].toFixed(3)],pa=r3(A.pt),pb=r3(B.pt);
  if(Math.hypot(pa[0]-pb[0],pa[1]-pb[1])*V.s<20){draw();return}
  snap();
  const extend=(E,q)=>{const r=E.r;if(E.first)r.pts.unshift(q);else r.pts.push(q)};
  if(A.end&&!(B.end&&B.end.r===A.end.r))extend(A.end,pb);
  else if(B.end&&!(A.end&&A.end.r===B.end.r))extend(B.end,pa);
  else D.roads.push({id:uid(),pts:[pa,pb],w:DB.roadW||15});
  save();draw();
}
function onTap(pt,h){
  if(tool==='noi'){
    if(!h){noiA=null;draw();return}
    if(!noiA){noiA=h.id;draw();return}
    if(noiA!==h.id){snap();if(hasEdge(noiA,h.id)){D.edges=D.edges.filter(([a,b])=>!((a===noiA&&b===h.id)||(a===h.id&&b===noiA)));toast('Đã bỏ dây nối')}
      else{D.edges.push([noiA,h.id]);toast('Đã nối dây')}save()}
    noiA=null;draw();return;
  }
  if(tool==='den'){const k=DB.denBut||'L100';
    /* ⚑ thu nhỏ bản đồ (đèn sát nhau trên màn hình): chỉ coi là chạm cột khi trong 10 m (tối thiểu 12 px), kẻo đổi nhầm đèn bên cạnh */
    /* ⚑ 21/11: chạm cột ĐÃ có đèn → bảng chi tiết (đổi loại / số bóng / hỏng / bỏ đèn / xoá cột); nút «Hỏng» vẫn chạm là đánh hỏng ngay;
       cột chưa có đèn (cột hạ áp) → lắp đèn loại đang chọn; đang mở bảng mà chạm chỗ trống → chỉ đóng bảng, không thêm đèn */
    if(h&&h.ten===undefined&&Math.hypot(h.x*V.s+V.tx-pt.x,h.y*V.s+V.ty-pt.y)<=Math.max(12,Math.min(26,10*V.s))){const q=byId(h.id);
      if(q){if(denCo(q)&&k!=='hong')moDen(q);else{denApDung(q,k);if(denId===q.id)veDen()}}return}
    if(h&&h.ten===undefined)h=null;
    if(h)return;if(denId){dongDen();return}const [wx,wy]=toW(pt),q=snapToRoad(wx,wy);denThem(q.x,q.y);return}
  if(tool==='duong'){const w=toW(pt);
    if(roadStart){const a=roadStart;roadStart=null;makeRoad(a,w);return}
    const r=hitRoad(pt);if(r){openRoad(r);return}
    if(selRoad){closeRoad();return}
    roadStart=w;draw();return}
  if(tool==='moc'){
    if(h&&h.ten!==undefined){const t=prompt('Tên mốc (xoá hết chữ để bỏ mốc)',h.ten);if(t===null)return;snap();
      if(t.trim())h.ten=t.trim();else D.mocs=D.mocs.filter(m=>m!==h);save();draw();return}
    const [x,y]=toW(pt);mocTen(x,y);return;
  }
  if((!h||h.ten===undefined)&&(tool==='cot'||tool==='chon')){const sp=hitSpan(pt,h);if(sp){nhapKcThat(sp);return}}
  if(h&&h.ten===undefined){if(h.id!==editId)dropAuto();const q=byId(h.id);if(q&&DB.che!=='cs'){moCot(q);return}D.active=h.id;save();openSheet(q||h);return}
  if(tool==='chon'){finishSheet();dongDen();return}
  const [wx,wy]=toW(pt),q=snapToRoad(wx,wy),ed=editId&&byId(editId);
  if(ed&&ed.auto){snap();ed.x=q.x;ed.y=q.y;save();draw();return}
  const kb=cotBut();if(kb){cotNhanh(q.x,q.y,null,kb);return}if(denId){dongDen();return}
  addPole(q.x,q.y);
}

/* ================= thanh nhanh chiếu sáng =================
   21/11 Truong: sáng đi chấm vị trí đèn, tối đi chấm đèn cháy hỏng — mỗi loại đèn một nút. Đèn ghi trong mã cột (một ô ghi chú
   «Đèn LED 100W» / «Đèn LED 150W» / «Đèn sợi đốt» / «Đèn hỏng») nên bảng cột, Excel, DXF, nhãn tự mang theo, sửa tay vẫn được. */
let denMsg='';
/* thẻ đèn: ô màu ghi 60 / 100 / 150 / SĐ ở trên-phải cột; hỏng: viền thẻ đỏ + vòng đỏ nét đứt quanh cột; hỏng chưa rõ loại: thẻ xám «?» */
function denKhung(d,x,y,rw,rh){if(!d.loai&&!d.hong)return null;const t=(DEN_SO[d.loai]||'?')+(d.n>1?'×'+d.n:''),w=t.length*7+9,h=16;return {x:x+rw*.55,y:y-rh-h+1,w,h,t}}
function denSvg(d,x,y,R,rw=R,rh=R){let s='';const f=v=>+v.toFixed(1),b=denKhung(d,x,y,rw,rh);
  if(d.hong){const r=f(Math.max(rw,rh)+11);s+=`<circle class="dnl" cx="${f(x)}" cy="${f(y)}" r="${r}"/><circle class="dnh" cx="${f(x)}" cy="${f(y)}" r="${r}"/>`}
  if(b)s+=`<rect class="db db-${d.loai||'x'}${d.hong?' dbh':''}" x="${f(b.x)}" y="${f(b.y)}" width="${f(b.w)}" height="${b.h}" rx="4"/><text class="dbt${d.loai==='SD'?' dk':''}" x="${f(b.x+b.w/2)}" y="${f(b.y+b.h-4.2)}" text-anchor="middle">${b.t}</text>`;
  return s}
function denApDung(p,k){const cu=denDoc(p.code),so=parse(p.code).so||'Cột chưa số';let m;
  if(k!=='hong'&&cu.loai===k)m=`${so}: đã là ${DEN_NGAN[k]}`;
  else{snap();p.code=denDat(p.code,k);p.auto=false;save();draw();const d=denDoc(p.code);
    m=k==='hong'?(d.hong?`${so}: đèn HỎNG`:`${so}: bỏ đánh dấu hỏng`):`${so}: ${cu.loai?DEN_NGAN[cu.loai]+' → ':''}${DEN_NGAN[k]}`}
  denMsg=m+' · ';toast(m)}
/* ⚑ cột mới của thanh chiếu sáng là Cột CS, không mở ô nhập; chỉ mang số + loại đèn (không chép loại cột / dây của cột trước).
   Nối dây + số tiếp theo đèn vừa chấm; cột trước không phải đèn (cột hạ áp) hoặc chấm «Đèn hỏng» vào chỗ trống (đèn sáng chưa chấm)
   thì không nối dây, số = số đèn lớn nhất + 1 (bản vẽ đã có cột khác mà chưa có đèn: Đ1). */
const denCo=p=>{const d=denDoc(p.code);return !!(d.loai||d.hong)};
/* số tiếp = số lớn nhất + 1 của DÃY đèn chấm gần nhất (cùng tiền tố: lộ L2.x thì tiếp L2.x, không nhảy về lộ 1) */
function denGanNhat(){let b=null;for(const p of D.poles)if(denCo(p)&&parseSo(parse(p.code).so)&&(!b||(p.t||0)>=(b.t||0)))b=p;return b}
function denSoMoi(){const b=denGanNhat();if(!b)return D.poles.some(p=>parse(p.code).so)?'Đ1':'1';
  const s=parseSo(parse(b.code).so);let max=s.num;
  for(const p of D.poles){if(!denCo(p))continue;const q=parseSo(parse(p.code).so);if(q&&q.pre===s.pre&&q.num>max)max=q.num}
  return s.pre+String(max+1).padStart(s.w,'0')}
function denSoLo(tu){const b=denGanNhat();if(!b)return denSoMoi();
  return (tu?soTuMoi:soLoMoi)(D.poles.filter(denCo).map(p=>parse(p.code).so),parse(b.code).so)}
function denSoDau(){const b=denGanNhat();return b?soDauMoi(D.poles.filter(denCo).map(p=>parse(p.code).so),parse(b.code).so):denSoMoi()}
/* cờ D.doanMoi: 'lo' = lộ mới cùng tủ; 1 = đoạn mới (tủ / tuyến khác) đánh lại từ đầu */
function denThem(x,y,gps){const k=DB.denBut||'L100',a=activeP(),noi=!!a&&denCo(a)&&k!=='hong',md=D.doanMoi||0;D.doanMoi=0;
  if(!noi)D.active=null;const so=noi?'':md==='lo'?denSoLo():md?denSoDau():denSoMoi();

/* ⚑ GPS ở thanh chiếu sáng: có cột trong 12 m (hoặc 1,5 × sai số GPS) thì đổi đèn cột đó, không thêm cột trùng */
function denGan(xy,r){let b=null,bd=r;for(const p of D.poles){const d=Math.hypot(p.x-xy.x,p.y-xy.y);if(d<=bd){bd=d;b=p}}return b}
/* bảng chi tiết đèn: mỗi thao tác ghi ngay + hoàn tác được (nút ↶); xoá cột giữa tuyến thì nối lại dây hai cột hai bên */

function xoaCotNoi(p){const so=parse(p.code).so||'',ke=D.edges.filter(([a,c])=>a===p.id||c===p.id).map(([a,c])=>a===p.id?c:a);
  const con=D.poles.filter(q=>q.from===p.id),cha=p.from&&byId(p.from)?p.from:null;

  toast(loc===denCo?(d>0?'Đây là đèn cuối':'Đây là đèn đầu'):(d>0?'Đây là cột cuối':'Đây là cột đầu'))}

/* ===== Hạ áp / Trung thế: bảng chi tiết cột gọn + phím nhanh bên phải (22/11 Truong «làm tương tự cho Hạ và Trung… thuận tiện nhất khi khảo sát»)
   ⚑ chạm cột ở Hạ / Trung → bảng gọn (không còn mở thẳng ô nhập lớn; nút «Ô nhập cột» mở ô đầy đủ); chọn sẵn loại cột ở phím phải →

const NHANH={ha:{cot:['LT8,5','LT10','LT12','H7,5','H8,5'],day:['ABC4x50','ABC4x70','ABC4x95','ABC4x120','A50'],dd:['Néo','Góc','Cuối','Rẽ nhánh','Đầu nguồn']},
  tt:{cot:['LT12','LT14','LT16','LT18','2LT12'],day:['AC50','AC70','AC95','AC120','AC150'],dd:['Néo','Góc','Cuối','Rẽ nhánh','Đầu nguồn']}};

const BASE_TT={
  cot:['LT12','LT14','LT16','LT18','LT20','2LT12','2LT14','2LT16','H12'],
  cotTT:['LT12','LT14','LT16','LT18','LT20','2LT12','2LT14','Nhổ bỏ'],

/* xếp tăng dần theo loại rồi kích cỡ: LT7,5 < LT8,5 < 2LT8,5 < LT10 … ; ABC2x25 < ABC4x35 < … < ABC4x240
   ('VX' giữ cạnh 'ABC' chỉ để xếp dữ liệu cũ chưa đổi; DSTA3x10+1x6 xếp theo phần 3x10) */
const ORD=['LT','H','BT','NPC','ABC','VX','AV','A','AC','CXV','DSTA','CU','M','MULLER'];
function sizeKey(v){
  const u=norm(v),m=u.match(/^(\d*)([A-ZĐ]+)(\d+(?:[.,]\d+)?)(?:X(\d+(?:[.,]\d+)?))?(?:\+[\dX.,+]*)?$/),f=x=>parseFloat(String(x).replace(',','.'));
  if(!m)return [99,0,0,0,u];
  const ti=ORD.indexOf(m[2]);return [ti<0?50:ti,f(m[3]),m[4]?f(m[4]):0,+m[1]||1,u];
}
function cmpSize(a,b,boLoai){const A=sizeKey(a),B=sizeKey(b);for(let i=boLoai&&A[0]<50&&B[0]<50?1:0;i<4;i++)if(A[i]!==B[i])return A[i]-B[i];return A[4]<B[4]?-1:A[4]>B[4]?1:0}
/* mã cột → các danh sách learned cần (parse chỉ phụ thuộc chuỗi mã nên nhớ theo mã là đúng; 07/11: 🎤 điền 1 câu
   gọi learned 5 lần, mỗi lần đọc lại mọi cột mọi bản vẽ → chậm trên điện thoại) */
const hocNho=new Map();
function hocDoc(code){let r=hocNho.get(code);
  if(!r){const q=parse(code);r={cot:q.cotHT,cotTT:q.cotTT,day:q.dayHT,dayTT:q.dayTT,sau:q.sau,gc:q.gc};if(hocNho.size>5000)hocNho.clear();hocNho.set(code,r)}
  return r}
function learned(kind){
  const src=kind==='cotTT'?'cot':kind==='dayTT'?'day':kind,cnt={};
  for(const d of Object.values(DB.ds))for(const p of d.poles){const vals=hocDoc(p.code)[kind]||[];
    for(const v of vals)if(v)cnt[v]=(cnt[v]||0)+1}
  const base=(DB.che==='tt'&&BASE_TT[kind])||BASE[kind],have=new Set(base.map(norm));
  const all=base.concat(Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).filter(v=>!have.has(norm(v))).slice(0,12));
  return kind==='gc'?all:all.sort((x,y)=>cmpSize(x,y,src==='sau'));   /* dây sau CT: xếp theo tiết diện, không theo loại */
}
/* viết hoa ký hiệu gõ tay: abc4x120 → ABC4x120 */
function hoa(v){return /\s/.test(v)?v:v.replace(/[a-zA-ZđĐ]+/g,(m,o,s)=>/^x$/i.test(m)&&/\d/.test(s[o-1]||'')&&/\d/.test(s[o+1]||'')?'x':m.toUpperCase())}
function codeOf(f){
  const t=[(f.so||'').trim()];
  const zip=(h,tt)=>{const n=Math.max(h.length,tt.length),o=[];for(let i=0;i<n;i++)o.push((h[i]||'')+(tt[i]?'>'+tt[i]:''));return o};
  t.push(...zip(f.cotHT,f.cotTT),...zip(f.dayHT,f.dayTT));
  for(const [k,l] of [['h1','H1'],['h2','H2'],['h4','H4'],['p3','3P']])if(f[k])t.push(l+':'+f[k]);
  t.push(...f.sau.map(v=>'S:'+v));
  if(f.kc!==''&&f.kc!=null&&!isNaN(f.kc))t.push(String(f.kc).replace('.',',')+'m');
  if(f.tuMoi)t.push('Tủ:'+f.tuMoi);if(f.tuCu)t.push('Tủ cũ:'+f.tuCu);
  t.push(...f.dd,...f.gc.map(v=>kindOf(v)==='gc'?v:'GC:'+v));   /* ghi chú tự gõ mà trông giống mã thì đánh dấu GC: */
  return t.join(';')+(t.length>1?';':'');
}

function renderOpts(){

function commit(reOpts=true){
  const p=curP();if(!p)return;
  if(!sheetSnap){snap();sheetSnap=true}
  p.code=codeOf(F);if(p.auto&&p.code!==p.autoCode)p.auto=false;if(F.kc===''&&p.kcThat)delete p.kcThat;
  save();renderSlots();if(reOpts)renderOpts();draw();
}

    if(k==='kc')F.kc='';else if(k==='ct')for(const [c] of CNT)F[c]=0;else if(k==='gc'){F.dd=[];F.gc=[]}else F[LIST[k]]=[];
    slot=k;commit();$('#opts').scrollTop=0;return}

$('#opts').addEventListener('click',e=>{
  const p=curP();if(!p)return;
  const cn=e.target.closest('[data-cn]');
  if(cn){F[cn.dataset.cn]=Math.max(0,(F[cn.dataset.cn]||0)+(+cn.dataset.d));commit();return}
  const a=e.target.closest('[data-act]');
  if(a){const act=a.dataset.act;
    if(act==='so-'||act==='so+'){const q=parseSo(F.so);if(!q)return;const v=Math.max(0,q.num+(act==='so+'?1:-1));
      F.so=q.pre+String(v).padStart(q.w,'0')+String(F.so).trim().slice(String(F.so).trim().split(/\s+/)[0].length);commit();return}
    if(act==='kcthat'){if(F.kc===''){toast('Nhập số mét trước');return}if(!sheetSnap){snap();sheetSnap=true}
      p.kcThat=!p.kcThat;if(!p.kcThat)delete p.kcThat;p.auto=false;nanCho=null;save();renderOpts();draw();return}
    if(act==='somau'){const i=$('#o-somau');const v=(i&&i.value||'').replace(/;/g,'').trim();if(!v)return;
      const L=(DB.soMau||[]).filter(x=>x!==v);if(!SO_MAU.flat().includes(v))L.unshift(v);DB.soMau=L.slice(0,9);
      F.so=v;commit();return}
    if(act==='add'){const i=$('#o-add');const v=(i&&i.value||'').replace(/;/g,',').trim();if(!v)return;
      if(slot==='gc'){if(!F.gc.includes(v))F.gc.push(v)}
      else{const L=F[LIST[slot]],h=hoa(v);if(MULTI[slot]){if(!L.some(x=>norm(x)===norm(h)))L.push(h)}else F[LIST[slot]]=[h]}
      commit();return}
  }
  const b=e.target.closest('[data-o]');if(!b)return;const v=b.dataset.o;
  if(slot==='so'){F.so=v;commit();return}
  if(slot==='kc'){F.kc=String(F.kc)===v?'':+v;commit();if(F.kc!=='')goSlot(F.cotHT.length?'ct':'cot');return}
  if(slot==='ky'){if(!sheetSnap){snap();sheetSnap=true}
    if(v==='doi')p.doi=!p.doi;else{p.shape=v;if(v==='tba')p.doi=false}p.auto=false;save();renderSlots();renderOpts();draw();return}
  if(slot==='gc'){const L=BASE.dd.includes(v)?F.dd:F.gc,i=L.indexOf(v);if(i>=0)L.splice(i,1);
    else{const lk=denLoai(v);if(lk&&lk!=='hong')for(let j=L.length-1;j>=0;j--){const q=denLoai(L[j]);if(q&&q!=='hong')L.splice(j,1)}L.push(v)}   /* mỗi cột một loại đèn */
    commit();return}
  const key=LIST[slot],L=F[key],i=L.findIndex(x=>norm(x)===norm(v));
  if(MULTI[slot]){if(i>=0)L.splice(i,1);else L.push(v);commit();return}
  F[key]=i>=0?[]:[v];commit();
  if(i<0)goSlot(slot==='cot'?(F.dayHT.length?'ct':'day'):'ct');
});

/* ===== ẢNH CỘT (Truong 03/11: "nút chuyển về camera điện thoại, chụp xong chuyển lại vào app, không hỏi, mặc định lưu") =====
   Ảnh nén ~1600 px JPEG, lưu IndexedDB 'kstuyen_anh' (không vào localStorage — không làm đầy bộ nhớ bản vẽ). Khoá: id ảnh;
   kèm ds (bản vẽ), cot (id cột), t, lat/lon lúc chụp. Xoá cột KHÔNG xoá ảnh (hoàn tác xoá cột thì ảnh vẫn còn). */
const ANH={db:null,
  mo(){return this.db?Promise.resolve(this.db):new Promise((ok,loi)=>{const r=indexedDB.open('kstuyen_anh',1);
    r.onupgradeneeded=()=>{const s=r.result.createObjectStore('anh',{keyPath:'id'});s.createIndex('cot','cot');s.createIndex('ds','ds')};
    r.onsuccess=()=>{this.db=r.result;ok(this.db)};r.onerror=()=>loi(r.error)})},
  async tx(mode,fn){const db=await this.mo();return new Promise((ok,loi)=>{const t=db.transaction('anh',mode),st=t.objectStore('anh');let kq;
    Promise.resolve(fn(st)).then(v=>kq=v);t.oncomplete=()=>ok(kq);t.onerror=()=>loi(t.error)})},
  them(a){return this.tx('readwrite',st=>{st.put(a)})},
  xoa(id){return this.tx('readwrite',st=>{st.delete(id)})},
  cuaCot(cot){return this.tx('readonly',st=>new Promise(ok=>{const r=st.index('cot').getAll(cot);r.onsuccess=()=>ok((r.result||[]).sort((a,b)=>a.t-b.t))}))},
  cuaDs(ds){return this.tx('readonly',st=>new Promise(ok=>{const r=st.index('ds').getAll(ds);r.onsuccess=()=>ok((r.result||[]).sort((a,b)=>a.t-b.t))}))}};
/* tên file KHÔNG dấu, không cách (trình duyệt đổi tên file có dấu thành "download") */
const tenFile=t=>String(t||'tuyen').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[đĐ]/g,c=>c==='đ'?'d':'D')
  .replace(/[^A-Za-z0-9._-]+/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'').slice(0,40)||'tuyen';
async function nenAnh(file,nhan,maxW=2560,q=0.85){   /* 03/11: nét hơn (Truong: ảnh nén bị mờ); bản gốc lưu riêng vào máy */
  const bm=await createImageBitmap(file,{imageOrientation:'from-image'}).catch(()=>null);
  const img=bm||await new Promise((ok,loi)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=loi;i.src=URL.createObjectURL(file)});
  const w=img.width,h=img.height,k=Math.min(1,maxW/Math.max(w,h)),c=document.createElement('canvas');
  c.width=Math.round(w*k);c.height=Math.round(h*k);const g=c.getContext('2d');g.drawImage(img,0,0,c.width,c.height);
  if(bm&&bm.close)bm.close();
  if(nhan&&nhan.length)veNhan(g,c.width,c.height,nhan);
  return await new Promise(ok=>c.toBlob(b=>ok(b||file),'image/jpeg',q));
}
/* 03/11 (Truong: gửi Zalo không biết ảnh cột nào, nằm đâu): IN CHỮ lên đáy ảnh — số cột + tuyến, ngày giờ, toạ độ.
   Dải nền đặc: in lại (đổi số cột) thì đè kín nhãn cũ. */
function veNhan(g,w,h,dong){
  const fs=Math.max(20,Math.round(Math.min(w,h)*0.045)),lh=Math.round(fs*1.3),pad=Math.round(fs*0.5),bh=dong.length*lh+pad*2;
  g.fillStyle='#141414';g.fillRect(0,h-bh,w,bh);   /* nền ĐẶC: in lại đè kín nhãn cũ */
  g.textBaseline='top';g.fillStyle='#fff';
  dong.forEach((t,i)=>{g.font=`${i?'':'bold '}${i?Math.round(fs*0.8):fs}px system-ui,-apple-system,Roboto,Arial,sans-serif`;g.fillText(t,pad,h-bh+pad+i*lh,w-pad*2)});
}
function nhanAnh(p,t,lat,lon){
  const so=(p&&parse(p.code).so)||'?',d=new Date(t||Date.now()),hai=n=>String(n).padStart(2,'0');
  const ra=[`CỘT ${so} — ${D.ten||''}`,`${hai(d.getDate())}/${hai(d.getMonth()+1)}/${d.getFullYear()} ${hai(d.getHours())}:${hai(d.getMinutes())}`];
  const v=p&&vnOf(p);
  if(v)ra.push(`VN-2000 (${kttTen(ktt())}): X ${v.x.toFixed(1)} · Y ${v.y.toFixed(1)}`);
  else if(lat!=null&&lon!=null)ra.push(`GPS lúc chụp: ${(+lat).toFixed(6)}, ${(+lon).toFixed(6)}`);
  return ra;
}

/* 🎤 nói cả câu → tự điền ô (Web Speech API, tiếng Việt). ⚑ Chrome Android cần mạng để nhận giọng; câu nói được đọc thành ô bằng giongMa ngay trên máy.
   Máy không có API (Firefox, WebView cũ) → hiện ô gõ câu: gõ, hoặc bấm 🎤 trên bàn phím điện thoại rồi nói, xong bấm Điền */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,GHE=null;
/* 🎤 nghe liền (07/11): bấm 🎤 một lần là nghe tới khi nói «tiếp» / «dừng» / «đoạn mới», bấm 🎤 lần nữa, hoặc im 1 phút.
   Câu nói dồn vào ô; cuối câu nói «điền» là điền ô rồi nghe tiếp (giongLenh). ⚑ Chrome Android mỗi lần nghe lại có thể kêu «bíp» */
var giongNghe=false,giongChot=false,giongDem='',giongLuc=0,giongHong=0,giongDaBao=false,giongHen=null,giongGo=null,giongTuH=null;
const GIONG_IM=60000,GIONG_LOI={'not-allowed':'Chưa cho phép micro — bấm ổ khoá trên thanh địa chỉ để cho phép','service-not-allowed':'Chưa cho phép micro',
  'network':'Nhận giọng nói cần mạng — gõ câu rồi bấm Điền','audio-capture':'Không mở được micro'};
function giongTat(){giongNghe=false;giongChot=false;clearTimeout(giongHen);clearTimeout(giongGo);clearTimeout(giongTuH);giongTuH=null;$('#o-noi').classList.remove('cho');
  if(GHE){const g=GHE;GHE=null;try{g.abort()}catch(e){}}const b=$('#sh-mic');if(b)b.classList.remove('on');const m=$('#nhanh .mic');if(m)m.classList.remove('on')}
function giongBat(thu){clearTimeout(giongHen);if(!giongNghe||!editId||!SR||GHE)return;
  const o=$('#o-noi'),g=new SR(),t0=Date.now();g.lang='vi-VN';g.interimResults=true;g.continuous=false;g.maxAlternatives=1;
  let fin='',tam='',loi='',cu='';GHE=g;
  /* câu đang nghe kết thúc bằng khẩu lệnh → làm luôn, KHÔNG chờ máy «chốt» câu hay tắt phiên (iPhone, vài máy Android
     không bao giờ chốt): chữ đã chốt thì làm ngay, còn chữ tạm thì đứng yên ~0,5 s (tiếp / dừng ~0,7 s) — giongCho ⚑.
     Ô câu nói viền vàng = đã nghe ra lệnh, đang chờ làm (nói tiếp «tiếp địa» là thôi) */
  const lam=()=>{if(GHE!==g)return;GHE=null;try{g.abort()}catch(e){}
    const v=o.value.trim();giongDem=v;giongHong=0;giongLuc=Date.now();if(!giongLam(v))giongMoi()};
  g.onresult=e=>{let f='',t='';for(let i=0;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)f+=r[0].transcript;else t+=r[0].transcript}
    fin=giongChuan(f,DB.giongBo);tam=t;giongLuc=Date.now();
    const v=(giongDem+' '+giongChuan(f+' '+t,DB.giongBo)).replace(/\s+/g,' ').trim();o.value=v;
    if(v===cu)return;cu=v;clearTimeout(giongGo);
    const k=giongLenh(v,DB.giongTu).lenh;o.classList.toggle('lenh',!!k);if(k)giongGo=setTimeout(lam,giongCho(k,!!t.trim()));giongTuHen()};
  g.onerror=e=>{loi=e.error||'loi'};
  g.onend=()=>{if(GHE!==g)return;GHE=null;clearTimeout(giongGo);   /* đã bị huỷ (✕, Điền, đổi cột, đóng ô nhập) → bỏ */
    const s=fin.trim()||giongChuan(tam,DB.giongBo);   /* máy tắt phiên mà chưa chốt câu → lấy chữ tạm, không để mất */
    if(s){giongDem=(giongDem+' '+s).replace(/\s+/g,' ').trim();giongHong=0}
    if(giongChot){giongChot=false;if(s)o.value=giongDem;giongTat();giongXong();return}   /* bấm 🎤 lần 2: không có kết quả chốt thì lấy cả chữ tạm trong ô */
    o.value=giongDem;
    if(s)giongLam(giongDem);
    if(!giongNghe||!editId||GHE)return;
    if(GIONG_LOI[loi]){giongTat();toast(GIONG_LOI[loi]);return}
    if(!s&&Date.now()-t0<1000&&++giongHong>=3){giongTat();toast(loi&&loi!=='no-speech'&&loi!=='aborted'?'Lỗi nhận giọng: '+loi:'Micro không nghe được — gõ câu rồi bấm Điền');return}
    if(Date.now()-giongLuc>GIONG_IM){giongTat();toast('🎤 Im 1 phút — đã tắt nghe'+(o.value.trim()?'. Câu còn trong ô: bấm Điền':''));return}
    giongHen=setTimeout(giongBat,GIONG_CHO.lai)};
  try{g.start()}catch(e){GHE=null;if(!thu){giongHen=setTimeout(()=>giongBat(1),250);return}   /* mở lại sớm quá máy chưa nhả micro → thử lại 1 lần */
    giongTat();o.focus();toast('Không mở được nhận giọng nói — gõ câu rồi bấm Điền')}}
/* câu trong ô vừa đổi ngoài nhận giọng (✕, Điền, gõ tay) → bỏ phiên đang nghe (nó còn giữ chữ cũ), nghe lại phiên mới */

function giongThu(){const k=$('#gt-thu'),i=$('#gt-la');if(!k||!i)return;const v=i.value.trim();if(!v){k.textContent='';return}
  const t=giongMa(v,giongDs(),null,DB.giongBo),l=giongLaLenh(v);

function apGiong(text){const p=curP();if(!p||!F)return null;
  text=String(text||'').trim();if(!text)return null;
  const d=giongDay(text);
  if(d&&d.quen){const k=giongKhoa(d.quen),L=DB.giongTu||[],M=L.filter(e=>giongKhoa(e.noi)!==k);
    const s=String(d.quen).normalize('NFC').toLowerCase().trim(),co=GIONG_SAI.some(x=>x[0]===s);
    if(co){const B=DB.giongBo||(DB.giongBo=[]);if(!B.includes(s))B.push(s)}   /* «quên giây» = tắt luôn cụm có sẵn «giây → dây» */
    if(M.length===L.length&&!co)toast('📖 Chưa nhớ cụm «'+d.quen+'»');
    else{DB.giongTu=M;saveNow();toast(co?'📖 Đã tắt cụm có sẵn «'+s+'» — bật lại trong 📖':'📖 Đã quên «'+d.quen+'»')}return null}
  if(d){const r=giongLuu(d.noi,d.la);giongCon='';
    toast('📖 '+(r.sua?'Đã sửa':'Đã nhớ')+': nói «'+d.noi+'» → '+r.mo+(r.t.hieu.length&&r.t.con?' — chưa hiểu: '+r.t.con:''));return null}
  /* «sang trung thế …», «chiếu sáng …» đổi phần; «đèn LED 150 hai bóng», «sợi đốt», «đèn hỏng», «bỏ đèn» ghi đèn — ở phần nào cũng nói được */
  const dn=giongDen(text,DB.che);
  if(dn.che&&dn.che!==DB.che){datChe(dn.che,true);veNhanh();saveNow();renderSlots();renderOpts();draw()}
  if(dn.loai||dn.n||dn.hong!=null||dn.bo){let c=codeOf(F);
    if(dn.bo)c=denBo(c);else{if(dn.loai)c=denDat(c,dn.loai);if(dn.hong!=null&&denDoc(c).hong!==dn.hong)c=denDat(c,'hong');if(dn.n)c=denSoBong(c,dn.n)}
    F=parse(c);commit()}
  text=dn.con;
  if(!text){if(dn.hieu.length){giongCau=dn.hieu.join(' · ');giongCon='';toast('🎤 '+dn.hieu.join(' · '))}return {hieu:dn.hieu,con:'',nho:[]}}
  const g=giongMa(text,giongDs(),DB.giongTu,DB.giongBo);
  if(dn.hieu.length){if(!g.hieu.length)g.con=text;g.hieu=dn.hieu.concat(g.hieu)}
  giongCau=text;giongCon=g.hieu.length?g.con||'':text;
  if(!g.hieu.length){toast('🎤 Chưa hiểu: «'+text+'» — bấm 📖 để dạy app');return g}
  if(g.shape||g.doi){if(!sheetSnap){snap();sheetSnap=true}
    if(g.shape){p.shape=g.shape;if(g.shape==='tba')p.doi=false}
    if(g.doi&&p.shape!=='tba')p.doi=true;p.auto=false}
  if(g.so!=null)F.so=g.so; if(g.kc!=null)F.kc=g.kc;
  for(const k of ['cotHT','cotTT','dayHT','dayTT','sau'])if(g[k])F[k]=g[k].slice();
  for(const k of ['h1','h2','h4','p3','tuMoi','tuCu'])if(g[k]!=null)F[k]=g[k];
  if(g.dd)for(const v of g.dd)if(!F.dd.includes(v))F.dd.push(v);
  if(g.gc)for(const v of g.gc)if(!F.gc.includes(v))F.gc.push(v);
  commit();
  toast('🎤 '+(g.nho.length?'📖 ':'')+g.hieu.join(' · ')+(g.con?'  — bỏ qua: '+g.con+' (bấm 📖 để dạy)':''));return g}

/* xuất: gửi mọi ảnh của bản vẽ (Zalo / Drive) — tên file có số cột */
async function guiAnhCot(){
  const soCot=a=>parse(byId(a.cot).code).so||'';
  const ds=(await ANH.cuaDs(D.id).catch(()=>[])).filter(a=>byId(a.cot))
    .sort((a,b)=>{const x=parseFloat(soCot(a)),y=parseFloat(soCot(b));return (isFinite(x)?x:1e9)-(isFinite(y)?y:1e9)||soCot(a).localeCompare(soCot(b))||a.t-b.t});
  if(!ds.length){toast('Bản vẽ này chưa có ảnh cột nào');return}
  const dem={},ten=tenFile(D.ten),files=[];let i=0;
  for(const a of ds){i++;const so=soCot(a);
    if(a.so!==so){toast(`Đang ghi lại số cột lên ảnh ${i}/${ds.length}…`);   /* cột đổi số sau khi chụp (hoặc ảnh chụp bản cũ): in lại, lưu luôn */
      a.blob=await nenAnh(a.blob,nhanAnh(byId(a.cot),a.t,a.lat,a.lon));a.so=so;await ANH.them(a)}

/* ================= GPS ================= */
function geoToXY(lat,lon,setOrigin=true){
  if(!D.geo){if(!setOrigin)return {x:0,y:0};const a=activeP();D.geo={lat0:lat,lon0:lon,x0:a?a.x+30:0,y0:a?a.y:0}}
  const g=D.geo,kx=111320*Math.cos(g.lat0*Math.PI/180);
  return {x:g.x0+(lon-g.lon0)*kx,y:g.y0-(lat-g.lat0)*110574};
}
/* ================= VN-2000 =================
   Chép đúng từ LispcadZP/tools/vn2000/vn2000.py: ellipsoid WGS-84; Helmert 7 tham số QĐ 05/2007/QĐ-BTNMT
   (chiều VN-2000 → WGS-84, xoay quy ước coordinate frame, WGS → VN giải hệ 3x3 chính xác); TM múi 3°, k0 0,9999, +500 000 m.

/* số đèn đầu TỦ MỚI (tủ ĐKCS khác, đánh lại từ đầu): T<n>.L<m>.<số> → T(lớn nhất + 1).L1.1 giữ dấu + độ rộng;
   dãy chưa có T (1, 2… hoặc L2.05) coi là tủ 1 → T2.L1.1 / T2.L1.01 */
function soTuMoi(ds,gan){const mau=soMau(SO_TU,ds,gan);
  if(mau){let mx=+mau[2];for(const t of ds){const m=String(t||'').trim().match(SO_TU);if(m&&m[1]===mau[1])mx=Math.max(mx,+m[2])}
    return mau[1]+(mx+1)+mau[3]+'1'+mau[5]+'1'.padStart(mau[6].length,'0')}
  const q=String(gan||'').trim().match(/(\d+)$/);return 'T2.L1.'+'1'.padStart(q?q[1].length:1,'0')}
/* số đèn đầu ĐOẠN MỚI (tủ / tuyến khác): đánh lại từ đầu. Có T<n> → tủ lớn nhất + 1, lộ 1, số 1; có L<n> → L1, số 1; số trơn → 1 (giữ tiền tố, độ rộng) */
function soDauMoi(ds,gan){if(soMau(SO_TU,ds,gan))return soTuMoi(ds,gan);
  const w=d=>d.length>1&&d[0]==='0'?d.length:1;   /* giữ độ rộng chỉ khi số có 0 đầu (05 → 01; 15 → 1) */
  const g=String(gan||'').trim(),ml=g.match(SO_LO);if(ml)return ml[1]+'1'+ml[3]+'1'.padStart(w(ml[4]),'0');
  const q=g.match(/^(.*?)(\d+)$/);return q?q[1]+'1'.padStart(w(q[2]),'0'):'1'}
/* giữ bản quyền: '' = dùng được; 'lui' = đồng hồ máy lùi > 1 ngày so với lần thấy cuối; 'han' = quá han ngày chưa kiểm được máy chủ */
function khoaVi(nay,ok,thay,han){if(thay&&nay<thay-864e5)return 'lui';if(ok&&nay-ok>han*864e5)return 'han';return ''}
/* cột NGOÀI ĐOẠN CÁP (23/11 Đông Quang T1: cột 1 không nằm trên cáp mà DXF không cho biết → AI vẽ nối nhầm cột 1 vào tuyến).
   Nhận từ ghi chú cột (bỏ dấu, chữ thường, xét từng mục cách nhau «;»):
   • «ngoài cáp» · «ngoài đoạn / tuyến / phạm vi cáp» · «không có / đi / kéo / dùng cáp» → CHÍNH cột đó nằm ngoài cáp;
   • «cáp … dừng / hết» · «dừng / hết … cáp» → cáp kết thúc Ở cột đó (cột đó vẫn trên cáp): bỏ cột đó ra khỏi dây, phía có ÍT cột hơn = ngoài cáp
     (phía nhiều cột hơn là phía cáp đến). Hai phía bằng nhau thì KHÔNG đoán: trả vào mo[] để app báo Truong ghi «ngoài cáp» đúng cột cần bỏ.
   poles: [{id, code}]; edges: [[idA, idB]]. Trả {ngoai: [id…] theo thứ tự poles, mo: [id cột «cáp dừng» chưa phân được]}. */
function capNgoai(poles,edges){
  const bd=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
  const NG=/ngoai\s*(doan\s*|tuyen\s*|pham vi\s*)?cap|khong\s*(co|di|keo|dung)\s*cap/,DUNG=/\bcap\b[^;]*\b(dung|het)\b|\b(dung|het)\b[^;]*\bcap\b/;
  const ids=new Set(poles.map(p=>p.id)),adj=new Map(poles.map(p=>[p.id,[]]));
  for(const [a,b] of edges||[])if(ids.has(a)&&ids.has(b)&&a!==b){adj.get(a).push(b);adj.get(b).push(a)}
  const ngoai=new Set(),mo=[];
  for(const p of poles){const T=String(p.code||'').split(/[;\n]/).map(bd);
    if(T.some(t=>NG.test(t))){ngoai.add(p.id);continue}
    if(!T.some(t=>DUNG.test(t)))continue;
    const seen=new Set([p.id]),comps=[];   /* các phía của cột dừng = các thành phần liên thông của dây khi bỏ cột này */
    for(const s of adj.get(p.id)){if(seen.has(s))continue;const c=[],st=[s];seen.add(s);
      while(st.length){const u=st.pop();c.push(u);for(const v of adj.get(u))if(!seen.has(v)){seen.add(v);st.push(v)}}
      comps.push(c)}
    if(comps.length<2)continue;
    const mx=Math.max(...comps.map(c=>c.length));
    if(comps.filter(c=>c.length===mx).length>1){mo.push(p.id);continue}
    for(const c of comps)if(c.length<mx)for(const u of c)ngoai.add(u)}
  return {ngoai:poles.map(p=>p.id).filter(id=>ngoai.has(id)),mo}
}

const vn2=v=>(+v).toLocaleString('vi-VN',{minimumFractionDigits:2,maximumFractionDigits:2});
const vn3=v=>(+v).toLocaleString('vi-VN',{minimumFractionDigits:3,maximumFractionDigits:3});

function hcCot(p){if(D.hcTat||p.lat==null||p.lon==null||!(D.mocDo||[]).length)return null;return hcTinh(D.mocDo,+p.lat,+p.lon,p.gt||p.t)}
function vnGoc(p){if(p.lat==null||p.lon==null)return null;const r=VN.tu84(+p.lat,+p.lon,ktt());return {x:r[0],y:r[1]}}
/* hiệu chỉnh trung bình của các cột GPS đã hiệu chỉnh — dùng cho điểm vẽ tay (cột không GPS, đường, mốc phác) để đi cùng cột GPS */
function hcTB(){let n=0,x=0,y=0;for(const p of D.poles){const h=hcCot(p);if(h){n++;x+=h.dX;y+=h.dY}}return n?{dX:x/n,dY:y/n}:null}
function vnPhac(x,y,tb){const g=xyToGeo(x,y),r=VN.tu84(g.lat,g.lon,ktt());return {x:r[0]+(tb?tb.dX:0),y:r[1]+(tb?tb.dY:0)}}
/* toạ độ dùng khi xuất. Cột GPS: gốc + hiệu chỉnh + nắn. Cột vẽ tay đã nắn: vị trí phác (đã dời khi nắn) quy về VN-2000. */
function vnCot(p,tb){
  const g=vnGoc(p);
  if(g){const h=hcCot(p);let x=g.x+(h?h.dX:0),y=g.y+(h?h.dY:0);if(p.nan){x+=p.nan.dX;y+=p.nan.dY}return {x,y,h,goc:g}}
  if(p.nan&&D.geo){const v=vnPhac(p.x,p.y,tb===undefined?hcTB():tb);return {x:v.x,y:v.y,h:null,goc:null,phac:true}}
  return null;
}
function vnOf(p,tb){const v=vnCot(p,tb);return v&&{x:+v.x.toFixed(3),y:+v.y.toFixed(3),h:v.h,goc:v.goc,phac:v.phac}}

/* nắn: dựng bài toán từ các khoảng đo thật (khoảng cột lưu ở cột con, nối dây với cột trước) */
function nanTinh(){
  if(!D.geo)return {loi:'Chưa có cột nào lấy GPS — cần GPS để nắn trên mặt phẳng VN-2000.'};
  const tb=hcTB(),spans=[],ids=new Set();
  for(const p of D.poles){if(!p.kcThat||!p.from)continue;const f=byId(p.from),kc=+parse(p.code).kc;
    if(!f||!hasEdge(p.id,f.id)||!(kc>0))continue;spans.push({a:f.id,b:p.id,Ld:kc});ids.add(f.id);ids.add(p.id)}
  if(!spans.length)return {loi:'Chưa có khoảng đo thật nào. Chạm số khoảng cột giữa hai cột trên bản vẽ để nhập khoảng đo bằng thước / laser.'};
  const nodes=[],cu={};
  for(const p of sorted()){if(!ids.has(p.id))continue;const v=vnCot(p,tb)||vnPhac(p.x,p.y,tb);
    /* σ vị trí: cột GPS = sai số đo (≥ 1,5 m); đã hiệu chỉnh mốc = neo, nặng ký gấp 9; cột vẽ tay = 30 m (chỉ giữ dáng) */
    const a=Math.max(+p.acc||5,1.5),s=p.lat!=null?(v.h?a/3:a):30;
    nodes.push({id:p.id,X:v.x,Y:v.y,s,so:parse(p.code).so});cu[p.id]=[v.x,v.y]}
  for(const s of spans){s.k=VN.kTL(cu[s.b][1]);s.L=s.Ld*s.k;s.s=0.01}   /* khoảng đo trên mặt đất → trên lưới chiếu (× hệ số tỉ lệ) */
  const t0=performance.now(),r=nanTuyen(nodes,spans),ms=performance.now()-t0;
  const sai=P=>Math.max(...spans.map(s=>Math.abs(Math.hypot(P[s.a][0]-P[s.b][0],P[s.a][1]-P[s.b][1])/s.k-s.Ld)));
  const top=nodes.map(n=>({id:n.id,so:n.so,d:Math.hypot(r.pos[n.id][0]-n.X,r.pos[n.id][1]-n.Y)})).sort((a,b)=>b.d-a.d);
  return {spans,nodes,pos:r.pos,vong:r.vong,ms,saiTruoc:sai(cu),saiSau:sai(r.pos),dmax:top[0].d,dtb:top.reduce((s,x)=>s+x.d,0)/top.length,top};
}

/* khoảng đo thật: chạm ĐÚNG số khoảng cột (vùng chữ) trên bản vẽ; khoảng chưa có số thì nhập ở ô cột → “Khoảng đo thật”.
   Chạm chỗ khác trên đoạn dây (kể cả gần giữa khoảng) giữ hành vi cũ: đặt cột / chọn (rà 01/11). */
let lastKC=[];
const KC_DEM=6;   /* px nới quanh vùng chữ cho ngón tay */
/* h = cột chạm trúng (nếu có): số khoảng chỉ thắng khi ngón tay gần số hơn gần cột (thu nhỏ hết cỡ cột nằm sát số) */
function hitSpan(pt,h){
  let best=null,bd=Infinity;
  for(const t of lastKC){const cx=t.x+V.tx,cy=t.y+V.ty,hw=(t.hw||8)+KC_DEM;
    if(pt.x<cx-hw||pt.x>cx+hw||pt.y<cy-(t.h||10)-KC_DEM||pt.y>cy+2+KC_DEM)continue;
    const d=Math.hypot(cx-pt.x,cy-4-pt.y);if(d<bd){bd=d;best=t.id}}
  if(best&&h&&h.x!==undefined&&Math.hypot(h.x*V.s+V.tx-pt.x,h.y*V.s+V.ty-pt.y)<=bd)return null;
  return best;
}

/* thứ tự đi tuyến: đầu mỗi đoạn theo thời gian, rồi lần lượt cột nối tiếp (cả đoạn gộp từ máy khác) */
function sorted(){
  const ids=new Set(D.poles.map(p=>p.id)),kids={},out=[],seen=new Set();
  for(const p of D.poles){const f=p.from&&ids.has(p.from)?p.from:'';(kids[f]=kids[f]||[]).push(p)}
  for(const k in kids)kids[k].sort((a,b)=>a.t-b.t);
  const st=(kids['']||[]).slice().reverse();
  while(st.length){const p=st.pop();if(seen.has(p.id))continue;seen.add(p.id);out.push(p);st.push(...(kids[p.id]||[]).slice().reverse())}
  for(const p of D.poles)if(!seen.has(p.id))out.push(p);
  return out;
}

function tieuDe(){const n=D.ngay||'';return [D.ten,n&&!String(D.ten).includes(n)?n:'',D.poles.length+' cột'].filter(Boolean).join(' · ')}
function pngSvg(){
  /* tuyến dọc thì xuất ảnh đứng, tuyến ngang thì ảnh ngang — sơ đồ không bị dồn vào một dải hẹp */
  const pts=allPts();let bw=1,bh=1;
  if(pts.length){const xs=pts.map(q=>q[0]),ys=pts.map(q=>q[1]);bw=Math.max(...xs)-Math.min(...xs)||1;bh=Math.max(...ys)-Math.min(...ys)||1}
  const dung=bh>bw*1.15,w=dung?1400:1800,h=dung?1900:1300,v=fitView(w,h,95);
  let ex='';
  if(D.geo){
    /* thước tỷ lệ và hướng Bắc: chỉ khi bản vẽ có GPS (1 đơn vị = 1 m, trục y hướng Bắc) */
    const b=Math.pow(10,Math.floor(Math.log10(240/v.s)));let m=b;for(const f of [5,2,1])if(f*b*v.s<=240){m=f*b;break}
    const L=m*v.s,x0=w-40-L,y0=h-48;
    ex+=`<path class="sb" d="M${x0} ${y0-8}V${y0}H${x0+L}V${y0-8}"/><text class="sbt" x="${x0+L/2}" y="${y0-14}" text-anchor="middle">${m} m</text>`;
    ex+=`<path class="na" d="M${w-60} 84L${w-72} 120L${w-60} 112L${w-48} 120Z"/><text class="sbt" x="${w-60}" y="76" text-anchor="middle">B</text>`;
  }
  ex+=`<text class="lg" x="30" y="${h-24}">H1, H2, H4: số hòm công tơ theo loại · 3P: công tơ 3 pha · số màu xanh lá: khoảng cột (m) · <tspan style="fill:#B4361F;font-weight:700">?</tspan>: cột chưa đánh số</text>`;
  const s=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><style>${PNGCSS}</style>
    <rect width="100%" height="100%" fill="#fff"/><text class="tt" x="30" y="46">${esc(tieuDe())}</text>
    ${svgInner(v,w,h,{noGrid:true,print:true,k:1.5})}${ex}</svg>`;
  return {s,w,h};
}
async function soDoFile(){
  const {s,w,h}=pngSvg();
  const img=new Image();img.src=URL.createObjectURL(new Blob([s],{type:'image/svg+xml'}));
  try{await img.decode()}catch(e){return null}
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0);URL.revokeObjectURL(img.src);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));return blob&&new File([blob],fname('.png'),{type:'image/png'});
}
async function guiAnh(){
  const file=await soDoFile();if(!file){toast('Không tạo được ảnh');return}const blob=file;
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:D.ten});return}catch(e){if(e.name==='AbortError')return}}
  giao(blob,file.name);
}

function gop(o){
  if(!o||!Array.isArray(o.poles))throw new Error('sai dinh dang');
  const soMap={};for(const p of D.poles){const s=parse(p.code).so;if(s)soMap[norm(s)]=p}
  const exOf=p=>{const s=parse(p.code).so;return s?soMap[norm(s)]:null};
  const ip=o.poles.map(p=>[p.x,p.y]).concat(...(o.roads||[]).map(r=>r.pts),(o.mocs||[]).map(m=>[m.x,m.y]));
  let dx=0,dy=0,how;
  const shared=o.poles.find(exOf);
  if(o.geo&&D.geo){const g=D.geo,kx=111320*Math.cos(g.lat0*Math.PI/180);
    dx=g.x0+(o.geo.lon0-g.lon0)*kx-o.geo.x0;dy=g.y0-(o.geo.lat0-g.lat0)*110574-o.geo.y0;how='theo GPS'}
  else if(shared){const e=exOf(shared);dx=e.x-shared.x;dy=e.y-shared.y;how='nối tại cột '+parse(shared.code).so}
  else if(allPts().length&&ip.length){const cur=allPts(),mx=Math.max(...cur.map(q=>q[0])),my=Math.min(...cur.map(q=>q[1]));
    dx=mx+40-Math.min(...ip.map(q=>q[0]));dy=my-Math.min(...ip.map(q=>q[1]));how='đặt bên phải bản vẽ'}
  else how='bản vẽ trống';
  if(!D.geo&&o.geo)D.geo={...o.geo,x0:o.geo.x0+dx,y0:o.geo.y0+dy};
  const idm={},moi=[];let them=0,trung=0;
  for(const p of o.poles){const ex=exOf(p);
    if(ex){idm[p.id]=ex.id;trung++;if(parse(p.code).toks.length>parse(ex.code).toks.length)ex.code=p.code;continue}
    const np={...p,id:uid(),x:p.x+dx,y:p.y+dy,auto:false};idm[p.id]=np.id;moi.push([np,p.from]);D.poles.push(np);them++}
  for(const [np,f] of moi)np.from=(f&&idm[f])||null;
  for(const [a,b] of o.edges||[]){const A=idm[a],B=idm[b];if(A&&B&&A!==B&&!hasEdge(A,B))D.edges.push([A,B])}
  for(const r of o.roads||[])D.roads.push({id:uid(),w:r.w||7,ten:r.ten||'',pts:r.pts.map(q=>[q[0]+dx,q[1]+dy])});
  for(const m of o.mocs||[])D.mocs.push({id:uid(),ten:m.ten,x:m.x+dx,y:m.y+dy});
  D.mocDo=D.mocDo||[];for(const m of o.mocDo||[])if(!D.mocDo.some(x=>x.id===m.id||(x.t===m.t&&x.ten===m.ten)))D.mocDo.push({...m});
  return {them,trung,how};
}

    if(!B.length)delete DB.giongBo;saveNow();b.classList.toggle('tat',i<0);toast(i<0?'Tắt: «'+k+'» không tự sửa nữa':'Bật lại: «'+k+'» tự sửa')}
  else if(a==='gt-xoa'){const L=(DB.giongTu||[]).slice(),x=L.splice(+b.dataset.i,1)[0];DB.giongTu=L;saveNow();showGiong();if(x)toast('📖 Đã quên «'+x.noi+'»')}
  else if(a==='gt-sua'){const x=(DB.giongTu||[])[+b.dataset.i];if(!x)return;$('#gt-noi').value=x.noi;$('#gt-la').value=x.la;giongThu();$('#gt-noi').scrollIntoView({block:'center'})}
  else if(a==='xlsx')xuatXlsx();else if(a==='dxf')xuatDxf();else if(a==='dxfvn')xuatDxf(true);else if(a==='json')xuatJson();else if(a==='anh')guiAnhCot();else if(a==='png')guiAnh();
});
panel.addEventListener('input',e=>{if(e.target.id==='gt-la')giongThu()});
panel.addEventListener('keydown',e=>{if(e.key!=='Enter')return;
  if(e.target.id==='mt-ten'){e.preventDefault();mocDat(e.target.value);return}
  if(e.target.id==='gt-noi'){e.preventDefault();$('#gt-la').focus()}else if(e.target.id==='gt-la'){e.preventDefault();panel.querySelector('[data-a="gt-luu"]').click()}});
panel.addEventListener('change',async e=>{
  if(e.target.id==='gg-key'){DB.ggKey=e.target.value.trim();DB.ggPhien=null;ggDatLai();saveNow();draw();
    toast(DB.ggKey?'Đã lưu khoá Google — đang mở phiên ảnh':'Đã xoá khoá Google — dùng ảnh Esri');setTimeout(()=>{if(!panel.hidden&&$('#gg-key'))showNen()},2500);return}
  if(e.target.id==='cad-in'){const f=e.target.files&&e.target.files[0];if(f){closePanel();await cadNap(f)}return}
  if(e.target.id==='ex-ktt'||e.target.id==='cad-ktt'){const o=e.target.selectedOptions[0];
    if(e.target.value==='khac'){const t=prompt('Kinh tuyến trục (độ thập phân, vd 105 hoặc 104.75)',String(ktt()));const v=parseFloat(String(t||'').replace(',','.'));
      if(t!==null&&isFinite(v)&&v>=100&&v<=112){DB.ktt=v;DB.tinh=''}else if(t!==null)toast('Kinh tuyến trục phải trong khoảng 100–112°')}
    else{DB.ktt=+e.target.value;DB.tinh=o.textContent.split(' — ')[0]}
    saveNow();if(e.target.id==='cad-ktt'){showNen();nenVe()}else showExport();toast(`VN-2000: kinh tuyến trục ${kttTen(ktt())}`);return}
  const fl=e.target.files;if(!fl||!fl.length)return;
  if(e.target.id==='gop'){
    snap();const kq=[];
    for(const f of fl){try{const o=JSON.parse(await docFile(f));napPoles(o.poles);const r=gop(o),gn=giongNhap(o.giongTu);if(gn)kq.push(`+${gn} cụm giọng nói`);kq.push(`${f.name}: thêm ${r.them} cột${r.trung?`, ${r.trung} cột trùng số`:''} (${r.how})`)}
      catch(err){kq.push(`${f.name}: không đọc được`)}}
    save();closePanel();V=fitView(W,H,40);persistView();draw();toast(kq.join(' · '));return;
  }
  if(e.target.id==='imp'){
    if(/\.(dxf|dwg)$/i.test(fl[0].name)){closePanel();await cadNap(fl[0]);return}
    try{const o=JSON.parse(await docFile(fl[0]));
      if(o.kieu==='sao-luu'&&Array.isArray(o.ds)){const r=napSaoLuu(o);closePanel();toast(`Sao lưu: thêm ${r.them} bản vẽ${r.co?`, ${r.co} bản đã có (bỏ qua)`:''}`);return}
      if(!Array.isArray(o.poles))throw 0;napPoles(o.poles);
      const d={id:uid(),ten:o.ten||'Tuyến nhập',ngay:o.ngay||today(),poles:o.poles,edges:o.edges||[],roads:o.roads||[],mocs:o.mocs||[],mocDo:o.mocDo||[],hcTat:!!o.hcTat,geo:o.geo||null,active:null,view:null,capNhat:Date.now()};
      const gn=giongNhap(o.giongTu);DB.ds[d.id]=d;saveNow();switchTo(d);closePanel();toast('Đã mở file'+(gn?` · máy nhớ thêm ${gn} cụm giọng nói`:''))}catch(err){toast('File không đúng định dạng của app')}
  }
});
$('#b-list').addEventListener('click',showList);
$('#b-export').addEventListener('click',showExport);
$('#b-table').addEventListener('click',showTable);
$('#b-gpsp').addEventListener('click',()=>{nanCho=null;showGps()});
function switchTo(d){saveNow();cadDoi=null;denId=null;dsheet.hidden=true;qsheet.hidden=true;D=d;D.poles=D.poles||[];D.roads=D.roads||[];D.mocs=D.mocs||[];D.edges=D.edges||[];D.mocDo=D.mocDo||[];mocCho=null;nanCho=null;DB.cur=d.id;undoSt=[];editId=null;F=null;noiA=null;selRoad=null;sheet.hidden=true;rsheet.hidden=true;V=D.view||fitView(W,H,40);saveNow();title();draw();setTimeout(diaDiemBu,0)}

/* ================= sao lưu tất cả bản vẽ (mang sang máy khác / link mới) ================= */
function saoLuuHet(){const ds=Object.values(DB.ds).filter(d=>(d.poles||[]).length||(d.roads||[]).length||(d.mocs||[]).length);
  if(!ds.length){toast('Chưa có bản vẽ nào để sao lưu');return}
  const out={app:'khao-sat-tuyen',kieu:'sao-luu',ver:1,ngay:today(),ktt:DB.ktt,tinh:DB.tinh,ds,...(DB.giongTu&&DB.giongTu.length?{giongTu:DB.giongTu}:{})};
  giao(new Blob([JSON.stringify(out)],{type:'application/json'}),'SaoLuu_KhaoSat_'+today()+'.json');
  toast(`Đã sao lưu ${ds.length} bản vẽ — chưa gồm ảnh chụp và nền CAD ⚑`)}
/* nạp file sao lưu: bản vẽ trùng id + trùng lúc sửa = đã có, bỏ qua; trùng id khác nội dung thì thêm bản mới, không đè */
function napSaoLuu(o){let them=0,co=0;
  for(const d0 of o.ds){if(!d0||!Array.isArray(d0.poles))continue;const cu=DB.ds[d0.id];if(cu&&cu.capNhat===d0.capNhat){co++;continue}
    const d={...d0,id:cu||!d0.id?uid():d0.id,edges:d0.edges||[],roads:d0.roads||[],mocs:d0.mocs||[],mocDo:d0.mocDo||[],active:null};
    if(cu)d.ten=(d.ten||'Tuyến')+' (sao lưu)';napPoles(d.poles);DB.ds[d.id]=d;them++}
  giongNhap(o.giongTu);if(o.ktt&&!DB.ktt){DB.ktt=o.ktt;DB.tinh=o.tinh||''}saveNow();return {them,co}}

/* ================= giữ bản quyền (22/11 Truong) =================
   App đặt sau cổng đăng nhập Cloudflare Access: định kỳ hỏi máy chủ (sw.js?kq=…). Vào được → gia hạn.
   Không mạng quá HAN_NGAY ngày, hoặc đồng hồ máy bị lùi → khoá (bản vẽ vẫn giữ, sao lưu được). ⚑ HAN_NGAY 14
   NHA_MOI = link app mới (Cloudflare Pages); đặt xong thì máy còn mở link GitHub cũ thấy màn «App đã chuyển». */
const HAN_NGAY=14,NHA_MOI='https://khaosatdz.pages.dev/',KQK='kstuyen_kq';
function kqDoc(){try{return JSON.parse(localStorage.getItem(KQK))||{}}catch(e){return {}}}
function kqGhi(o){try{localStorage.setItem(KQK,JSON.stringify(o))}catch(e){}}
function daChuyen(){try{return !!NHA_MOI&&new URL(NHA_MOI).origin!==location.origin&&/github\.io$/.test(location.hostname)}catch(e){return false}}
function kqXet(){const q=kqDoc(),nay=Date.now();if(!q.ok)q.ok=nay;const v=daChuyen()?'chuyen':khoaVi(nay,q.ok,q.thay,HAN_NGAY);
  if(!v)q.thay=Math.max(q.thay||0,nay);kqGhi(q);hienKhoa(v)}
let kqDang=false;
async function kiemQuyen(){if(location.protocol!=='https:'||kqDang)return;kqDang=true;
  try{const r=await fetch('sw.js?kq='+Date.now(),{cache:'no-store',redirect:'manual'});const q=kqDoc();
    if(r.ok){q.ok=q.thay=Date.now();delete q.dn;kqGhi(q)}
    else if(r.type==='opaqueredirect'||r.status===401||r.status===403){if(!q.dn){q.dn=1;kqGhi(q);toast('⚑ Phiên đăng nhập app đã hết — có mạng thì đóng app mở lại để đăng nhập')}}}
  catch(e){}kqDang=false;kqXet()}
function hienKhoa(v){let el=$('#khoa');if(!v){if(el)el.remove();return}
  if(!el){el=document.createElement('div');el.id='khoa';document.body.appendChild(el)}
  const tx=v==='chuyen'?'App đã chuyển sang link mới. Bấm «Sao lưu tất cả bản vẽ» trước, rồi «Mở link mới», đăng nhập bằng email đã được cấp (chưa vào được thì nhờ người gửi link thêm email của mình), vào «Bản vẽ → Mở file» chọn file sao lưu.'
    :v==='lui'?'Ngày giờ trên điện thoại đang bị lùi. Chỉnh lại ngày giờ đúng rồi bấm «Thử lại».'
    :`Đã quá ${HAN_NGAY} ngày app chưa kiểm được bản quyền. Bật mạng (4G / Wi-Fi) rồi bấm «Thử lại».`;
  el.innerHTML=`<div class="kh"><h2>${v==='chuyen'?'📦 App đã chuyển link':'🔒 Tạm khoá app'}</h2><p>${tx}</p>
    <div class="row">${v==='chuyen'?'':'<button class="btn pri" data-k="thu">Thử lại</button>'}<button class="btn" data-k="sl">Sao lưu tất cả bản vẽ</button>${NHA_MOI?`<a class="btn pri" href="${esc(NHA_MOI)}">Mở link mới</a>`:''}</div>
    <p class="note">Bản vẽ vẫn còn nguyên trên máy này.</p></div>`}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('#khoa [data-k]');if(!b)return;if(b.dataset.k==='thu')kiemQuyen();else saoLuuHet()});

/* ================= toast / khởi động ================= */
let toastT=null;
function toast(m){const el=$('#toast');el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},3200)}
async function keepAwake(){try{if('wakeLock' in navigator&&!document.hidden)await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)keepAwake()});
new ResizeObserver(()=>{sizeUp();if(!V)V=fitView(W,H,40);draw()}).observe(stage);
sizeUp();if(!V)V=fitView(W,H,40);title();draw();keepAwake();
/* bản app mới (sw.js đổi PHIEN): máy tự tải lại, khỏi phải tắt hẳn app; đang mở ô nhập / bảng / đo GPS thì chờ xong ⚑ */
var banMoi=false,swDk=null;
/* BAN_APP phải trùng PHIEN trong sw.js (test mục 15 canh). Lần đầu mở bản mới → báo một lần để biết máy đã lên bản mới ⚑ */
try{const cu=localStorage.getItem('kstuyen_ban');if(cu!==BAN_APP){localStorage.setItem('kstuyen_ban',BAN_APP);setTimeout(()=>toast('⟳ App đã lên bản '+BAN_APP),800)}}catch(e){}
function rong(){return !editId&&!gpsM&&rsheet.hidden&&panel.hidden}
function taiLai(){try{saveNow()}catch(e){}location.reload()}
if('serviceWorker' in navigator&&location.protocol==='https:'){const coSan=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(r=>{swDk=r}).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!coSan||banMoi)return;banMoi=true;
    if(rong())taiLai();else toast('⟳ Có bản app mới — xong việc đang làm là app tự tải lại')});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(swDk)swDk.update().catch(()=>{});if(banMoi&&rong())taiLai()})}
/* bản 48: xin trình duyệt giữ dữ liệu lâu dài (không tự xoá khi máy thiếu chỗ); dữ liệu cũ hỏng thì báo đã cất ở đâu */
try{const S=navigator.storage;if(S&&S.persist)S.persisted().then(p=>p||S.persist()).catch(()=>{})}catch(e){}
if(DB_HONG){if(!DB_HONG.k){try{giao(new Blob([DB_HONG.s],{type:'application/json'}),'KhaoSat_du_lieu_hong_'+today()+'.json')}catch(e){}chanGhi=false;saveNow()}
  setTimeout(()=>toast(DB_HONG.k?'Dữ liệu cũ đọc không được — đã cất bản hỏng trên máy':'Dữ liệu cũ đọc không được — đã tải bản hỏng về máy'),4500)}
/* bản quyền: xét ngay lúc mở (không mạng vẫn xét hạn), hỏi máy chủ sau 3 s, mỗi 6 giờ, và khi mở lại app quá 1 giờ */
kqXet();setTimeout(kiemQuyen,3000);setInterval(kiemQuyen,216e5);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-(kqDoc().ok||0)>36e5)kiemQuyen()});
</script>
