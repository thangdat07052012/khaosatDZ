<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#12443B">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F1513">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Khảo sát tuyến</title>
<style>
/* Bố cục: một màn hình — thanh trên, bảng vẽ chiếm giữa, thanh công cụ dưới; ô nhập cột trượt lên từ dưới */
:root{
  --bg:#F4F6F5; --paper:#FFFFFF; --grid:#E3E9E6; --line:#CBD5D0; --fg:#15201C; --muted:#5A6964;
  --ink:#12443B; --ink-fg:#FFFFFF; --hi:#F2B01E; --hi-fg:#241A00; --hi-soft:#FBEFCB;
  --wire:#2F5FA8; --warn:#B4361F; --road:rgba(120,130,126,.22); --road-c:rgba(120,130,126,.55); --moc:#B4361F;
  --k-cot:#12443B; --k-day:#2F5FA8; --k-ct:#8A4B00; --k-sau:#6B3FA0; --k-kc:#1F7A4D; --k-gc:#56655F;
  --q-xanh:#1E9E50; --q-vang:#E0A100; --q-do:#D93025;
  --f:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Roboto Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1513; --paper:#141C19; --grid:#1F2A26; --line:#2E3B36; --fg:#E5ECE8; --muted:#ABBCB5;
  --ink:#17594C; --ink-fg:#FFFFFF; --hi:#F5BD3A; --hi-fg:#241A00; --hi-soft:#3A2F10;
  --wire:#7FA8EC; --warn:#F08A6E; --road:rgba(170,185,178,.16); --road-c:rgba(170,185,178,.4); --moc:#F08A6E;
  --k-cot:#6FD0B6; --k-day:#8FB4F0; --k-ct:#F0B060; --k-sau:#C3A0F0; --k-kc:#7AD6A0; --k-gc:#9AABA4;
  --q-xanh:#4CC77F; --q-vang:#F5C542; --q-do:#FF6B5E;
  color-scheme:dark }}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:16px;display:flex;flex-direction:column;overflow:hidden;
  -webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}

.top{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--ink);color:var(--ink-fg);min-height:54px}
.ib{min-width:40px;height:42px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:transparent;font-size:22px;line-height:1;padding:0 6px}
.ib.pri{background:var(--hi);color:var(--hi-fg);border-color:var(--hi);font-size:15px;font-weight:700}
.ttl{flex:1;min-width:0;height:42px;border:0;background:transparent;text-align:left;font-weight:700;font-size:16.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}

#stage{flex:1;position:relative;min-height:0;background:var(--paper)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#status{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
#status .pill{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;background:var(--fg);color:var(--paper);
  border-radius:999px;padding:5px 5px 5px 12px;font-size:13.5px;font-weight:600;min-height:34px}
#status .pill.solo{padding-right:12px}
#status .pill button{border:0;background:rgba(255,255,255,.2);border-radius:999px;height:26px;min-width:30px;padding:0 10px;font-size:12.5px;font-weight:700;color:inherit}
@media (prefers-color-scheme:dark){#status .pill button{background:rgba(0,0,0,.18)}}

.grid{stroke:var(--grid);stroke-width:1}
.road{stroke:var(--road);fill:none;stroke-linecap:round;stroke-linejoin:round}
.road.sel{stroke:var(--hi);opacity:.45}
.roadc{stroke:var(--road-c);fill:none;stroke-width:1.2;stroke-dasharray:6 6}
.jn{fill:var(--paper);stroke:var(--muted);stroke-width:1.6}
.ed{stroke:var(--wire);stroke-width:2.2}
.pole{fill:var(--paper);stroke:var(--fg);stroke-width:2.2}
.pole.act{stroke:var(--hi);stroke-width:3.5}
.fillk{fill:var(--fg)}
.ring{fill:none;stroke:var(--hi);stroke-width:2;stroke-dasharray:4 3}
.noiA{fill:var(--hi)}
.lb{fill:var(--fg);paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round}
.lb.so{font:700 13.5px var(--f)}
.lb.so.q{fill:var(--warn)}
.ld{stroke:var(--muted);stroke-width:1;fill:none}
.lb.dt{font:500 11px var(--f);fill:var(--muted)}
.lb.kc{font:700 11px var(--mono);fill:var(--k-kc)}
.lb.mc{font:700 12px var(--f);fill:var(--moc)}
.lb.jt{font:600 10.5px var(--f);fill:var(--muted)}
.moc{fill:var(--moc);stroke:var(--paper);stroke-width:1.5}
.hd{fill:var(--hi);stroke:var(--hi-fg);stroke-width:2}.hm{fill:var(--paper);stroke:var(--hi);stroke-width:2;stroke-dasharray:3 2}
.lb.rn{font:italic 600 12px var(--f);fill:var(--muted)}
.tmp{stroke:var(--hi);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.me{fill:#2F7DF6;stroke:#fff;stroke-width:2.5}
.meacc{fill:rgba(47,125,246,.14);stroke:rgba(47,125,246,.4)}
/* chất lượng GPS: chấm màu cạnh cột (xanh < 3 m, vàng 3–6 m, đỏ > 6 m); viền đậm = đã hiệu chỉnh theo mốc; khung vuông = đã nắn theo khoảng đo */
.qd{stroke:var(--paper);stroke-width:1.2}.qd.hc{stroke:var(--fg);stroke-width:1.8}
.q-xanh{fill:var(--q-xanh)}.q-vang{fill:var(--q-vang)}.q-do{fill:var(--q-do)}
.nanmk{fill:none;stroke:var(--k-kc);stroke-width:1.8}
.mdo{fill:var(--paper);stroke:var(--moc);stroke-width:2.2}
.qdot{display:inline-block;width:11px;height:11px;border-radius:50%;flex:0 0 auto;vertical-align:-1px;background:var(--muted)}
.qdot.q-xanh{background:var(--q-xanh)}.qdot.q-vang{background:var(--q-vang)}.qdot.q-do{background:var(--q-do)}
#status .pill.nhac{background:var(--q-do);color:#fff}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg .btn{height:44px}
.kq{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.5}
.kq b.mono,.mono{font-family:var(--mono)}
.h3{margin:6px 0 0;font-size:16px}

.tools{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
  background:var(--bg);border-top:1px solid var(--line)}
.tools button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:56px;border-radius:12px;
  border:1.5px solid transparent;background:transparent;font-size:11.5px;font-weight:600;color:var(--muted);min-width:0}
.tools button i{font-style:normal;font-size:19px;line-height:22px;color:var(--fg);display:flex;align-items:center;justify-content:center;height:22px}
.tools button.on{background:var(--hi-soft);border-color:var(--hi);color:var(--fg)}
.ic-tron{display:inline-block;width:17px;height:17px;border-radius:50%;border:2.5px solid currentColor}
.ic-vuong{display:inline-block;width:15px;height:15px;border:2.5px solid currentColor}
.ic-road{display:inline-block;width:22px;height:9px;border-radius:5px;background:var(--road-c)}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);
  border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);padding:8px 10px 0;
  display:flex;flex-direction:column;gap:4px;max-height:62%;overflow:hidden}
/* ô nhập cột: cột dọc cố định — thanh kéo, hàng nút, lưới ô (không cuộn), vùng lựa chọn (tự cuộn), hàng nút dưới.
   Cao cố định 62% để lưới ô không nhảy khi đổi ô; màn hình thấp (xoay ngang) thì cuộn cả ô nhập như cũ. */
#sheet:not(.mini){height:62%}
@media (max-height:520px){#sheet:not(.mini){height:auto;max-height:85%;overflow-y:auto}#sheet .opts{flex:0 0 auto;overflow:visible}}
.grip{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0 3px;margin-top:-2px;width:100%;flex:0 0 auto;touch-action:none}
.grip span{width:46px;height:5px;border-radius:3px;background:var(--line)}
.grip em{display:none;font-style:normal;font-size:12.5px;font-weight:600;color:var(--fg);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet.mini .slots,.sheet.mini .opts,.sheet.mini .shh{display:none}
.sheet.mini .grip em{display:block}
.shh{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.grow{flex:1}
.btn{height:38px;border-radius:9px;border:1.5px solid var(--line);background:var(--paper);padding:0 10px;font-weight:700;font-size:13.5px;white-space:nowrap}
.btn.sm{height:34px;padding:0 8px;font-size:12.5px}
/* ảnh cột (03/11): dải ảnh nhỏ trong ô nhập + màn xem ảnh */
.anhs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 2px;flex:0 0 auto}
.anhs img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid #0002;flex:0 0 auto}
#sh-anh-n:not(:empty){margin-left:3px;font-weight:700}
.anhxem{position:fixed;inset:0;z-index:60;background:#000e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px}
.anhxem img{max-width:100%;max-height:78vh;border-radius:6px}
.anhxem .row{display:flex;gap:10px}
.btn.pri{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.btn.danger{color:var(--warn);border-color:currentColor;background:transparent}
.btn.armed{background:var(--warn);color:#fff;border-color:var(--warn)}
.sact{flex:0 0 auto;background:var(--bg);display:flex;gap:6px;padding:6px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.sact .btn{flex:1;padding:0 6px}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;flex:0 0 auto}
#slots{grid-template-columns:repeat(3,minmax(0,1fr))}
.sl{position:relative;min-height:32px;border:1.5px solid var(--line);border-radius:7px;background:var(--paper);padding:1px 20px 1px 5px;
  display:flex;flex-direction:column;justify-content:center;min-width:0;cursor:pointer}
.sl .k{font-size:9.5px;font-weight:600;color:var(--muted);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl .k.e{font-size:11px;font-weight:600;color:var(--muted)}
.sl.e{padding-right:5px}
.sl .v{font:700 12.5px var(--f);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl.mono .v{font-family:var(--mono)}
.sl.on{border:2px solid var(--hi);background:var(--hi-soft)}
.sl.on .k.e{color:var(--fg)}
.sl.wide{grid-column:1/-1}
.sl.vn{display:flex;flex-direction:column;gap:2px;padding:8px 12px;border-radius:14px;min-height:0}
.sl.vn .k{font-size:12.5px}.sl.vn select{font:700 15.5px var(--f);border:0;background:transparent;color:var(--fg);padding:4px 0;width:100%}
.sl .x{position:absolute;right:0;top:50%;transform:translateY(-50%);width:22px;height:30px;border:0;background:transparent;color:var(--muted);font-size:15px;padding:0}
.rin{border:0;background:transparent;color:var(--fg);font:700 15px var(--f);padding:0;min-width:0;width:100%}
.opts{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding:4px 0 6px;flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ot{font-size:10px;line-height:1.2;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;flex:0 0 auto}
.og{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:4px}
.og.wv{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.o{min-height:34px;border-radius:7px;border:1.5px solid var(--line);background:var(--paper);font:600 13px var(--mono);padding:1px 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.o.t{font-family:var(--f)}
.o.on{background:var(--hi);border-color:var(--hi);color:var(--hi-fg)}
.typ{display:flex;gap:4px}
.typ .inp{flex:1;min-width:0;height:34px;border-radius:7px;border:1.5px solid var(--line);background:var(--paper);color:var(--fg);font:600 15px var(--mono);padding:0 8px}
.cnt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.cn{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:7px;background:var(--paper);min-width:0}
.cn.has{border-color:var(--hi);background:var(--hi-soft)}
.cn span{flex:1;padding-left:7px;font-weight:600;font-size:12.5px;min-width:0}
.cn b{min-width:20px;text-align:center;font:700 14.5px var(--mono)}
.cn button{flex:0 0 36px;height:34px;border:0;background:transparent;font-size:19px;font-weight:700}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0 0 10px}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.tbl{border-collapse:collapse;width:max-content;min-width:100%;font-size:13.5px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;white-space:nowrap}
.tbl th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tbl td.m{font-family:var(--mono);font-weight:600}
.tbl tr[data-id]{cursor:pointer}
.tbl tr[data-id]:active{background:var(--hi-soft)}

#panel{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.pin{max-width:640px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:12px}
.pin h2{margin:0;font-size:20px}
.card{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 14px}
.card .tx{flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:0}
.card .tx b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .tx span{font:13px var(--mono);color:var(--muted)}
.card.cur{border-color:var(--hi);border-width:2px}
.big{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:var(--paper);
  border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.big b{font-size:16.5px}.big span{font-size:13.5px;color:var(--muted)}
.big.pri{border-color:var(--ink)}
.note{font-size:13.5px;color:var(--muted);line-height:1.55;margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 160px}
label.btn{display:flex;align-items:center;justify-content:center}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .16s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}}}
</style>
</head>
<body>
<header class="top">
  <button id="b-list" class="ib" aria-label="Danh sách bản vẽ">☰</button>
  <button id="b-title" class="ttl" aria-label="Đổi tên tuyến">Tuyến</button>
  <button id="b-undo" class="ib" aria-label="Hoàn tác">↶</button>
  <button id="b-fit" class="ib" aria-label="Xem toàn bộ">⤢</button>
  <button id="b-gpsp" class="ib" aria-label="GPS chính xác: chế độ đo, mốc hiệu chỉnh, nắn tuyến">◎</button>
  <button id="b-table" class="ib" aria-label="Bảng cột">▤</button>
  <button id="b-export" class="ib pri">Xuất</button>
</header>
<div id="stage"><svg id="cv" role="img" aria-label="Sơ đồ tuyến"></svg><div id="status"></div></div>
<nav class="tools" aria-label="Công cụ">
  <button data-tool="cot" class="on"><i><span class="ic-tron"></span></i>Cột</button>
  <button data-tool="duong"><i><span class="ic-road"></span></i>Đường</button>
  <button data-tool="moc"><i>⚑</i>Mốc</button>
  <button data-tool="chon"><i>✥</i>Dời</button>
  <button data-tool="noi"><i>╱</i>Nối dây</button>
  <button id="b-gps"><i>⌖</i><span id="gps-lab">GPS</span></button>
</nav>
<section id="sheet" class="sheet" hidden aria-label="Nhập cột">
  <button id="sh-grip" class="grip" type="button" aria-label="Thu gọn hoặc mở rộng ô nhập"><span></span><em id="sh-sum"></em></button>
  <div class="shh">
    <button id="sh-prev" class="btn sm" aria-label="Cột trước">◀</button>
    <button id="sh-next" class="btn sm" aria-label="Cột sau">▶</button>
    <button id="sh-copy" class="btn sm">⧉ Giống cột trước</button>
    <button id="sh-anh" class="btn sm" aria-label="Chụp ảnh cột">📷<span id="sh-anh-n"></span></button>
    <span class="grow"></span>
    <button id="sh-del" class="btn sm danger">Xoá</button>
  </div>
  <input id="anh-in" type="file" accept="image/*" capture="environment" hidden>
  <div id="sh-anhs" class="anhs" hidden></div>
  <div id="slots" class="slots"></div>
  <div id="opts" class="opts"></div>
  <div class="sact">
    <button id="sh-new" class="btn">Đoạn mới</button>
    <button id="sh-end" class="btn">Dừng</button>
    <button id="sh-ok" class="btn pri">Tiếp ▸</button>
  </div>
</section>
<section id="rsheet" class="sheet" hidden aria-label="Sửa đường">
  <div class="shh"><b style="font-size:15.5px">Sửa đường</b><span class="grow"></span>
    <button id="rs-del" class="btn sm danger">Xoá đường</button><button id="rs-ok" class="btn sm pri">Xong</button></div>
  <div class="slots">
    <label class="sl"><span class="k">Tên đường</span><input id="rs-ten" class="rin" placeholder="QL10, đường thôn…" autocomplete="off"></label>
    <div class="cn"><span>Rộng <b id="rs-wv">15</b> m</span><button type="button" data-rw="-1" aria-label="Hẹp lại">−</button><button type="button" data-rw="1" aria-label="Rộng ra">+</button></div>
  </div>
  <p class="hint">Kéo chấm vàng ở hai đầu để sửa vị trí. Kéo chấm rỗng giữa đoạn để thêm điểm gấp; giữ lâu một điểm để bỏ. Vẽ nhánh: chạm điểm ngoài rồi chạm vào thân đường.</p>
</section>
<section id="panel" hidden></section>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script src="xlsx.full.min.js" defer></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const LSK='kstuyen_v1';
const SHAPE_NAME={tron:'Cột tròn',vuong:'Cột vuông',cs:'Cột CS',tba:'TBA'};

/* ================= lưu trữ ================= */
let DB=(()=>{try{return JSON.parse(localStorage.getItem(LSK))||{ds:{},cur:null}}catch(e){return {ds:{},cur:null}}})();
DB.snap=true;
/* nâng cấp một lần: đường vẽ mới mặc định rộng 15 m (bản cũ 7 m); người dùng vẫn chỉnh −/+ như cũ, đường đã vẽ giữ nguyên */

/* dây: bỏ chữ VX (cáp vặn xoắn) — đổi sang ABC; chỉ đổi mã dây (dây dẫn, thay dây, dây sau công tơ), ghi chú để nguyên */
function doiVX(code){
  const t=String(code||'').split(';');
  return t.map((x,i)=>{if(!i||!/vx/i.test(x))return x;const k=kindOf(x);if(k!=='day'&&k!=='sau')return x;
    return x.replace(/(^|[>→:]\s*)(\s*\d*)VX(?=\s*\d)/gi,(m,a,b)=>a+b+'ABC')}).join(';');
}
/* nạp danh sách cột (localStorage, file mở / gộp): đổi VX → ABC, bỏ cột toạ độ VN-2000 do lần xuất trước ghi kèm */
function napPoles(ps){let n=0;for(const p of ps||[]){const c=doiVX(p.code);if(c!==p.code){p.code=c;n++}for(const k of ['X_VN2000','Y_VN2000','X_VN2000_goc','Y_VN2000_goc','hieuChinhTheoMoc','chatLuongGPS'])delete p[k]}return n}

/* ================= đọc mã cột ================= */
const norm=t=>String(t).toUpperCase().replace(/\s+/g,'');
const DD=/^(ĐỠ|NÉO|GÓC|CUỐI|RẼ|ĐẦU|NGHIÊNG|NỨT|GÃY|TRONGNGÕ|RUỘNG|VƯỜN)/;
const SAU_RE=/^\s*(s|sau|sct)\s*:\s*/i;
function kindOf(tok){
  const u=norm(tok);if(!u)return '';
  if(/^GC:/.test(u))return 'gc';
  if(/^(S|SAU|SCT):/.test(u))return 'sau';
  if(/^\d+([.,]\d+)?M$/.test(u))return 'kc';
  if(/^(H1|H2|H4|3P|3PHA)[:=]\d+$/.test(u))return 'ct';
  if(/^TỦCŨ[:=]?\d+$/.test(u))return 'tucu';
  if(/^(TỦ|TỦMỚI|TM)[:=]?\d+$/.test(u))return 'tu';
  const parts=u.split(/>|→/), base=parts[0]||parts[1]||'';
  if(/^\d*(LT|H|BT|NPC)\d+([.,]\d+)?M?$/.test(base)||/^\d*CỘT(GỖ|THÉP|SẮT)$/.test(base)||base==='NHỔBỎ')return 'cot';
  if(/^\d*(CXV|DSTA)/.test(base)||/^\d*MULLER/.test(base))return 'sau';   /* cáp ngầm Cu/XLPE/PVC/DSTA đi cùng nhóm CXV */
  if(/^\d*(ABC|VX|AV|A|CU|M|AC)\d/.test(base)||base==='THUHỒI')return 'day';   /* VX = mã cũ của ABC, vẫn nhận khi đọc dữ liệu cũ */
  if(DD.test(u))return 'dd';
  return 'gc';
}
function splitCode(s){const t=String(s||'').split(';').map(x=>x.trim());return [t[0]||''].concat(t.slice(1).filter(Boolean))}
function parse(code){
  const toks=splitCode(code);
  const r={so:toks[0],cotHT:[],cotTT:[],dayHT:[],dayTT:[],sau:[],dd:[],gc:[],kc:'',h1:0,h2:0,h4:0,p3:0,tuMoi:0,tuCu:0,toks:[]};
  for(const t of toks.slice(1)){
    const k=kindOf(t);r.toks.push({t,k});
    if(k==='cot'||k==='day'){const [a,b]=t.split(/>|→/).map(s=>s.trim());if(a)r[k+'HT'].push(a);if(b)r[k+'TT'].push(b)}
    else if(k==='sau')r.sau.push(t.replace(SAU_RE,''));
    else if(k==='kc')r.kc=parseFloat(t.replace(',','.'));
    else if(k==='ct'){const u=norm(t),n=+u.split(/[:=]/)[1]||0;r[u.startsWith('H1')?'h1':u.startsWith('H2')?'h2':u.startsWith('H4')?'h4':'p3']+=n}
    else if(k==='tu')r.tuMoi+=+norm(t).replace(/^\D+/,'')||0;
    else if(k==='tucu')r.tuCu+=+norm(t).replace(/^\D+/,'')||0;
    else if(k==='dd')r.dd.push(t);
    else r.gc.push(t.replace(/^\s*gc\s*:\s*/i,''));
  }
  return r;
}
/* viết hoa chữ ký hiệu (abc4x120 → ABC4x120) khi chốt cột; ghi chú để nguyên */
function chuanHoa(code){
  const t=splitCode(code);
  return t.map((x,i)=>{
    if(!i)return x;const k=kindOf(x);
    if(!['cot','day','sau','ct'].includes(k)||/\s/.test(x.replace(SAU_RE,'')))return x;
    return x.replace(/[a-zA-ZđĐ]+/g,(m,o,s)=>/^x$/i.test(m)&&/\d/.test(s[o-1]||'')&&/\d/.test(s[o+1]||'')?'x':m.toUpperCase());
  }).join(';')+(t.length>1?';':'');
}
/* một lần: dữ liệu đã lưu còn mã VX… → ABC… (DB.vxv đánh dấu đã đổi) */
if(DB.vxv!==1){let n=0;for(const d of Object.values(DB.ds))n+=napPoles(d.poles||[]);DB.vxv=1;try{localStorage.setItem(LSK,JSON.stringify(DB))}catch(e){}}
const J=a=>a.join(' + ');
const pair=(h,t)=>h.length||t.length?(J(h)||'—')+(t.length?' → '+J(t):''):'';
function ctText(r){return [['H1',r.h1],['H2',r.h2],['H4',r.h4],['3P',r.p3]].filter(x=>x[1]).map(x=>x[0]+':'+x[1]).join(' ')}
function tuText(r){return [r.tuMoi?r.tuMoi+' tủ mới':'',r.tuCu?r.tuCu+' tủ cũ':''].filter(Boolean).join(', ')}
function isDoi(p,r){return !!p.doi||/^2/.test((r||parse(p.code)).cotHT[0]||'')}
function ddText(p,r){const a=[];if(p.shape==='tba'||p.shape==='cs')a.push(SHAPE_NAME[p.shape]);if(p.doi&&!/^2/.test(r.cotHT[0]||''))a.push('Cột đôi');return a.concat(r.dd)}
function labelLines(p,r){
  return [[pair(r.cotHT,r.cotTT),pair(r.dayHT,r.dayTT)].filter(Boolean).join(' · '),
    [ctText(r),J(r.sau),tuText(r)].filter(Boolean).join(' · '),
    r.dd.concat(r.gc).join('; ')].filter(Boolean);
}
function wrap(s,n){const out=[];let cur='';for(const w of s.split(' ')){if(cur&&(cur+' '+w).length>n){out.push(cur);cur=w}else cur=cur?cur+' '+w:w}if(cur)out.push(cur);return out}
function parseSo(s){const m=String(s||'').trim().split(/\s+/)[0].match(/^(.*?)(\d+)$/);return m?{pre:m[1],num:+m[2],w:m[2].length}:null}
function soTiep(a,b){const pa=parseSo(a);if(!pa)return '';let step=1;
  if(b){const pb=parseSo(b);if(pb&&pb.pre===pa.pre&&pb.num-pa.num===1)step=-1}
  const v=pa.num+step;return v<0?'':pa.pre+String(v).padStart(pa.w,'0')}   /* giữ số 0 đứng đầu: C01 → C02 */

/* ================= hình học đường ================= */
function nearestOn(pts,x,y){
  let best=null,acc=0;
  for(let i=0;i<pts.length-1;i++){
    const [ax,ay]=pts[i],[bx,by]=pts[i+1],dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy);if(!L)continue;
    const t=Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/(L*L))),px=ax+t*dx,py=ay+t*dy,d=Math.hypot(x-px,y-py);
    if(!best||d<best.d)best={d,px,py,s:acc+t*L,ux:dx/L,uy:dy/L,side:Math.sign((dx/L)*(y-py)-(dy/L)*(x-px))||1};
    acc+=L;
  }
  return best;
}
function pointAt(pts,s){
  let acc=0;
  for(let i=0;i<pts.length-1;i++){
    const [ax,ay]=pts[i],[bx,by]=pts[i+1],L=Math.hypot(bx-ax,by-ay);if(!L)continue;const ux=(bx-ax)/L,uy=(by-ay)/L;
    if(s<=acc+L||i===pts.length-2){const t=Math.max(s-acc,i===0?s-acc:0);return {x:ax+ux*t,y:ay+uy*t,ux,uy}}
    acc+=L;
  }
  return {x:pts[0][0],y:pts[0][1],ux:1,uy:0};
}
function nearestRoad(x,y,extra){
  let best=null;
  for(const r of D.roads){const n=nearestOn(r.pts,x,y);if(n&&n.d<=r.w/2+extra&&(!best||n.d<best.n.d))best={r,n}}
  return best;
}
function roadMid(r){let best=0,bi=0;for(let i=0;i<r.pts.length-1;i++){const L=Math.hypot(r.pts[i+1][0]-r.pts[i][0],r.pts[i+1][1]-r.pts[i][1]);if(L>best){best=L;bi=i}}
  return [(r.pts[bi][0]+r.pts[bi+1][0])/2,(r.pts[bi][1]+r.pts[bi+1][1])/2]}
function offsetPts(pts,o){return pts.map((p,i)=>{const a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)];
  let ux=b[0]-a[0],uy=b[1]-a[1];const L=Math.hypot(ux,uy)||1;ux/=L;uy/=L;return [p[0]-uy*o,p[1]+ux*o]})}
function junctions(){
  const out=[],add=(x,y,n)=>{const e=out.find(j=>Math.hypot(j.x-x,j.y-y)<4);if(e)e.n=Math.max(e.n,n);else out.push({x,y,n})};
  const R=D.roads;
  for(let i=0;i<R.length;i++)for(let j=0;j<R.length;j++){if(i===j)continue;
    for(const e of [R[i].pts[0],R[i].pts[R[i].pts.length-1]]){const n=nearestOn(R[j].pts,e[0],e[1]);
      if(n&&n.d<0.8){const L=R[j].pts.length,end=Math.hypot(n.px-R[j].pts[0][0],n.py-R[j].pts[0][1])<0.8||Math.hypot(n.px-R[j].pts[L-1][0],n.py-R[j].pts[L-1][1])<0.8;
        if(!end)add(n.px,n.py,3)}}
    if(j<i)continue;
    const A=R[i].pts,B=R[j].pts;
    for(let a=0;a<A.length-1;a++)for(let b=0;b<B.length-1;b++){
      const [x1,y1]=A[a],[x2,y2]=A[a+1],[x3,y3]=B[b],[x4,y4]=B[b+1],den=(x1-x2)*(y3-y4)-(y1-y2)*(x3-x4);if(Math.abs(den)<1e-9)continue;
      const t=((x1-x3)*(y3-y4)-(y1-y3)*(x3-x4))/den,u=-((x1-x2)*(y1-y3)-(y1-y2)*(x1-x3))/den;
      const inA=(t>0.001&&t<0.999)||(t>=-1e-9&&t<=1+1e-9&&((a>0&&t<=0.001)||(a<A.length-2&&t>=0.999)));
      const inB=(u>0.001&&u<0.999)||(u>=-1e-9&&u<=1+1e-9&&((b>0&&u<=0.001)||(b<B.length-2&&u>=0.999)));
      if(inA&&inB)add(x1+t*(x2-x1),y1+t*(y2-y1),4)}
  }
  return out;
}

/* ================= mô hình ================= */
const byId=id=>D.poles.find(p=>p.id===id);
const activeP=()=>D.active?byId(D.active):null;
const hasEdge=(a,b)=>D.edges.some(([x,y])=>(x===a&&y===b)||(x===b&&y===a));
let undoSt=[];
function snap(){undoSt.push(JSON.stringify({poles:D.poles,edges:D.edges,roads:D.roads,mocs:D.mocs,mocDo:D.mocDo||[],hcTat:!!D.hcTat,geo:D.geo,active:D.active}));if(undoSt.length>60)undoSt.shift()}
function nextCode(prev,gpsKc){
  if(!prev)return D.poles.length?'':'1';   /* bản vẽ trống: cột đầu gợi ý số 1 */
  const pp=prev.from?byId(prev.from):null;
  const r=parse(prev.code);
  const so=soTiep(r.so,pp?parse(pp.code).so:null);
  const carry=r.toks.filter(x=>x.k==='cot'||x.k==='day').map(x=>x.t.split(/>|→/)[0].trim()).filter(Boolean);
  const t=[so,...carry];if(gpsKc)t.push(gpsKc+'m');
  return t.join(';')+';';
}
const inheritShape=p=>!p||p.shape==='tba'?'tron':p.shape;
function snapToRoad(x,y){
  if(!DB.snap||!D.roads.length)return {x,y};
  const b=nearestRoad(x,y,Math.max(6,26/V.s));if(!b)return {x,y};
  const o=b.r.w/2+1.5,n=b.n;return {x:n.px+n.side*o*(-n.uy),y:n.py+n.side*o*n.ux};
}
function addPole(x,y,shape,gps,auto){
  snap();
  const prev=activeP();
  if(prev){prev.code=chuanHoa(prev.code);prev.auto=false}
  let kc='';if(gps&&prev&&prev.lat!=null)kc=Math.round(haversine(prev,gps));
  const p={id:uid(),x,y,shape:shape||inheritShape(prev),doi:!!(prev&&prev.doi&&prev.shape!=='tba'),code:nextCode(prev,kc),from:prev?prev.id:null,t:Date.now()};
  if(gps){p.lat=+gps.lat.toFixed(8);p.lon=+gps.lon.toFixed(8);p.acc=+gps.acc.toFixed(1);p.gt=gps.t||Date.now();if(gps.n)p.gn=gps.n}
  if(auto){p.auto=true;p.autoCode=p.code}
  D.poles.push(p);if(prev)D.edges.push([prev.id,p.id]);
  D.active=p.id;save();draw();openSheet(p);
}
function removePole(id){
  D.poles=D.poles.filter(p=>p.id!==id);D.edges=D.edges.filter(([a,b])=>a!==id&&b!==id);
  for(const p of D.poles)if(p.from===id)p.from=null;
  if(D.active===id)D.active=null;save();
}
/* cột tự đặt mà chưa nhập gì thì bỏ khi rời đi */
function dropAuto(){const p=editId&&byId(editId);if(p&&p.auto&&p.code===p.autoCode){const f=p.from;removePole(p.id);D.active=f||null;return true}return false}
function nextPos(p){
  const f=p.from?byId(p.from):null;
  let sp=+parse(p.code).kc||(f?Math.hypot(p.x-f.x,p.y-f.y):30);sp=Math.min(Math.max(sp,5),200);
  const b=D.roads.length?nearestRoad(p.x,p.y,8):null;
  if(b){const r=b.r,n=b.n;let dir=1;
    if(f){const nf=nearestOn(r.pts,f.x,f.y);if(nf&&nf.s>n.s)dir=-1}
    const q=pointAt(r.pts,n.s+dir*sp),o=n.d,side=n.side;
    return {x:q.x+side*o*(-q.uy),y:q.y+side*o*q.ux};
  }
  let ux=1,uy=0;if(f){const L=Math.hypot(p.x-f.x,p.y-f.y);if(L>0.01){ux=(p.x-f.x)/L;uy=(p.y-f.y)/L}}
  return {x:p.x+ux*sp,y:p.y+uy*sp};
}

/* ================= vẽ ================= */
const cv=$('#cv'), stage=$('#stage');
let W=0,H=0,V=D.view||null,tool='cot',noiA=null,editId=null,selRoad=null,roadStart=null,fix=null,watchId=null,tmpRoad=null;
function sizeUp(){const r=stage.getBoundingClientRect();W=r.width;H=r.height;cv.setAttribute('viewBox',`0 0 ${W} ${H}`)}
function allPts(){const a=D.poles.map(p=>[p.x,p.y]);for(const r of D.roads)a.push(...r.pts);for(const m of D.mocs)a.push([m.x,m.y]);return a}
function fitView(w,h,pad){
  const pts=allPts();if(!pts.length)return {s:3,tx:w/2,ty:h/2};
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const [x,y] of pts){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}
  const bw=Math.max(x1-x0,20),bh=Math.max(y1-y0,20);
  const s=Math.min(Math.max(Math.min((w-2*pad-120)/bw,(h-2*pad)/bh),0.2),20);
  return {s,tx:w/2-(x0+x1)/2*s-40,ty:h/2-(y0+y1)/2*s};
}
function symSvg(p,x,y,R,cls,r){
  const one=(cx)=>p.shape==='vuong'?`<rect class="${cls}" x="${cx-R}" y="${y-R}" width="${2*R}" height="${2*R}"/>`
    :p.shape==='cs'?`<circle class="${cls}" cx="${cx}" cy="${y}" r="${R}"/><path class="${cls}" style="fill:none" d="M${cx-R*.7} ${y-R*.7}L${cx+R*.7} ${y+R*.7}M${cx+R*.7} ${y-R*.7}L${cx-R*.7} ${y+R*.7}"/>`
    :`<circle class="${cls}" cx="${cx}" cy="${y}" r="${R}"/>`;
  if(p.shape==='tba'){const a=R*1.5;return `<rect class="${cls}" x="${x-a}" y="${y-a}" width="${2*a}" height="${2*a}"/><path class="fillk" d="M${x-a} ${y+a}L${x+a} ${y-a}L${x+a} ${y+a}Z"/>`}
  return isDoi(p,r)?one(x-R*0.95)+one(x+R*0.95):one(x);
}
/* ---------- đặt nhãn tránh đè nhau ----------
   Tính trong hệ toạ độ chưa dịch (x*s, y*s); khi vẽ cộng thêm tx, ty. Kéo bản đồ không phải tính lại.
   Mỗi nhãn thử lần lượt: phải, trái, trên, dưới cột; hết chỗ thì đặt xa hơn và kẻ đường dẫn về cột. */
let LCACHE=null;
function layout(v,w,h,o,pr,JN){
  const k=o.k||1,s=v.s,X=x=>x*s,Y=y=>y*s;
  const sig=o.print?null:[s,k,D.id,editId||'',D.poles.map(p=>p.id+','+p.x.toFixed(2)+','+p.y.toFixed(2)+','+p.shape+(p.doi?1:0)+(p.kcThat?'!':'')+','+p.code).join('|'),
    D.edges.map(e=>e.join()).join(),JN.map(j=>j.x.toFixed(1)+','+j.y.toFixed(1)).join(),D.mocs.map(m=>m.x.toFixed(1)+m.y.toFixed(1)+m.ten).join(),
    D.roads.map(r=>(r.ten||'')+r.w+':'+r.pts.join()).join()].join('#');
  if(sig&&LCACHE&&LCACHE.sig===sig)return LCACHE.L;
  const R=7*k,sz1=o.print?20:13.5,sz2=o.print?15:11,szk=o.print?15:11,szj=o.print?14:10.5,szm=o.print?17:12,szr=o.print?16:12,lh=12.5*k,CW=.58;
  const obs=[],add=(x0,y0,x1,y1,wt)=>obs.push({x0,y0,x1,y1,wt});
  const ov=(a,b)=>Math.max(0,Math.min(a.x1,b.x1)-Math.max(a.x0,b.x0))*Math.max(0,Math.min(a.y1,b.y1)-Math.max(a.y0,b.y0));
  /* ảnh xuất: chừa dải tiêu đề ở trên và chú giải ở dưới */
  const area=o.print?{x0:12-v.tx,y0:70-v.ty,x1:w-12-v.tx,y1:h-80-v.ty}:null;
  const cost=b=>{let c=0;for(const q of obs){const a=ov(b,q);if(a)c+=a*q.wt}if(area)c+=((b.x1-b.x0)*(b.y1-b.y0)-ov(b,area))*6;return c};
  const pick=(cs,bw,bh)=>{let best=null;
    /* vị trí sát cột được ưu tiên: chạm nhẹ mép đường vẫn hơn phải kẻ đường dẫn ra xa */
    const pen=(c,i)=>i*3+(c[2]?bw*bh*.08+60:0);
    for(let i=0;i<cs.length;i++){const c=cs[i],b={x0:c[0],y0:c[1],x1:c[0]+bw,y1:c[1]+bh},cc=cost(b),sc=cc+pen(c,i);
      if(!best||sc<best.sc)best={b,c:cc,sc,i,far:!!c[2]};if(cc===0)break}
    return best};

    if(noiA!==h.id){snap();if(hasEdge(noiA,h.id)){D.edges=D.edges.filter(([a,b])=>!((a===noiA&&b===h.id)||(a===h.id&&b===noiA)));toast('Đã bỏ dây nối')}
      else{D.edges.push([noiA,h.id]);toast('Đã nối dây')}save()}
    noiA=null;draw();return;
  }
  if(tool==='duong'){const w=toW(pt);
    if(roadStart){const a=roadStart;roadStart=null;makeRoad(a,w);return}
    const r=hitRoad(pt);if(r){openRoad(r);return}
    if(selRoad){closeRoad();return}
    roadStart=w;draw();return}
  if(tool==='moc'){
    if(h&&h.ten!==undefined){const t=prompt('Tên mốc (xoá hết chữ để bỏ mốc)',h.ten);if(t===null)return;snap();
      if(t.trim())h.ten=t.trim();else D.mocs=D.mocs.filter(m=>m!==h);save();draw();return}
    const [x,y]=toW(pt);const t=prompt('Tên mốc (vd: Ngã tư chợ, Cổng UBND)','');if(t===null)return;
    snap();D.mocs.push({id:uid(),x,y,ten:t.trim()||'Mốc'});save();draw();return;
  }
  if((!h||h.ten===undefined)&&(tool==='cot'||tool==='chon')){const sp=hitSpan(pt,h);if(sp){nhapKcThat(sp);return}}
  if(h&&h.ten===undefined){if(h.id!==editId)dropAuto();D.active=h.id;save();openSheet(byId(h.id)||h);return}
  if(tool==='chon'){finishSheet();return}
  const [wx,wy]=toW(pt),q=snapToRoad(wx,wy),ed=editId&&byId(editId);
  if(ed&&ed.auto){snap();ed.x=q.x;ed.y=q.y;save();draw();return}
  addPole(q.x,q.y);
}

const BASE={

   ('VX' giữ cạnh 'ABC' chỉ để xếp dữ liệu cũ chưa đổi; DSTA3x10+1x6 xếp theo phần 3x10) */
const ORD=['LT','H','BT','NPC','ABC','VX','AV','A','AC','CXV','DSTA','CU','M','MULLER'];
function sizeKey(v){
  const u=norm(v),m=u.match(/^(\d*)([A-ZĐ]+)(\d+(?:[.,]\d+)?)(?:X(\d+(?:[.,]\d+)?))?(?:\+[\dX.,+]*)?$/),f=x=>parseFloat(String(x).replace(',','.'));
  if(!m)return [99,0,0,0,u];
  const ti=ORD.indexOf(m[2]);return [ti<0?50:ti,f(m[3]),m[4]?f(m[4]):0,+m[1]||1,u];
}
function cmpSize(a,b,boLoai){const A=sizeKey(a),B=sizeKey(b);for(let i=boLoai&&A[0]<50&&B[0]<50?1:0;i<4;i++)if(A[i]!==B[i])return A[i]-B[i];return A[4]<B[4]?-1:A[4]>B[4]?1:0}
function learned(kind){
  const src=kind==='cotTT'?'cot':kind==='dayTT'?'day':kind,cnt={};
  for(const d of Object.values(DB.ds))for(const p of d.poles){const r=parse(p.code);
    const vals=kind==='cot'?r.cotHT:kind==='cotTT'?r.cotTT:kind==='day'?r.dayHT:kind==='dayTT'?r.dayTT:kind==='sau'?r.sau:kind==='gc'?r.gc:[];
    for(const v of vals)if(v)cnt[v]=(cnt[v]||0)+1}
  const base=BASE[kind],have=new Set(base.map(norm));
  const all=base.concat(Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).filter(v=>!have.has(norm(v))).slice(0,12));
  return kind==='gc'?all:all.sort((x,y)=>cmpSize(x,y,src==='sau'));   /* dây sau CT: xếp theo tiết diện, không theo loại */
}
/* viết hoa ký hiệu gõ tay: abc4x120 → ABC4x120 */
function hoa(v){return /\s/.test(v)?v:v.replace(/[a-zA-ZđĐ]+/g,(m,o,s)=>/^x$/i.test(m)&&/\d/.test(s[o-1]||'')&&/\d/.test(s[o+1]||'')?'x':m.toUpperCase())}
function codeOf(f){
  const t=[(f.so||'').trim()];
  const zip=(h,tt)=>{const n=Math.max(h.length,tt.length),o=[];for(let i=0;i<n;i++)o.push((h[i]||'')+(tt[i]?'>'+tt[i]:''));return o};
  t.push(...zip(f.cotHT,f.cotTT),...zip(f.dayHT,f.dayTT));
  for(const [k,l] of [['h1','H1'],['h2','H2'],['h4','H4'],['p3','3P']])if(f[k])t.push(l+':'+f[k]);
  t.push(...f.sau.map(v=>'S:'+v));
  if(f.kc!==''&&f.kc!=null&&!isNaN(f.kc))t.push(String(f.kc).replace('.',',')+'m');
  if(f.tuMoi)t.push('Tủ:'+f.tuMoi);if(f.tuCu)t.push('Tủ cũ:'+f.tuCu);
  t.push(...f.dd,...f.gc.map(v=>kindOf(v)==='gc'?v:'GC:'+v));   /* ghi chú tự gõ mà trông giống mã thì đánh dấu GC: */
  return t.join(';')+(t.length>1?';':'');
}

/* ===== ẢNH CỘT (Truong 03/11: "nút chuyển về camera điện thoại, chụp xong chuyển lại vào app, không hỏi, mặc định lưu") =====
   Ảnh nén ~1600 px JPEG, lưu IndexedDB 'kstuyen_anh' (không vào localStorage — không làm đầy bộ nhớ bản vẽ). Khoá: id ảnh;
   kèm ds (bản vẽ), cot (id cột), t, lat/lon lúc chụp. Xoá cột KHÔNG xoá ảnh (hoàn tác xoá cột thì ảnh vẫn còn). */
const ANH={db:null,
  mo(){return this.db?Promise.resolve(this.db):new Promise((ok,loi)=>{const r=indexedDB.open('kstuyen_anh',1);
    r.onupgradeneeded=()=>{const s=r.result.createObjectStore('anh',{keyPath:'id'});s.createIndex('cot','cot');s.createIndex('ds','ds')};
    r.onsuccess=()=>{this.db=r.result;ok(this.db)};r.onerror=()=>loi(r.error)})},
  async tx(mode,fn){const db=await this.mo();return new Promise((ok,loi)=>{const t=db.transaction('anh',mode),st=t.objectStore('anh');let kq;
    Promise.resolve(fn(st)).then(v=>kq=v);t.oncomplete=()=>ok(kq);t.onerror=()=>loi(t.error)})},
  them(a){return this.tx('readwrite',st=>{st.put(a)})},
  xoa(id){return this.tx('readwrite',st=>{st.delete(id)})},
  cuaCot(cot){return this.tx('readonly',st=>new Promise(ok=>{const r=st.index('cot').getAll(cot);r.onsuccess=()=>ok((r.result||[]).sort((a,b)=>a.t-b.t))}))},
  cuaDs(ds){return this.tx('readonly',st=>new Promise(ok=>{const r=st.index('ds').getAll(ds);r.onsuccess=()=>ok((r.result||[]).sort((a,b)=>a.t-b.t))}))}};

  .replace(/[^A-Za-z0-9._-]+/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'').slice(0,40)||'tuyen';
async function nenAnh(file,nhan,maxW=2560,q=0.85){   /* 03/11: nét hơn (Truong: ảnh nén bị mờ); bản gốc lưu riêng vào máy */
  const bm=await createImageBitmap(file,{imageOrientation:'from-image'}).catch(()=>null);
  const img=bm||await new Promise((ok,loi)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=loi;i.src=URL.createObjectURL(file)});
  const w=img.width,h=img.height,k=Math.min(1,maxW/Math.max(w,h)),c=document.createElement('canvas');
  c.width=Math.round(w*k);c.height=Math.round(h*k);const g=c.getContext('2d');g.drawImage(img,0,0,c.width,c.height);
  if(bm&&bm.close)bm.close();
  if(nhan&&nhan.length)veNhan(g,c.width,c.height,nhan);
  return await new Promise(ok=>c.toBlob(b=>ok(b||file),'image/jpeg',q));
}
/* 03/11 (Truong: gửi Zalo không biết ảnh cột nào, nằm đâu): IN CHỮ lên đáy ảnh — số cột + tuyến, ngày giờ, toạ độ.
   Dải nền đặc: in lại (đổi số cột) thì đè kín nhãn cũ. */
function veNhan(g,w,h,dong){
  const fs=Math.max(20,Math.round(Math.min(w,h)*0.045)),lh=Math.round(fs*1.3),pad=Math.round(fs*0.5),bh=dong.length*lh+pad*2;
  g.fillStyle='#141414';g.fillRect(0,h-bh,w,bh);   /* nền ĐẶC: in lại đè kín nhãn cũ */
  g.textBaseline='top';g.fillStyle='#fff';
  dong.forEach((t,i)=>{g.font=`${i?'':'bold '}${i?Math.round(fs*0.8):fs}px system-ui,-apple-system,Roboto,Arial,sans-serif`;g.fillText(t,pad,h-bh+pad+i*lh,w-pad*2)});
}
function nhanAnh(p,t,lat,lon){

function geoToXY(lat,lon,setOrigin=true){

}
/* ================= VN-2000 =================
   Chép đúng từ LispcadZP/tools/vn2000/vn2000.py: ellipsoid WGS-84; Helmert 7 tham số QĐ 05/2007/QĐ-BTNMT
   (chiều VN-2000 → WGS-84, xoay quy ước coordinate frame, WGS → VN giải hệ 3x3 chính xác); TM múi 3°, k0 0,9999, +500 000 m.
   Kết quả x_bac = Bắc (N), y_dong = Đông (E); trong AutoCAD X = y_dong, Y = x_bac. */
const VN=(()=>{
  const A=6378137.0,F=1/298.257223563,E2=F*(2-F),K0=0.9999,FE=500000.0,FN=0.0;
  const HP={dX:-191.90441429,dY:-39.30318279,dZ:-111.45032835,rX:-0.00928836,rY:+0.01975479,rZ:-0.00427372,k_ppm:+0.252906278};
  const rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI;
  function xyz(lat,lon,h){const p=rad(lat),l=rad(lon),n=A/Math.sqrt(1-E2*Math.sin(p)**2);
    return [(n+h)*Math.cos(p)*Math.cos(l),(n+h)*Math.cos(p)*Math.sin(l),(n*(1-E2)+h)*Math.sin(p)]}
  function geo(x,y,z){const lon=Math.atan2(y,x),p=Math.hypot(x,y);let lat=Math.atan2(z,p*(1-E2)),n,h;
    for(let i=0;i<10;i++){n=A/Math.sqrt(1-E2*Math.sin(lat)**2);h=p/Math.cos(lat)-n;const ln=Math.atan2(z,p*(1-E2*n/(n+h)));
      if(Math.abs(ln-lat)<1e-14){lat=ln;break}lat=ln}
    n=A/Math.sqrt(1-E2*Math.sin(lat)**2);h=p/Math.cos(lat)-n;return [deg(lat),deg(lon),h]}
  function rot(){const s=Math.PI/(180*3600),rx=HP.rX*s,ry=HP.rY*s,rz=HP.rZ*s;return [[1,rz,-ry],[-rz,1,rx],[ry,-rx,1]]}
  const det3=m=>m[0][0]*(m[1][1]*m[2][2]-m[1][2]*m[2][1])-m[0][1]*(m[1][0]*m[2][2]-m[1][2]*m[2][0])+m[0][2]*(m[1][0]*m[2][1]-m[1][1]*m[2][0]);
  function w2v(w){const a=rot(),m=1+HP.k_ppm*1e-6,b=[(w[0]-HP.dX)/m,(w[1]-HP.dY)/m,(w[2]-HP.dZ)/m],d=det3(a);
    return [0,1,2].map(i=>{const mm=a.map(r=>r.slice());for(let k=0;k<3;k++)mm[k][i]=b[k];return det3(mm)/d})}
  const n=F/(2-F),A1=A/(1+n)*(1+n**2/4+n**4/64+n**6/256),E=Math.sqrt(E2);
  const AL=[n/2-2*n**2/3+5*n**3/16+41*n**4/180-127*n**5/288+7891*n**6/37800,
    13*n**2/48-3*n**3/5+557*n**4/1440+281*n**5/630-1983433*n**6/1935360,
    61*n**3/240-103*n**4/140+15061*n**5/26880+167603*n**6/181440,
    49561*n**4/161280-179*n**5/168+6601661*n**6/7257600,
    34729*n**5/80640-3418889*n**6/1995840,
    212378941*n**6/319334400];
  function tm(lat,lon,kt){const phi=rad(lat),lam=rad(lon-kt),tau=Math.tan(phi);
    const sg=Math.sinh(E*Math.atanh(E*tau/Math.sqrt(1+tau*tau))),tp=tau*Math.sqrt(1+sg*sg)-sg*Math.sqrt(1+tau*tau);
    const xp=Math.atan2(tp,Math.cos(lam)),ep=Math.asinh(Math.sin(lam)/Math.sqrt(tp*tp+Math.cos(lam)**2));let xi=xp,eta=ep;
    AL.forEach((a,i)=>{const j=i+1;xi+=a*Math.sin(2*j*xp)*Math.cosh(2*j*ep);eta+=a*Math.cos(2*j*xp)*Math.sinh(2*j*ep)});
    return [FN+K0*A1*xi,FE+K0*A1*eta]}
  /* WGS-84 (độ) → [x_bac, y_dong] VN-2000 (m); h = cao trắc địa WGS-84, để 0 sai khác mặt bằng < 1 mm */
  function tu84(lat,lon,kt=105,h=0){const v=w2v(xyz(lat,lon,h)),g=geo(v[0],v[1],v[2]);return tm(g[0],g[1],kt)}
  /* kinh tuyến trục theo tỉnh (TT 973/2001/TT-TCĐC, tỉnh cũ trước sáp nhập 2025) — cùng bảng với vn2000.py */
  const TINH=[['Thanh Hoá',105],['Nghệ An',104.75],['Ninh Bình',105],['Hà Nội',105],['Hà Nam',105],['Hà Tĩnh',105.5],
    ['Nam Định',105.5],['Hoà Bình',106],['Sơn La',104]];
  /* hệ số tỉ lệ chiều dài của phép chiếu TM tại điểm có toạ độ Đông y_dong (gần đúng, đủ cho khoảng cột): khoảng lưới = khoảng mặt đất × k */
  function kTL(yd){const e=(yd-FE)/6381000;return K0*(1+e*e/2)}
  return {tu84,TINH,kTL};
})();
/* ================= GPS chính xác — HÀM THUẦN =================
   Không đụng DOM / DB / D: test/gps_test.js chép nguyên đoạn từ "const VN=" tới dấu HẾT HÀM THUẦN ra chạy bằng node. */
function haversine(a,b){const R=6371000,r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lon-a.lon)*r;
  const h=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
/* chế độ đo: Chuẩn 10 s mặc định (Truong: mỗi lần đo không quá ~10 s); Kỹ 20 s chỉ khi chọn */
const GPS_CHE_DO={nhanh:{ms:5000,ten:'Nhanh 5 s'},chuan:{ms:10000,ten:'Chuẩn 10 s'},ky:{ms:20000,ten:'Kỹ 20 s'}};
const GPS_ACC=10,GPS_XANH=3,GPS_VANG=6,GPS_SOM_MS=4000,GPS_SOM_N=4,GPS_SOM_PT=2,GPS_V=0.8;   /* GPS_V: > 0,8 m/s = đang đi, bỏ lần đo đó */
const GPS_NHAC='Đứng yên, ra chỗ thoáng, tránh sát nhà / dưới cây';
const MAU_TEN={xanh:'tốt',vang:'tạm',do:'kém'};
function gpsMau(acc){if(acc==null||acc===''||!isFinite(+acc))return '';return +acc<GPS_XANH?'xanh':+acc<=GPS_VANG?'vang':'do'}
function trungVi(a){const b=a.slice().sort((x,y)=>x-y),n=b.length;return n?(n%2?b[(n-1)/2]:(b[n/2-1]+b[n/2])/2):NaN}
/* gộp các lần đo trong một phiên. ds: [{lat,lon,acc,ts}] — ts = ms tính từ lúc bấm đo.
   1) bỏ khởi động: lần đầu (thường là vị trí cũ máy nhớ) và các lần trong 2 s đầu mà sai số còn giảm mạnh (> 20 % so với lần sau);
   2) bỏ lần sai số máy báo > 10 m; 3) bỏ ngoại lai: cách điểm trung vị > 2,5 × trung vị các khoảng cách (sàn 0,3 m);
   4) trung bình có trọng số 1/acc². acc kết quả = max(độ phân tán, sai số máy báo / √k), k = số lần "độc lập" ≤ 4
      (GPS điện thoại sai lệch kéo dài vài giây nên trung bình 10 s chỉ đỡ được khoảng 2 lần, không phải √n). */
function gpsLoc(ds0){
  if(!ds0||!ds0.length)return null;
  /* 03/11: bỏ lần TRÙNG (nhiều máy Android trả lại đúng vị trí cũ nhiều lần — đếm trùng làm ±m nhỏ giả) */
  const ds=[];let boTrung=0;
  for(const q of ds0){const l=ds[ds.length-1];
    if(l&&q.tsd&&(l.tsd===q.tsd||(l.lat===q.lat&&l.lon===q.lon&&l.acc===q.acc))){boTrung++;continue}ds.push(q)}   /* chỉ xét khi có giờ của máy (tsd) */
  let st=ds.length>2?1:0;
  while(st<ds.length-2&&ds[st].ts<2000&&ds[st].acc>1.2*ds[st+1].acc)st++;
  let a=ds.slice(st);
  /* 03/11: bỏ lần đo lúc ĐANG ĐI (tốc độ máy báo > 0,8 m/s); đi suốt cả phiên thì giữ và báo */
  const dung=a.filter(q=>!(q.v>GPS_V)),boDiChuyen=a.length-dung.length,diChuyen=!dung.length;
  if(dung.length)a=dung;
  let tot=a.filter(q=>q.acc<=GPS_ACC),canh=false;
  if(!tot.length){canh=true;const b=a.slice().sort((x,y)=>x.acc-y.acc);tot=b.filter(q=>q.acc<=b[0].acc*1.5)}
  const la0=trungVi(tot.map(q=>q.lat)),lo0=trungVi(tot.map(q=>q.lon)),kx=111320*Math.cos(la0*Math.PI/180),ky=110574;
  const d=tot.map(q=>Math.hypot((q.lon-lo0)*kx,(q.lat-la0)*ky)),lim=2.5*Math.max(trungVi(d),0.3);
  const ok=tot.filter((q,i)=>d[i]<=lim);
  let sw=0,sla=0,slo=0;for(const q of ok){const w=1/Math.max(q.acc,0.5)**2;sw+=w;sla+=w*q.lat;slo+=w*q.lon}
  const lat=sla/sw,lon=slo/sw;
  let s2=0;for(const q of ok){const w=1/Math.max(q.acc,0.5)**2;s2+=w*(((q.lon-lon)*kx)**2+((q.lat-lat)*ky)**2)}
  const pt=Math.sqrt(s2/sw),accW=Math.sqrt(ok.length/sw);
  const dur=ok[ok.length-1].ts-ok[0].ts+1000,k=Math.max(1,Math.min(ok.length,dur/2500,4));
  return {lat,lon,acc:Math.max(pt,accW/Math.sqrt(k)),pt,accW,n:ok.length,nTot:ok.filter(q=>q.acc<=GPS_VANG).length,tong:ds0.length,boDau:st,boAcc:canh?0:a.length-tot.length,boNgoai:tot.length-ok.length,boTrung,boDiChuyen,diChuyen,canh:canh||diChuyen};
}
/* xong sớm khi tốt: sau ≥ 4 s, ≥ 4 lần tốt (đã lọc, sai số máy báo ≤ 6 m), độ phân tán < 2 m và kết quả không đỏ */
function gpsXongSom(ds,ms){if(ms<GPS_SOM_MS)return false;const r=gpsLoc(ds);return !!r&&!r.canh&&r.nTot>=GPS_SOM_N&&r.pt<GPS_SOM_PT&&r.acc<=GPS_VANG}

/* hiệu chỉnh theo mốc: mốc trong 1 km VÀ trong 60 phút quanh giờ đo cột.
   Nhiều mốc → NỘI SUY nghịch đảo bình phương "khoảng cách gộp" g = √(d² + (Δt · 1000 m / 60 phút)²), g ≥ 10 m
   (1 km tương đương 60 phút; mốc gần cả chỗ lẫn giờ nặng ký nhất). Không có mốc phù hợp → null (chưa hiệu chỉnh). */
const HC_KC=1000,HC_PHUT=60;
function hcTinh(mocs,lat,lon,t){
  let sw=0,sx=0,sy=0;const ds=[];
  for(const m of mocs||[]){if(m.lat==null||!isFinite(m.dX)||!isFinite(m.dY))continue;
    const d=haversine({lat,lon},m),dt=Math.abs((t||0)-(m.t||0))/60000;if(d>HC_KC||dt>HC_PHUT)continue;
    const g=Math.max(Math.hypot(d,dt*HC_KC/HC_PHUT),10),w=1/(g*g);sw+=w;sx+=w*m.dX;sy+=w*m.dY;ds.push({m,g,d,dt})}
  if(!sw)return null;ds.sort((a,b)=>a.g-b.g);
  return {dX:sx/sw,dY:sy/sw,ten:ds.map(x=>x.m.ten).join(' + '),n:ds.length,d:ds[0].d,dt:ds[0].dt};
}
/* đọc số gõ tay: "2 195 123,45" / "2.195.123,45" / "2195123.45" */
function docSo(s){let u=String(s??'').trim().replace(/[\s ']/g,'');if(!u)return NaN;
  if(u.includes(',')&&u.includes('.')){u=u.lastIndexOf(',')>u.lastIndexOf('.')?u.replace(/\./g,'').replace(',','.'):u.replace(/,/g,'')}
  else if(u.includes(','))u=(u.match(/,/g).length>1)?u.replace(/,/g,''):u.replace(',','.');
  if((u.match(/\./g)||[]).length>1)u=u.replace(/\./g,'');
  return /^[-+]?(\d+\.?\d*|\.\d+)$/.test(u)?+u:NaN}
/* toạ độ thật của mốc: X (Bắc), Y (Đông) VN-2000; hai số nhỏ (≤ 90, ≤ 180) thì hiểu là vĩ độ, kinh độ WGS-84.
   Ở Việt Nam X (Bắc, ~1–2,6 triệu m) luôn lớn hơn Y (Đông, ~0,3–0,7 triệu m): gõ ngược thì tự đổi chỗ. */
function mocNhap(a,b,kt){
  const p=docSo(a),q=docSo(b);if(!isFinite(p)||!isFinite(q))return {loi:'Nhập đủ hai số X (Bắc), Y (Đông)'};
  if(Math.abs(p)<=90&&Math.abs(q)<=180){const r=VN.tu84(p,q,kt);return {X:r[0],Y:r[1],kieu:'latlon'}}
  if(p<q)return {X:q,Y:p,kieu:'xy',doi:true};
  return {X:p,Y:q,kieu:'xy'};
}
/* NẮN TUYẾN theo khoảng đo thật — bình sai bình phương nhỏ nhất, Gauss–Newton trên mặt phẳng VN-2000:
   min Σ (vị trí − vị trí GPS)² / σ_cột²  +  Σ (khoảng tính − khoảng đo)² / σ_khoảng².
   nodes: [{id, X, Y, s = σ vị trí (m)}] — xếp theo thứ tự đi tuyến (ma trận băng hẹp, giải nhanh);
   spans: [{a, b, L = khoảng trên lưới (m), s = σ khoảng (m)}]. Mỗi chuỗi liên thông giải riêng.
   Trả {pos: {id: [X, Y]}, vong: số vòng lặp lớn nhất}. Cột không thuộc khoảng đo nào không có trong pos. */
function nanTuyen(nodes,spans,vongMax=40){
  const ix=new Map(nodes.map((q,i)=>[q.id,i]));
  const par=nodes.map((_,i)=>i),f=i=>{while(par[i]!==i)i=par[i]=par[par[i]];return i};
  const sp=spans.filter(s=>ix.has(s.a)&&ix.has(s.b)&&s.a!==s.b&&s.L>0);
  for(const s of sp)par[f(ix.get(s.a))]=f(ix.get(s.b));
  const G=new Map();
  for(const s of sp){const r=f(ix.get(s.a));if(!G.has(r))G.set(r,{n:new Set(),s:[]});const g=G.get(r);g.s.push(s);g.n.add(ix.get(s.a));g.n.add(ix.get(s.b))}
  const pos={};let vong=0;
  for(const g of G.values()){
    const idx=[...g.n].sort((x,y)=>x-y),m=idx.length,N=2*m,loc=new Map(idx.map((v,k)=>[v,k]));
    let cx=0,cy=0;for(const i of idx){cx+=nodes[i].X;cy+=nodes[i].Y}cx/=m;cy/=m;   /* trừ trọng tâm: số nhỏ, đỡ sai số làm tròn */
    const u=new Float64Array(N),o=new Float64Array(N),w=new Float64Array(m);
    idx.forEach((i,k)=>{u[2*k]=o[2*k]=nodes[i].X-cx;u[2*k+1]=o[2*k+1]=nodes[i].Y-cy;w[k]=1/Math.max(nodes[i].s||5,1e-3)**2});
    const ss=g.s.map(s=>({i:loc.get(ix.get(s.a)),j:loc.get(ix.get(s.b)),L:s.L,w:1/Math.max(s.s||0.01,1e-4)**2}));
    /* hàng đầu tiên khác 0 của mỗi dòng (ma trận băng / skyline) */
    const fr=new Int32Array(N);for(let k=0;k<N;k++)fr[k]=k&~1;
    for(const s of ss){const lo=2*Math.min(s.i,s.j),hi=2*Math.max(s.i,s.j);fr[hi]=Math.min(fr[hi],lo);fr[hi+1]=Math.min(fr[hi+1],lo)}
    const A=new Float64Array(N*N),b=new Float64Array(N),u2=new Float64Array(N);let it=0;
    /* hàm mục tiêu — để chặn bước Gauss–Newton quá đà (trọng số khoảng rất lớn so với vị trí) */
    const fx=v=>{let t=0;for(let k=0;k<m;k++)t+=w[k]*((v[2*k]-o[2*k])**2+(v[2*k+1]-o[2*k+1])**2);
      for(const s of ss)t+=s.w*(s.L-Math.hypot(v[2*s.i]-v[2*s.j],v[2*s.i+1]-v[2*s.j+1]))**2;return t};
    let f0=fx(u);
    for(;it<vongMax;){it++;A.fill(0);b.fill(0);
      for(let k=0;k<m;k++){A[2*k*N+2*k]+=w[k];A[(2*k+1)*N+2*k+1]+=w[k];b[2*k]+=w[k]*(o[2*k]-u[2*k]);b[2*k+1]+=w[k]*(o[2*k+1]-u[2*k+1])}
      const A2=new Float64Array(A);   /* phần Gauss–Newton dự phòng */
      for(const s of ss){const dx=u[2*s.i]-u[2*s.j],dy=u[2*s.i+1]-u[2*s.j+1],d=Math.hypot(dx,dy)||1e-9,ex=dx/d,ey=dy/d,r=s.L-d;
        const J=[[2*s.i,ex],[2*s.i+1,ey],[2*s.j,-ex],[2*s.j+1,-ey]];
        /* Newton đủ: thêm số hạng bậc hai −w·r·(I − e·eᵀ)/d (lực căng của khoảng) — GN thiếu số hạng này nên hội tụ chậm */
        const c=-s.w*r/d,P=[[1-ex*ex,-ex*ey],[-ex*ey,1-ey*ey]],ix2=[2*s.i,2*s.j];
        for(const [p,jp] of J){b[p]+=s.w*jp*r;for(const [q,jq] of J){A[p*N+q]+=s.w*jp*jq;A2[p*N+q]+=s.w*jp*jq}}
        for(let aa=0;aa<2;aa++)for(let bb=0;bb<2;bb++){const sg=aa===bb?1:-1;for(let r1=0;r1<2;r1++)for(let c1=0;c1<2;c1++)A[(ix2[aa]+r1)*N+ix2[bb]+c1]+=sg*c*P[r1][c1]}}
      const dl=giaiBang(A,b,N,fr)||giaiBang(A2,b,N,fr);if(!dl)break;
      let mx=0,lam=1,f1=Infinity;for(let k=0;k<N;k++)mx=Math.max(mx,Math.abs(dl[k]));
      for(let h=0;h<12;h++){for(let k=0;k<N;k++)u2[k]=u[k]+lam*dl[k];f1=fx(u2);if(f1<=f0)break;lam/=2}   /* bước lùi: chỉ nhận bước làm giảm mục tiêu */
      if(f1>f0)break;
      u.set(u2);f0=f1;if(mx*lam<1e-5)break}
    vong=Math.max(vong,it);
    idx.forEach((i,k)=>{pos[nodes[i].id]=[u[2*k]+cx,u[2*k+1]+cy]});
  }
  return {pos,vong};
}
/* Cholesky cho ma trận đối xứng xác định dương dạng skyline (fr[i] = cột đầu khác 0 ở dòng i) */
function giaiBang(A,b,n,fr){
  const L=new Float64Array(n*n);
  for(let i=0;i<n;i++)for(let j=fr[i];j<=i;j++){let s=A[i*n+j];const k0=Math.max(fr[i],fr[j]);for(let k=k0;k<j;k++)s-=L[i*n+k]*L[j*n+k];
    if(i===j){if(!(s>0))return null;L[i*n+i]=Math.sqrt(s)}else L[i*n+j]=s/L[j*n+j]}
  const y=new Float64Array(n);for(let i=0;i<n;i++){let s=b[i];for(let k=fr[i];k<i;k++)s-=L[i*n+k]*y[k];y[i]=s/L[i*n+i]}
  const x=new Float64Array(n);for(let i=n-1;i>=0;i--){let s=y[i];for(let k=i+1;k<n;k++)if(fr[k]<=i)s-=L[k*n+i]*x[k];x[i]=s/L[i*n+i]}
  return x;
}
/* === HẾT HÀM THUẦN === */
/* kinh tuyến trục đang dùng (cài đặt chung của máy, mặc định Thanh Hoá 105°00′) */
function ktt(){return DB.ktt!=null&&isFinite(DB.ktt)?+DB.ktt:105}
function kttTen(v){const d=Math.floor(v+1e-9),m=Math.round((v-d)*60);return `${d}°${String(m).padStart(2,'0')}′`}
const vn1=v=>(Math.round(v*10)/10).toLocaleString('vi-VN',{maximumFractionDigits:1});
const vn2=v=>(+v).toLocaleString('vi-VN',{minimumFractionDigits:2,maximumFractionDigits:2});
const vn3=v=>(+v).toLocaleString('vi-VN',{minimumFractionDigits:3,maximumFractionDigits:3});
const gioPhut=t=>{const d=new Date(t);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
const qdot=acc=>`<span class="qdot q-${gpsMau(acc)}"></span>`;
/* ---- toạ độ VN-2000 của cột: GPS gốc → + hiệu chỉnh mốc → + nắn theo khoảng đo ---- */
function hcCot(p){if(D.hcTat||p.lat==null||p.lon==null||!(D.mocDo||[]).length)return null;return hcTinh(D.mocDo,+p.lat,+p.lon,p.gt||p.t)}
function vnGoc(p){if(p.lat==null||p.lon==null)return null;const r=VN.tu84(+p.lat,+p.lon,ktt());return {x:r[0],y:r[1]}}
/* hiệu chỉnh trung bình của các cột GPS đã hiệu chỉnh — dùng cho điểm vẽ tay (cột không GPS, đường, mốc phác) để đi cùng cột GPS */
function hcTB(){let n=0,x=0,y=0;for(const p of D.poles){const h=hcCot(p);if(h){n++;x+=h.dX;y+=h.dY}}return n?{dX:x/n,dY:y/n}:null}
function vnPhac(x,y,tb){const g=xyToGeo(x,y),r=VN.tu84(g.lat,g.lon,ktt());return {x:r[0]+(tb?tb.dX:0),y:r[1]+(tb?tb.dY:0)}}
/* toạ độ dùng khi xuất. Cột GPS: gốc + hiệu chỉnh + nắn. Cột vẽ tay đã nắn: vị trí phác (đã dời khi nắn) quy về VN-2000. */
function vnCot(p,tb){
  const g=vnGoc(p);
  if(g){const h=hcCot(p);let x=g.x+(h?h.dX:0),y=g.y+(h?h.dY:0);if(p.nan){x+=p.nan.dX;y+=p.nan.dY}return {x,y,h,goc:g}}
  if(p.nan&&D.geo){const v=vnPhac(p.x,p.y,tb===undefined?hcTB():tb);return {x:v.x,y:v.y,h:null,goc:null,phac:true}}
  return null;
}
function vnOf(p,tb){const v=vnCot(p,tb);return v&&{x:+v.x.toFixed(3),y:+v.y.toFixed(3),h:v.h,goc:v.goc,phac:v.phac}}
function gpsLab(){$('#gps-lab').textContent=fix?`±${vn1(fix.acc)} m`:'GPS'}
function placeGps(){dropAuto();closeSheet();const xy=geoToXY(fix.lat,fix.lon);addPole(xy.x,xy.y,null,fix)}
function gpsCheDo(){return GPS_CHE_DO[DB.gpsCheDo]?DB.gpsCheDo:'chuan'}
let gpsM=null;   /* phiên đang đo: {t0, ms, muc:'cot'|'moc', ds:[{lat,lon,acc,ts}], kq, tm} */
function gpsDung(){if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;if(gpsM)clearInterval(gpsM.tm);gpsM=null;draw()}
function gpsXong(){
  const M=gpsM;if(!M)return;const ds=M.ds,t=Date.now()-M.t0;gpsDung();
  if(!ds.length){toast('Chưa bắt được GPS, ra chỗ thoáng rồi bấm lại');return}
  const r=gpsLoc(ds);fix={lat:r.lat,lon:r.lon,acc:r.acc,t:Date.now(),n:r.n,tong:r.tong,ms:t,canh:r.canh};gpsLab();
  window.__gpsKQ={...fix,muc:M.muc};   /* để kiểm tự động đọc kết quả */
  if(M.muc==='moc'){showMocForm(fix);return}
  placeGps();
  const m=gpsMau(r.acc);
  setTimeout(()=>toast(`Đo ${vn1(t/1000)} s · ${r.n}/${r.tong} lần · ±${vn1(r.acc)} m — ${MAU_TEN[m]}${m==='do'?'. '+GPS_NHAC+', rồi đo lại':''}${r.diChuyen?' · Máy đang di chuyển: đứng yên tại chân cột rồi đo lại':r.boDiChuyen?` · bỏ ${r.boDiChuyen} lần đang đi`:''}`),60);
}
function gpsTien(){
  if(!gpsM)return;const t=Date.now()-gpsM.t0;
  if(gpsM.ds.length&&(t>=gpsM.ms||gpsXongSom(gpsM.ds,t)))return gpsXong();
  if(t>=30000){gpsDung();toast('Chưa bắt được GPS, ra chỗ thoáng rồi bấm lại');return}
  draw();
}
function gpsTxt(){
  const t=(Date.now()-gpsM.t0)/1000,T=gpsM.ms/1000,ds=gpsM.ds,ten=gpsM.muc==='moc'?'Đo mốc':'Đang đo';
  if(!ds.length)return {h:`Đang bắt GPS… ${Math.floor(t)} s`,m:''};
  const r=gpsM.kq||gpsLoc(ds);
  return {h:`${ten} ${Math.min(Math.floor(t),T)}/${T} s · ${r.n} lần tốt · ±${vn1(r.acc)} m`,m:gpsMau(r.acc)};
}
function gpsBatDau(muc){
  if(!('geolocation' in navigator)){toast('Máy này không có định vị');return}
  if(gpsM)return;   /* đang đo: dừng bằng nút Dừng sớm */
  if(watchId!==null)navigator.geolocation.clearWatch(watchId);
  gpsM={t0:Date.now(),ms:GPS_CHE_DO[gpsCheDo()].ms,muc:muc||'cot',ds:[],kq:null,tm:setInterval(gpsTien,250)};
  watchId=navigator.geolocation.watchPosition(pos=>{if(!gpsM)return;
      if(pos.timestamp&&pos.timestamp<gpsM.t0-1500)return;   /* vị trí CŨ trong bộ nhớ máy (trước lúc bấm đo) — bỏ */
      const q={lat:pos.coords.latitude,lon:pos.coords.longitude,acc:pos.coords.accuracy,ts:Date.now()-gpsM.t0,tsd:pos.timestamp||0,
        v:pos.coords.speed==null?null:pos.coords.speed};gpsM.ds.push(q);
      gpsM.kq=gpsLoc(gpsM.ds);fix={...q,acc:gpsM.kq.acc,t:Date.now()};gpsLab();
      if(gpsXongSom(gpsM.ds,q.ts))gpsXong();else draw()},
    err=>{if(err.code===1){gpsDung();toast('Chưa cho phép định vị — bật quyền Vị trí cho trình duyệt')}},   /* lỗi hết giờ: vẫn chờ tới hết phiên đo */
    {enableHighAccuracy:true,maximumAge:0,timeout:20000});
  draw();
}

/* ---- màn GPS chính xác: chế độ đo · mốc hiệu chỉnh · nắn tuyến ---- */
let mocCho=null,nanCho=null;
function kcDoCount(){let n=0;for(const p of D.poles)if(p.kcThat&&p.from&&byId(p.from)&&hasEdge(p.id,p.from)&&+parse(p.code).kc>0)n++;return n}

function luuMoc(){

  const v=VN.tu84(fx.lat,fx.lon,ktt()),dX=r.X-v[0],dY=r.Y-v[1],L=Math.hypot(dX,dY);
  if(L>100&&!confirm(`Độ lệch ${vn1(L)} m lớn bất thường (GPS thường lệch dưới 10 m). Kiểm lại số${r.doi?' (đã đổi chỗ X/Y)':''} — vẫn lưu?`))return;
  snap();D.mocDo=D.mocDo||[];
  const ten=($('#mf-ten').value||'').trim()||'M'+(D.mocDo.length+1);
  D.mocDo.push({id:uid(),ten,t:fx.t,lat:+fx.lat.toFixed(8),lon:+fx.lon.toFixed(8),acc:+fx.acc.toFixed(2),n:fx.n,
    Xd:+v[0].toFixed(3),Yd:+v[1].toFixed(3),X:+r.X.toFixed(3),Y:+r.Y.toFixed(3),dX:+dX.toFixed(3),dY:+dY.toFixed(3),kt:ktt(),kieu:r.kieu});
  mocCho=null;nanCho=null;save();draw();showGps();
  toast(`Đã lưu mốc ${ten}: lệch ${vn2(L)} m${r.doi?' (đã đổi chỗ X/Y)':''}`);
}
/* nắn: dựng bài toán từ các khoảng đo thật (khoảng cột lưu ở cột con, nối dây với cột trước) */
function nanTinh(){
  if(!D.geo)return {loi:'Chưa có cột nào lấy GPS — cần GPS để nắn trên mặt phẳng VN-2000.'};
  const tb=hcTB(),spans=[],ids=new Set();
  for(const p of D.poles){if(!p.kcThat||!p.from)continue;const f=byId(p.from),kc=+parse(p.code).kc;
    if(!f||!hasEdge(p.id,f.id)||!(kc>0))continue;spans.push({a:f.id,b:p.id,Ld:kc});ids.add(f.id);ids.add(p.id)}
  if(!spans.length)return {loi:'Chưa có khoảng đo thật nào. Chạm số khoảng cột giữa hai cột trên bản vẽ để nhập khoảng đo bằng thước / laser.'};
  const nodes=[],cu={};
  for(const p of sorted()){if(!ids.has(p.id))continue;const v=vnCot(p,tb)||vnPhac(p.x,p.y,tb);
    /* σ vị trí: cột GPS = sai số đo (≥ 1,5 m); đã hiệu chỉnh mốc = neo, nặng ký gấp 9; cột vẽ tay = 30 m (chỉ giữ dáng) */
    const a=Math.max(+p.acc||5,1.5),s=p.lat!=null?(v.h?a/3:a):30;
    nodes.push({id:p.id,X:v.x,Y:v.y,s,so:parse(p.code).so});cu[p.id]=[v.x,v.y]}
  for(const s of spans){s.k=VN.kTL(cu[s.b][1]);s.L=s.Ld*s.k;s.s=0.01}   /* khoảng đo trên mặt đất → trên lưới chiếu (× hệ số tỉ lệ) */
  const t0=performance.now(),r=nanTuyen(nodes,spans),ms=performance.now()-t0;
  const sai=P=>Math.max(...spans.map(s=>Math.abs(Math.hypot(P[s.a][0]-P[s.b][0],P[s.a][1]-P[s.b][1])/s.k-s.Ld)));
  const top=nodes.map(n=>({id:n.id,so:n.so,d:Math.hypot(r.pos[n.id][0]-n.X,r.pos[n.id][1]-n.Y)})).sort((a,b)=>b.d-a.d);
  return {spans,nodes,pos:r.pos,vong:r.vong,ms,saiTruoc:sai(cu),saiSau:sai(r.pos),dmax:top[0].d,dtb:top.reduce((s,x)=>s+x.d,0)/top.length,top};
}
function nanApDung(c){
  snap();
  for(const n of c.nodes){const p=byId(n.id);if(!p)continue;const dX=c.pos[n.id][0]-n.X,dY=c.pos[n.id][1]-n.Y;
    p.nan={dX:+((p.nan?p.nan.dX:0)+dX).toFixed(4),dY:+((p.nan?p.nan.dY:0)+dY).toFixed(4),t:Date.now()};
    p.x+=dY;p.y-=dX}   /* sơ đồ dời theo: X VN = Bắc = −y sơ đồ, Y VN = Đông = x */
  save();draw();
}
function nanBo(){snap();let n=0;for(const p of D.poles)if(p.nan){p.x-=p.nan.dY;p.y+=p.nan.dX;delete p.nan;n++}save();draw();return n}
/* khoảng đo thật: chạm ĐÚNG số khoảng cột (vùng chữ) trên bản vẽ; khoảng chưa có số thì nhập ở ô cột → “Khoảng đo thật”.
   Chạm chỗ khác trên đoạn dây (kể cả gần giữa khoảng) giữ hành vi cũ: đặt cột / chọn (rà 01/11). */
let lastKC=[];
const KC_DEM=6;   /* px nới quanh vùng chữ cho ngón tay */
/* h = cột chạm trúng (nếu có): số khoảng chỉ thắng khi ngón tay gần số hơn gần cột (thu nhỏ hết cỡ cột nằm sát số) */
function hitSpan(pt,h){
  let best=null,bd=Infinity;
  for(const t of lastKC){const cx=t.x+V.tx,cy=t.y+V.ty,hw=(t.hw||8)+KC_DEM;
    if(pt.x<cx-hw||pt.x>cx+hw||pt.y<cy-(t.h||10)-KC_DEM||pt.y>cy+2+KC_DEM)continue;
    const d=Math.hypot(cx-pt.x,cy-4-pt.y);if(d<bd){bd=d;best=t.id}}
  if(best&&h&&h.x!==undefined&&Math.hypot(h.x*V.s+V.tx-pt.x,h.y*V.s+V.ty-pt.y)<=bd)return null;
  return best;
}
function nhapKcThat(id){
  const p=byId(id),f=p&&byId(p.from);if(!p||!f)return;const r=parse(p.code);
  const t=prompt(`Khoảng đo thật ${parse(f.code).so||'?'} → ${r.so||'?'} (m), đo bằng thước / laser.\nXoá hết chữ để bỏ đánh dấu đo thật.`,r.kc===''?'':String(r.kc).replace('.',','));
  if(t===null)return;
  if(!t.trim()){if(p.kcThat){snap();delete p.kcThat;save();draw();toast('Đã bỏ đánh dấu khoảng đo thật')}return}
  const v=docSo(t);if(!(v>0&&v<2000)){toast('Khoảng đo không hợp lệ');return}
  snap();r.kc=Math.round(v*100)/100;p.code=codeOf(r);p.kcThat=true;p.auto=false;
  if(editId===p.id){F=parse(p.code);renderSlots();renderOpts()}
  nanCho=null;save();draw();toast(`Khoảng đo thật ${String(r.kc).replace('.',',')} m ✓`);
}

/* thứ tự đi tuyến: đầu mỗi đoạn theo thời gian, rồi lần lượt cột nối tiếp (cả đoạn gộp từ máy khác) */
function sorted(){
  const ids=new Set(D.poles.map(p=>p.id)),kids={},out=[],seen=new Set();
  for(const p of D.poles){const f=p.from&&ids.has(p.from)?p.from:'';(kids[f]=kids[f]||[]).push(p)}
  for(const k in kids)kids[k].sort((a,b)=>a.t-b.t);
  const st=(kids['']||[]).slice().reverse();
  while(st.length){const p=st.pop();if(seen.has(p.id))continue;seen.add(p.id);out.push(p);st.push(...(kids[p.id]||[]).slice().reverse())}
  for(const p of D.poles)if(!seen.has(p.id))out.push(p);
  return out;
}

function giao(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);toast(`Đã lưu ${name} vào Tải xuống`);
}

function tieuDe(){const n=D.ngay||'';return [D.ten,n&&!String(D.ten).includes(n)?n:'',D.poles.length+' cột'].filter(Boolean).join(' · ')}
function pngSvg(){
  /* tuyến dọc thì xuất ảnh đứng, tuyến ngang thì ảnh ngang — sơ đồ không bị dồn vào một dải hẹp */
  const pts=allPts();let bw=1,bh=1;
  if(pts.length){const xs=pts.map(q=>q[0]),ys=pts.map(q=>q[1]);bw=Math.max(...xs)-Math.min(...xs)||1;bh=Math.max(...ys)-Math.min(...ys)||1}
  const dung=bh>bw*1.15,w=dung?1400:1800,h=dung?1900:1300,v=fitView(w,h,95);
  let ex='';
  if(D.geo){
    /* thước tỷ lệ và hướng Bắc: chỉ khi bản vẽ có GPS (1 đơn vị = 1 m, trục y hướng Bắc) */
    const b=Math.pow(10,Math.floor(Math.log10(240/v.s)));let m=b;for(const f of [5,2,1])if(f*b*v.s<=240){m=f*b;break}
    const L=m*v.s,x0=w-40-L,y0=h-48;
    ex+=`<path class="sb" d="M${x0} ${y0-8}V${y0}H${x0+L}V${y0-8}"/><text class="sbt" x="${x0+L/2}" y="${y0-14}" text-anchor="middle">${m} m</text>`;
    ex+=`<path class="na" d="M${w-60} 84L${w-72} 120L${w-60} 112L${w-48} 120Z"/><text class="sbt" x="${w-60}" y="76" text-anchor="middle">B</text>`;
  }
  ex+=`<text class="lg" x="30" y="${h-24}">H1, H2, H4: số hòm công tơ theo loại · 3P: công tơ 3 pha · số màu xanh lá: khoảng cột (m) · <tspan style="fill:#B4361F;font-weight:700">?</tspan>: cột chưa đánh số</text>`;
  const s=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><style>${PNGCSS}</style>
    <rect width="100%" height="100%" fill="#fff"/><text class="tt" x="30" y="46">${esc(tieuDe())}</text>
    ${svgInner(v,w,h,{noGrid:true,print:true,k:1.5})}${ex}</svg>`;
  return {s,w,h};
}
async function soDoFile(){
  const {s,w,h}=pngSvg();
  const img=new Image();img.src=URL.createObjectURL(new Blob([s],{type:'image/svg+xml'}));
  try{await img.decode()}catch(e){return null}
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0);URL.revokeObjectURL(img.src);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));return blob&&new File([blob],fname('.png'),{type:'image/png'});
}
async function guiAnh(){
  const file=await soDoFile();if(!file){toast('Không tạo được ảnh');return}const blob=file;

function gop(o){
  if(!o||!Array.isArray(o.poles))throw new Error('sai dinh dang');
  const soMap={};for(const p of D.poles){const s=parse(p.code).so;if(s)soMap[norm(s)]=p}
  const exOf=p=>{const s=parse(p.code).so;return s?soMap[norm(s)]:null};
  const ip=o.poles.map(p=>[p.x,p.y]).concat(...(o.roads||[]).map(r=>r.pts),(o.mocs||[]).map(m=>[m.x,m.y]));
  let dx=0,dy=0,how;
  const shared=o.poles.find(exOf);
  if(o.geo&&D.geo){const g=D.geo,kx=111320*Math.cos(g.lat0*Math.PI/180);
    dx=g.x0+(o.geo.lon0-g.lon0)*kx-o.geo.x0;dy=g.y0-(o.geo.lat0-g.lat0)*110574-o.geo.y0;how='theo GPS'}
  else if(shared){const e=exOf(shared);dx=e.x-shared.x;dy=e.y-shared.y;how='nối tại cột '+parse(shared.code).so}
  else if(allPts().length&&ip.length){const cur=allPts(),mx=Math.max(...cur.map(q=>q[0])),my=Math.min(...cur.map(q=>q[1]));
    dx=mx+40-Math.min(...ip.map(q=>q[0]));dy=my-Math.min(...ip.map(q=>q[1]));how='đặt bên phải bản vẽ'}
  else how='bản vẽ trống';
  if(!D.geo&&o.geo)D.geo={...o.geo,x0:o.geo.x0+dx,y0:o.geo.y0+dy};
  const idm={},moi=[];let them=0,trung=0;
  for(const p of o.poles){const ex=exOf(p);
    if(ex){idm[p.id]=ex.id;trung++;if(parse(p.code).toks.length>parse(ex.code).toks.length)ex.code=p.code;continue}
    const np={...p,id:uid(),x:p.x+dx,y:p.y+dy,auto:false};idm[p.id]=np.id;moi.push([np,p.from]);D.poles.push(np);them++}
  for(const [np,f] of moi)np.from=(f&&idm[f])||null;
  for(const [a,b] of o.edges||[]){const A=idm[a],B=idm[b];if(A&&B&&A!==B&&!hasEdge(A,B))D.edges.push([A,B])}
  for(const r of o.roads||[])D.roads.push({id:uid(),w:r.w||7,ten:r.ten||'',pts:r.pts.map(q=>[q[0]+dx,q[1]+dy])});
  for(const m of o.mocs||[])D.mocs.push({id:uid(),ten:m.ten,x:m.x+dx,y:m.y+dy});
  D.mocDo=D.mocDo||[];for(const m of o.mocDo||[])if(!D.mocDo.some(x=>x.id===m.id||(x.t===m.t&&x.ten===m.ten)))D.mocDo.push({...m});
  return {them,trung,how};
}

      <option value="khac"${VN.TINH.some(([t,v])=>Math.abs(v-ktt())<1e-9&&t===(DB.tinh||'Thanh Hoá'))?'':' selected'}>Khác — tự nhập (${kttTen(ktt())})</option></select></label>
    <button class="big" data-a="anh"><b>📷 Gửi ảnh cột</b><span>Mọi ảnh chụp ở các cột của bản vẽ này, ảnh đầu là sơ đồ tuyến có số cột, các ảnh sau xếp theo số cột, mỗi ảnh in sẵn số cột, ngày giờ, toạ độ. Bản gốc đủ nét đã tự lưu vào Tải xuống lúc chụp. Gửi qua Zalo / Drive, hoặc tải về máy.</span></button>
    <button class="big" data-a="json"><b>File gốc (.json)</b><span>Để mở lại / gộp trên máy khác hoặc gửi Claude chuyển sang CAD.</span></button>
    <p class="note">Excel và JSON có thêm cột X_VN2000 (Bắc), Y_VN2000 (Đông) cho cột có GPS, theo kinh tuyến trục đang chọn (múi 3°) — đã cộng hiệu chỉnh theo mốc và nắn theo khoảng đo (màn ◎ GPS chính xác), kèm toạ độ gốc GPS và cột “Hiệu chỉnh theo mốc”.</p>
    <p class="note">Excel, DXF, JSON lưu vào thư mục <b>Tải xuống (Download)</b>. Gửi qua Zalo: Gửi file → Download.</p>
  </div>`;
  panel.hidden=false;
}
let delListT={};
panel.addEventListener('click',e=>{
  const tr=e.target.closest('tr[data-id]');
  if(tr){const p=byId(tr.dataset.id);closePanel();if(!p)return;
    tool='cot';for(const x of document.querySelectorAll('[data-tool]'))x.classList.toggle('on',x.dataset.tool==='cot');
    V.tx=W/2-p.x*V.s;V.ty=H*0.3-p.y*V.s;persistView();D.active=p.id;save();openSheet(p);return}
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  if(a==='close')closePanel();
  else if(a==='new'){const t=prompt('Tên TBA / tuyến','');if(t===null)return;switchTo(newD(t.trim()));closePanel()}
  else if(a==='open'){switchTo(DB.ds[id]);closePanel()}
  else if(a==='del'){if(!delListT[id]){b.textContent='Xoá thật?';b.classList.add('armed');delListT[id]=setTimeout(()=>{delete delListT[id];b.textContent='Xoá';b.classList.remove('armed')},3000);return}
    clearTimeout(delListT[id]);delete delListT[id];delete DB.ds[id];
    if(id===D.id){const rest=Object.values(DB.ds).sort((x,y)=>y.capNhat-x.capNhat);switchTo(rest[0]||newD())}
    saveNow();showList()}
  else if(a==='gmode'){DB.gpsCheDo=b.dataset.m;saveNow();showGps();toast('Chế độ đo: '+GPS_CHE_DO[b.dataset.m].ten)}
  else if(a==='domoc'){closePanel();if(gpsM){toast('Đang đo GPS — chờ xong rồi đo mốc');return}gpsBatDau('moc');toast('Đứng yên tại mốc, giữ máy ngang ngực')}
  else if(a==='mocdel'){const m=(D.mocDo||[]).find(x=>x.id===id);if(m&&confirm(`Xoá mốc ${m.ten}?`)){snap();D.mocDo=D.mocDo.filter(x=>x!==m);nanCho=null;save();draw();showGps()}}
  else if(a==='hc'){snap();D.hcTat=!D.hcTat;nanCho=null;save();draw();showGps();toast(D.hcTat?'Đã tắt hiệu chỉnh theo mốc':'Đã bật hiệu chỉnh theo mốc')}
  else if(a==='nan'){nanCho=nanTinh();showGps();const k=$('#nan-kq');if(k)k.scrollIntoView({block:'center'})}
  else if(a==='nanhuy'){nanCho=null;showGps();toast('Đã huỷ, tuyến giữ nguyên')}
  else if(a==='nanok'){const c=nanCho;nanCho=null;if(c&&!c.loi){nanApDung(c);toast(`Đã nắn ${c.nodes.length} cột · dịch lớn nhất ${vn2(c.dmax)} m · bấm ↶ để hoàn tác`)}showGps()}
  else if(a==='nanbo'){if(confirm('Bỏ nắn, đưa các cột về vị trí trước khi nắn?')){const n=nanBo();showGps();toast(`Đã bỏ nắn ${n} cột`)}}
  else if(a==='mf-huy'){mocCho=null;closePanel();toast('Không lưu mốc')}
  else if(a==='mf-lai'){mocCho=null;closePanel();gpsBatDau('moc')}
  else if(a==='mf-luu')luuMoc();
  else if(a==='xlsx')xuatXlsx();else if(a==='dxf')xuatDxf();else if(a==='dxfvn')xuatDxf(true);else if(a==='json')xuatJson();else if(a==='anh')guiAnhCot();else if(a==='png')guiAnh();
});
panel.addEventListener('change',async e=>{
  if(e.target.id==='ex-ktt'){const o=e.target.selectedOptions[0];
    if(e.target.value==='khac'){const t=prompt('Kinh tuyến trục (độ thập phân, vd 105 hoặc 104.75)',String(ktt()));const v=parseFloat(String(t||'').replace(',','.'));
      if(t!==null&&isFinite(v)&&v>=100&&v<=112){DB.ktt=v;DB.tinh=''}else if(t!==null)toast('Kinh tuyến trục phải trong khoảng 100–112°')}
    else{DB.ktt=+e.target.value;DB.tinh=o.textContent.split(' — ')[0]}
    saveNow();showExport();toast(`VN-2000: kinh tuyến trục ${kttTen(ktt())}`);return}
  const fl=e.target.files;if(!fl||!fl.length)return;
  if(e.target.id==='gop'){
    snap();const kq=[];
    for(const f of fl){try{const o=JSON.parse(await docFile(f));napPoles(o.poles);const r=gop(o);kq.push(`${f.name}: thêm ${r.them} cột${r.trung?`, ${r.trung} cột trùng số`:''} (${r.how})`)}
      catch(err){kq.push(`${f.name}: không đọc được`)}}
    save();closePanel();V=fitView(W,H,40);persistView();draw();toast(kq.join(' · '));return;
  }
  if(e.target.id==='imp'){
    try{const o=JSON.parse(await docFile(fl[0]));if(!Array.isArray(o.poles))throw 0;napPoles(o.poles);
      const d={id:uid(),ten:o.ten||'Tuyến nhập',ngay:o.ngay||today(),poles:o.poles,edges:o.edges||[],roads:o.roads||[],mocs:o.mocs||[],mocDo:o.mocDo||[],hcTat:!!o.hcTat,geo:o.geo||null,active:null,view:null,capNhat:Date.now()};
      DB.ds[d.id]=d;saveNow();switchTo(d);closePanel();toast('Đã mở file')}catch(err){toast('File không đúng định dạng của app')}
  }
});
$('#b-list').addEventListener('click',showList);
$('#b-export').addEventListener('click',showExport);
$('#b-table').addEventListener('click',showTable);
$('#b-gpsp').addEventListener('click',()=>{nanCho=null;showGps()});
function switchTo(d){saveNow();D=d;D.poles=D.poles||[];D.roads=D.roads||[];D.mocs=D.mocs||[];D.edges=D.edges||[];D.mocDo=D.mocDo||[];mocCho=null;nanCho=null;DB.cur=d.id;undoSt=[];editId=null;F=null;noiA=null;selRoad=null;sheet.hidden=true;rsheet.hidden=true;V=D.view||fitView(W,H,40);saveNow();title();draw()}

/* ================= toast / khởi động ================= */
let toastT=null;
function toast(m){const el=$('#toast');el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},3200)}
async function keepAwake(){try{if('wakeLock' in navigator&&!document.hidden)await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)keepAwake()});
new ResizeObserver(()=>{sizeUp();if(!V)V=fitView(W,H,40);draw()}).observe(stage);
sizeUp();if(!V)V=fitView(W,H,40);title();draw();keepAwake();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
