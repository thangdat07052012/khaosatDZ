<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#12443B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Khảo sát tuyến</title>
<style>
/* Bố cục: một màn hình — thanh trên, bảng vẽ chiếm giữa, thanh công cụ dưới; ô nhập cột trượt lên từ dưới */
:root{
  --bg:#F4F6F5; --paper:#FFFFFF; --grid:#E3E9E6; --line:#CBD5D0; --fg:#15201C; --muted:#5A6964;
  --ink:#12443B; --ink-fg:#FFFFFF; --hi:#F2B01E; --hi-fg:#241A00; --hi-soft:#FBEFCB;
  --wire:#2F5FA8; --warn:#B4361F; --road:rgba(120,130,126,.22); --road-c:rgba(120,130,126,.55); --moc:#B4361F;
  --k-cot:#12443B; --k-day:#2F5FA8; --k-ct:#8A4B00; --k-sau:#6B3FA0; --k-kc:#1F7A4D; --k-gc:#56655F;
  --f:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Roboto Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1513; --paper:#141C19; --grid:#1F2A26; --line:#2E3B36; --fg:#E5ECE8; --muted:#98A9A2;
  --ink:#17594C; --ink-fg:#FFFFFF; --hi:#F5BD3A; --hi-fg:#241A00; --hi-soft:#3A2F10;
  --wire:#7FA8EC; --warn:#F08A6E; --road:rgba(170,185,178,.16); --road-c:rgba(170,185,178,.4); --moc:#F08A6E;
  --k-cot:#6FD0B6; --k-day:#8FB4F0; --k-ct:#F0B060; --k-sau:#C3A0F0; --k-kc:#7AD6A0; --k-gc:#9AABA4;
  color-scheme:dark }}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:16px;display:flex;flex-direction:column;overflow:hidden;
  -webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}

.top{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--ink);color:var(--ink-fg);min-height:54px}
.ib{min-width:44px;height:42px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:transparent;font-size:19px;padding:0 10px}
.ib.pri{background:var(--hi);color:var(--hi-fg);border-color:var(--hi);font-size:15px;font-weight:700}
.ttl{flex:1;min-width:0;height:42px;border:0;background:transparent;text-align:left;font-weight:700;font-size:16.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}

#stage{flex:1;position:relative;min-height:0;background:var(--paper)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#status{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
#status .pill{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;background:var(--fg);color:var(--paper);
  border-radius:999px;padding:5px 5px 5px 12px;font-size:13.5px;font-weight:600;min-height:34px}
#status .pill.solo{padding-right:12px}
#status .pill button{border:0;background:rgba(255,255,255,.2);border-radius:999px;height:26px;min-width:30px;padding:0 10px;font-size:12.5px;font-weight:700;color:inherit}
@media (prefers-color-scheme:dark){#status .pill button{background:rgba(0,0,0,.18)}}

.grid{stroke:var(--grid);stroke-width:1}
.road{stroke:var(--road);fill:none;stroke-linecap:round;stroke-linejoin:round}
.road.sel{stroke:var(--hi);opacity:.45}
.roadc{stroke:var(--road-c);fill:none;stroke-width:1.2;stroke-dasharray:6 6}
.jn{fill:var(--paper);stroke:var(--muted);stroke-width:1.6}
.ed{stroke:var(--wire);stroke-width:2.2}
.pole{fill:var(--paper);stroke:var(--fg);stroke-width:2.2}
.pole.act{stroke:var(--hi);stroke-width:3.5}
.fillk{fill:var(--fg)}
.ring{fill:none;stroke:var(--hi);stroke-width:2;stroke-dasharray:4 3}
.noiA{fill:var(--hi)}
.lb{fill:var(--fg);paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round}
.lb.so{font:700 13.5px var(--f)}
.lb.dt{font:500 11px var(--f);fill:var(--muted)}
.lb.kc{font:700 11px var(--mono);fill:var(--k-kc)}
.lb.mc{font:700 12px var(--f);fill:var(--moc)}
.lb.jt{font:600 10.5px var(--f);fill:var(--muted)}
.moc{fill:var(--moc);stroke:var(--paper);stroke-width:1.5}
.hd{fill:var(--hi);stroke:var(--hi-fg);stroke-width:2}.hm{fill:var(--paper);stroke:var(--hi);stroke-width:2;stroke-dasharray:3 2}
.lb.rn{font:italic 600 12px var(--f);fill:var(--muted)}
.tmp{stroke:var(--hi);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.me{fill:#2F7DF6;stroke:#fff;stroke-width:2.5}
.meacc{fill:rgba(47,125,246,.14);stroke:rgba(47,125,246,.4)}

.tools{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
  background:var(--bg);border-top:1px solid var(--line)}
.tools button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:56px;border-radius:12px;
  border:1.5px solid transparent;background:transparent;font-size:11.5px;font-weight:600;color:var(--muted);min-width:0}
.tools button i{font-style:normal;font-size:19px;line-height:22px;color:var(--fg);display:flex;align-items:center;justify-content:center;height:22px}
.tools button.on{background:var(--hi-soft);border-color:var(--hi);color:var(--fg)}
.ic-tron{display:inline-block;width:17px;height:17px;border-radius:50%;border:2.5px solid currentColor}
.ic-vuong{display:inline-block;width:15px;height:15px;border:2.5px solid currentColor}
.ic-road{display:inline-block;width:22px;height:9px;border-radius:5px;background:var(--road-c)}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);
  border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);padding:10px 12px 0;
  display:flex;flex-direction:column;gap:8px;max-height:74%;overflow-y:auto}
.shh{display:flex;align-items:center;gap:6px}
.grow{flex:1}
.btn{height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);padding:0 13px;font-weight:700;font-size:14.5px;white-space:nowrap}
.btn.sm{height:38px;padding:0 10px;font-size:13.5px}
.btn.pri{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.btn.danger{color:var(--warn);border-color:currentColor;background:transparent}
.btn.armed{background:var(--warn);color:#fff;border-color:var(--warn)}
.sact{position:sticky;bottom:0;background:var(--bg);display:flex;gap:8px;padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px));margin-top:auto}
.sact .btn{flex:1;padding:0 6px}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.sl{position:relative;min-height:46px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);padding:3px 32px 4px 9px;
  display:flex;flex-direction:column;justify-content:center;min-width:0;cursor:pointer}
.sl .k{font-size:11px;font-weight:600;color:var(--muted)}
.sl .v{font:700 15px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl .v.e{font:400 12.5px var(--f);color:var(--muted)}
.sl.on{border:2px solid var(--hi);background:var(--hi-soft)}
.sl.wide{grid-column:1/3}
.sl .x{position:absolute;right:0;top:50%;transform:translateY(-50%);width:34px;height:40px;border:0;background:transparent;color:var(--muted);font-size:19px}
.rin{border:0;background:transparent;color:var(--fg);font:700 15px var(--f);padding:0;min-width:0;width:100%}
.opts{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.ot{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.og{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.o{min-height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font:600 14px var(--mono);padding:2px 4px}
.o.t{font-family:var(--f)}
.o.on{background:var(--hi);border-color:var(--hi);color:var(--hi-fg)}
.typ{display:flex;gap:6px}
.typ .inp{flex:1;min-width:0;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--fg);font:600 16px var(--mono);padding:0 10px}
.cnt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.cn{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);min-width:0}
.cn.has{border-color:var(--hi);background:var(--hi-soft)}
.cn span{flex:1;padding-left:10px;font-weight:600;font-size:13.5px;min-width:0}
.cn b{min-width:24px;text-align:center;font:700 16px var(--mono)}
.cn button{flex:0 0 42px;height:42px;border:0;background:transparent;font-size:21px;font-weight:700}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0 0 10px}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.tbl{border-collapse:collapse;width:max-content;min-width:100%;font-size:13.5px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;white-space:nowrap}
.tbl th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tbl td.m{font-family:var(--mono);font-weight:600}
.tbl tr[data-id]{cursor:pointer}
.tbl tr[data-id]:active{background:var(--hi-soft)}

#panel{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.pin{max-width:640px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:12px}
.pin h2{margin:0;font-size:20px}
.card{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 14px}
.card .tx{flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:0}
.card .tx b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .tx span{font:13px var(--mono);color:var(--muted)}
.card.cur{border-color:var(--hi);border-width:2px}
.big{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:var(--paper);
  border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.big b{font-size:16.5px}.big span{font-size:13.5px;color:var(--muted)}
.big.pri{border-color:var(--ink)}
.note{font-size:13.5px;color:var(--muted);line-height:1.55;margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 160px}
label.btn{display:flex;align-items:center;justify-content:center}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .16s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}}}
</style>
</head>
<body>
<header class="top">
  <button id="b-list" class="ib" aria-label="Danh sách bản vẽ">☰</button>
  <button id="b-title" class="ttl" aria-label="Đổi tên tuyến">Tuyến</button>
  <button id="b-undo" class="ib" aria-label="Hoàn tác">↶</button>
  <button id="b-fit" class="ib" aria-label="Xem toàn bộ">⤢</button>
  <button id="b-table" class="ib" aria-label="Bảng cột">▤</button>
  <button id="b-export" class="ib pri">Xuất</button>
</header>
<div id="stage"><svg id="cv" role="img" aria-label="Sơ đồ tuyến"></svg><div id="status"></div></div>
<nav class="tools" aria-label="Công cụ">
  <button data-tool="cot" class="on"><i><span class="ic-tron"></span></i>Cột</button>
  <button data-tool="duong"><i><span class="ic-road"></span></i>Đường</button>
  <button data-tool="moc"><i>⚑</i>Mốc</button>
  <button data-tool="chon"><i>✥</i>Dời</button>
  <button data-tool="noi"><i>╱</i>Nối dây</button>
  <button id="b-gps"><i>⌖</i><span id="gps-lab">GPS</span></button>
</nav>
<section id="sheet" class="sheet" hidden aria-label="Nhập cột">
  <div class="shh">
    <button id="sh-prev" class="btn sm" aria-label="Cột trước">◀</button>
    <button id="sh-next" class="btn sm" aria-label="Cột sau">▶</button>
    <button id="sh-copy" class="btn sm">⧉ Giống cột trước</button>
    <span class="grow"></span>
    <button id="sh-del" class="btn sm danger">Xoá</button>
  </div>
  <div id="slots" class="slots"></div>
  <div id="opts" class="opts"></div>
  <div class="sact">
    <button id="sh-new" class="btn">Đoạn mới</button>
    <button id="sh-end" class="btn">Kết thúc</button>
    <button id="sh-ok" class="btn pri">Xong ▸</button>
  </div>
</section>
<section id="rsheet" class="sheet" hidden aria-label="Sửa đường">
  <div class="shh"><b style="font-size:15.5px">Sửa đường</b><span class="grow"></span>
    <button id="rs-del" class="btn sm danger">Xoá đường</button><button id="rs-ok" class="btn sm pri">Xong</button></div>
  <div class="slots">
    <label class="sl"><span class="k">Tên đường</span><input id="rs-ten" class="rin" placeholder="QL10, đường thôn…" autocomplete="off"></label>
    <div class="cn"><span>Rộng <b id="rs-wv">7</b> m</span><button type="button" data-rw="-1" aria-label="Hẹp lại">−</button><button type="button" data-rw="1" aria-label="Rộng ra">+</button></div>
  </div>
  <p class="hint">Kéo chấm vàng ở hai đầu để sửa vị trí. Kéo chấm rỗng giữa đoạn để thêm điểm gấp; giữ lâu một điểm để bỏ. Vẽ nhánh: chạm điểm ngoài rồi chạm vào thân đường.</p>
</section>
<section id="panel" hidden></section>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script src="xlsx.full.min.js" defer></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const LSK='kstuyen_v1';
const SHAPE_NAME={tron:'Cột tròn',vuong:'Cột vuông',cs:'Cột CS',tba:'TBA'};

/* ================= lưu trữ ================= */
let DB=(()=>{try{return JSON.parse(localStorage.getItem(LSK))||{ds:{},cur:null}}catch(e){return {ds:{},cur:null}}})();
DB.snap=true;
for(const d of Object.values(DB.ds)){d.roads=d.roads||[];d.mocs=d.mocs||[];d.edges=d.edges||[]}
let saveT=null;
function saveNow(){clearTimeout(saveT);saveT=null;try{localStorage.setItem(LSK,JSON.stringify(DB))}catch(e){toast('Bộ nhớ đầy — xuất file rồi xoá bớt bản vẽ cũ')}}
function save(){if(D)D.capNhat=Date.now();clearTimeout(saveT);saveT=setTimeout(saveNow,400)}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&saveT)saveNow()});
window.addEventListener('pagehide',()=>{if(saveT)saveNow()});
function newD(ten){const d={id:uid(),ten:ten||('Tuyến '+today()),ngay:today(),poles:[],edges:[],roads:[],mocs:[],geo:null,active:null,view:null,capNhat:Date.now()};
  DB.ds[d.id]=d;DB.cur=d.id;saveNow();return d}
let D=DB.ds[DB.cur]||Object.values(DB.ds).sort((a,b)=>b.capNhat-a.capNhat)[0]||newD();
DB.cur=D.id;

/* ================= đọc mã cột ================= */
const norm=t=>String(t).toUpperCase().replace(/\s+/g,'');
const DD=/^(ĐỠ|NÉO|GÓC|CUỐI|RẼ|ĐẦU|NGHIÊNG|NỨT|GÃY|TRONGNGÕ|RUỘNG|VƯỜN)/;
const SAU_RE=/^\s*(s|sau|sct)\s*:\s*/i;
function kindOf(tok){
  const u=norm(tok);if(!u)return '';
  if(/^GC:/.test(u))return 'gc';
  if(/^(S|SAU|SCT):/.test(u))return 'sau';
  if(/^\d+([.,]\d+)?M$/.test(u))return 'kc';
  if(/^(H1|H2|H4|3P|3PHA)[:=]\d+$/.test(u))return 'ct';
  if(/^TỦCŨ[:=]?\d+$/.test(u))return 'tucu';
  if(/^(TỦ|TỦMỚI|TM)[:=]?\d+$/.test(u))return 'tu';
  const parts=u.split(/>|→/), base=parts[0]||parts[1]||'';
  if(/^\d*(LT|H|BT|NPC)\d+([.,]\d+)?M?$/.test(base)||/^\d*CỘT(GỖ|THÉP|SẮT)$/.test(base)||base==='NHỔBỎ')return 'cot';
  if(/^\d*CXV/.test(base)||/^\d*MULLER/.test(base))return 'sau';
  if(/^\d*(VX|AV|ABC|A|CU|M|AC)\d/.test(base)||base==='THUHỒI')return 'day';
  if(DD.test(u))return 'dd';
  return 'gc';
}
function splitCode(s){const t=String(s||'').split(';').map(x=>x.trim());return [t[0]||''].concat(t.slice(1).filter(Boolean))}
function parse(code){
  const toks=splitCode(code);
  const r={so:toks[0],cotHT:[],cotTT:[],dayHT:[],dayTT:[],sau:[],dd:[],gc:[],kc:'',h1:0,h2:0,h4:0,p3:0,tuMoi:0,tuCu:0,toks:[]};
  for(const t of toks.slice(1)){
    const k=kindOf(t);r.toks.push({t,k});
    if(k==='cot'||k==='day'){const [a,b]=t.split(/>|→/).map(s=>s.trim());if(a)r[k+'HT'].push(a);if(b)r[k+'TT'].push(b)}
    else if(k==='sau')r.sau.push(t.replace(SAU_RE,''));
    else if(k==='kc')r.kc=parseFloat(t.replace(',','.'));
    else if(k==='ct'){const u=norm(t),n=+u.split(/[:=]/)[1]||0;r[u.startsWith('H1')?'h1':u.startsWith('H2')?'h2':u.startsWith('H4')?'h4':'p3']+=n}
    else if(k==='tu')r.tuMoi+=+norm(t).replace(/^\D+/,'')||0;
    else if(k==='tucu')r.tuCu+=+norm(t).replace(/^\D+/,'')||0;
    else if(k==='dd')r.dd.push(t);
    else r.gc.push(t.replace(/^\s*gc\s*:\s*/i,''));
  }
  return r;
}
/* viết hoa chữ ký hiệu (vx4x120 → VX4x120) khi chốt cột; ghi chú để nguyên */
function chuanHoa(code){
  const t=splitCode(code);
  return t.map((x,i)=>{
    if(!i)return x;const k=kindOf(x);
    if(!['cot','day','sau','ct'].includes(k)||/\s/.test(x.replace(SAU_RE,'')))return x;
    return x.replace(/[a-zA-ZđĐ]+/g,(m,o,s)=>/^x$/i.test(m)&&/\d/.test(s[o-1]||'')&&/\d/.test(s[o+1]||'')?'x':m.toUpperCase());
  }).join(';')+(t.length>1?';':'');
}
const J=a=>a.join(' + ');
const pair=(h,t)=>h.length||t.length?(J(h)||'—')+(t.length?' → '+J(t):''):'';
function ctText(r){return [['H1',r.h1],['H2',r.h2],['H4',r.h4],['3P',r.p3]].filter(x=>x[1]).map(x=>x[0]+':'+x[1]).join(' ')}
function tuText(r){return [r.tuMoi?r.tuMoi+' tủ mới':'',r.tuCu?r.tuCu+' tủ cũ':''].filter(Boolean).join(', ')}
function isDoi(p,r){return !!p.doi||/^2/.test((r||parse(p.code)).cotHT[0]||'')}
function ddText(p,r){const a=[];if(p.shape==='tba'||p.shape==='cs')a.push(SHAPE_NAME[p.shape]);if(p.doi&&!/^2/.test(r.cotHT[0]||''))a.push('Cột đôi');return a.concat(r.dd)}
function labelLines(p,r){
  return [[pair(r.cotHT,r.cotTT),pair(r.dayHT,r.dayTT)].filter(Boolean).join(' · '),
    [ctText(r),J(r.sau),tuText(r)].filter(Boolean).join(' · '),
    r.dd.concat(r.gc).join('; ')].filter(Boolean);
}
function wrap(s,n){const out=[];let cur='';for(const w of s.split(' ')){if(cur&&(cur+' '+w).length>n){out.push(cur);cur=w}else cur=cur?cur+' '+w:w}if(cur)out.push(cur);return out}
function parseSo(s){const m=String(s||'').trim().split(/\s+/)[0].match(/^(.*?)(\d+)$/);return m?{pre:m[1],num:+m[2]}:null}
function soTiep(a,b){const pa=parseSo(a);if(!pa)return '';let step=1;
  if(b){const pb=parseSo(b);if(pb&&pb.pre===pa.pre&&pb.num-pa.num===1)step=-1}
  const v=pa.num+step;return v<0?'':pa.pre+v}

/* ================= hình học đường ================= */
function nearestOn(pts,x,y){
  let best=null,acc=0;
  for(let i=0;i<pts.length-1;i++){
    const [ax,ay]=pts[i],[bx,by]=pts[i+1],dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy);if(!L)continue;
    const t=Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/(L*L))),px=ax+t*dx,py=ay+t*dy,d=Math.hypot(x-px,y-py);
    if(!best||d<best.d)best={d,px,py,s:acc+t*L,ux:dx/L,uy:dy/L,side:Math.sign((dx/L)*(y-py)-(dy/L)*(x-px))||1};
    acc+=L;
  }
  return best;
}
function pointAt(pts,s){
  let acc=0;
  for(let i=0;i<pts.length-1;i++){
    const [ax,ay]=pts[i],[bx,by]=pts[i+1],L=Math.hypot(bx-ax,by-ay);if(!L)continue;const ux=(bx-ax)/L,uy=(by-ay)/L;
    if(s<=acc+L||i===pts.length-2){const t=Math.max(s-acc,i===0?s-acc:0);return {x:ax+ux*t,y:ay+uy*t,ux,uy}}
    acc+=L;
  }
  return {x:pts[0][0],y:pts[0][1],ux:1,uy:0};
}
function nearestRoad(x,y,extra){
  let best=null;
  for(const r of D.roads){const n=nearestOn(r.pts,x,y);if(n&&n.d<=r.w/2+extra&&(!best||n.d<best.n.d))best={r,n}}
  return best;
}
function roadMid(r){let best=0,bi=0;for(let i=0;i<r.pts.length-1;i++){const L=Math.hypot(r.pts[i+1][0]-r.pts[i][0],r.pts[i+1][1]-r.pts[i][1]);if(L>best){best=L;bi=i}}
  return [(r.pts[bi][0]+r.pts[bi+1][0])/2,(r.pts[bi][1]+r.pts[bi+1][1])/2]}
function offsetPts(pts,o){return pts.map((p,i)=>{const a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)];
  let ux=b[0]-a[0],uy=b[1]-a[1];const L=Math.hypot(ux,uy)||1;ux/=L;uy/=L;return [p[0]-uy*o,p[1]+ux*o]})}
function junctions(){
  const out=[],add=(x,y,n)=>{const e=out.find(j=>Math.hypot(j.x-x,j.y-y)<4);if(e)e.n=Math.max(e.n,n);else out.push({x,y,n})};
  const R=D.roads;
  for(let i=0;i<R.length;i++)for(let j=0;j<R.length;j++){if(i===j)continue;
    for(const e of [R[i].pts[0],R[i].pts[R[i].pts.length-1]]){const n=nearestOn(R[j].pts,e[0],e[1]);
      if(n&&n.d<0.8){const L=R[j].pts.length,end=Math.hypot(n.px-R[j].pts[0][0],n.py-R[j].pts[0][1])<0.8||Math.hypot(n.px-R[j].pts[L-1][0],n.py-R[j].pts[L-1][1])<0.8;
        if(!end)add(n.px,n.py,3)}}
    if(j<i)continue;
    const A=R[i].pts,B=R[j].pts;
    for(let a=0;a<A.length-1;a++)for(let b=0;b<B.length-1;b++){
      const [x1,y1]=A[a],[x2,y2]=A[a+1],[x3,y3]=B[b],[x4,y4]=B[b+1],den=(x1-x2)*(y3-y4)-(y1-y2)*(x3-x4);if(Math.abs(den)<1e-9)continue;
      const t=((x1-x3)*(y3-y4)-(y1-y3)*(x3-x4))/den,u=-((x1-x2)*(y1-y3)-(y1-y2)*(x1-x3))/den;
      const inA=(t>0.001&&t<0.999)||(t>=-1e-9&&t<=1+1e-9&&((a>0&&t<=0.001)||(a<A.length-2&&t>=0.999)));
      const inB=(u>0.001&&u<0.999)||(u>=-1e-9&&u<=1+1e-9&&((b>0&&u<=0.001)||(b<B.length-2&&u>=0.999)));
      if(inA&&inB)add(x1+t*(x2-x1),y1+t*(y2-y1),4)}
  }
  return out;
}

/* ================= mô hình ================= */
const byId=id=>D.poles.find(p=>p.id===id);
const activeP=()=>D.active?byId(D.active):null;
const hasEdge=(a,b)=>D.edges.some(([x,y])=>(x===a&&y===b)||(x===b&&y===a));
let undoSt=[];
function snap(){undoSt.push(JSON.stringify({poles:D.poles,edges:D.edges,roads:D.roads,mocs:D.mocs,geo:D.geo,active:D.active}));if(undoSt.length>60)undoSt.shift()}
function haversine(a,b){const R=6371000,r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lon-a.lon)*r;
  const h=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function nextCode(prev,gpsKc){
  if(!prev)return '';
  const pp=prev.from?byId(prev.from):null;
  const r=parse(prev.code);
  const so=soTiep(r.so,pp?parse(pp.code).so:null);
  const carry=r.toks.filter(x=>x.k==='cot'||x.k==='day').map(x=>x.t.split(/>|→/)[0].trim()).filter(Boolean);
  const t=[so,...carry];if(gpsKc)t.push(gpsKc+'m');
  return t.join(';')+';';
}
const inheritShape=p=>!p||p.shape==='tba'?'tron':p.shape;
function snapToRoad(x,y){
  if(!DB.snap||!D.roads.length)return {x,y};
  const b=nearestRoad(x,y,Math.max(6,26/V.s));if(!b)return {x,y};
  const o=b.r.w/2+1.5,n=b.n;return {x:n.px+n.side*o*(-n.uy),y:n.py+n.side*o*n.ux};
}
function addPole(x,y,shape,gps,auto){
  snap();
  const prev=activeP();
  if(prev){prev.code=chuanHoa(prev.code);prev.auto=false}
  let kc='';if(gps&&prev&&prev.lat!=null)kc=Math.round(haversine(prev,gps));
  const p={id:uid(),x,y,shape:shape||inheritShape(prev),doi:!!(prev&&prev.doi&&prev.shape!=='tba'),code:nextCode(prev,kc),from:prev?prev.id:null,t:Date.now()};
  if(gps){p.lat=+gps.lat.toFixed(7);p.lon=+gps.lon.toFixed(7);p.acc=Math.round(gps.acc)}
  if(auto){p.auto=true;p.autoCode=p.code}
  D.poles.push(p);if(prev)D.edges.push([prev.id,p.id]);
  D.active=p.id;save();draw();openSheet(p);
}
function removePole(id){
  D.poles=D.poles.filter(p=>p.id!==id);D.edges=D.edges.filter(([a,b])=>a!==id&&b!==id);
  for(const p of D.poles)if(p.from===id)p.from=null;
  if(D.active===id)D.active=null;save();
}
/* cột tự đặt mà chưa nhập gì thì bỏ khi rời đi */
function dropAuto(){const p=editId&&byId(editId);if(p&&p.auto&&p.code===p.autoCode){const f=p.from;removePole(p.id);D.active=f||null;return true}return false}
function nextPos(p){
  const f=p.from?byId(p.from):null;
  let sp=+parse(p.code).kc||(f?Math.hypot(p.x-f.x,p.y-f.y):30);sp=Math.min(Math.max(sp,5),200);
  const b=D.roads.length?nearestRoad(p.x,p.y,8):null;
  if(b){const r=b.r,n=b.n;let dir=1;
    if(f){const nf=nearestOn(r.pts,f.x,f.y);if(nf&&nf.s>n.s)dir=-1}
    const q=pointAt(r.pts,n.s+dir*sp),o=n.d,side=n.side;
    return {x:q.x+side*o*(-q.uy),y:q.y+side*o*q.ux};
  }
  let ux=1,uy=0;if(f){const L=Math.hypot(p.x-f.x,p.y-f.y);if(L>0.01){ux=(p.x-f.x)/L;uy=(p.y-f.y)/L}}
  return {x:p.x+ux*sp,y:p.y+uy*sp};
}

const cv=$('#cv'), stage=$('#stage');
let W=0,H=0,V=D.view||null,tool='cot',noiA=null,editId=null,selRoad=null,roadStart=null,fix=null,watchId=null,gpsPending=false,tmpRoad=null;
function sizeUp(){const r=stage.getBoundingClientRect();W=r.width;H=r.height;cv.setAttribute('viewBox',`0 0 ${W} ${H}`)}
function allPts(){const a=D.poles.map(p=>[p.x,p.y]);for(const r of D.roads)a.push(...r.pts);for(const m of D.mocs)a.push([m.x,m.y]);return a}
function fitView(w,h,pad){
  const pts=allPts();if(!pts.length)return {s:3,tx:w/2,ty:h/2};
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const [x,y] of pts){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}
  const bw=Math.max(x1-x0,20),bh=Math.max(y1-y0,20);
  const s=Math.min(Math.max(Math.min((w-2*pad-120)/bw,(h-2*pad)/bh),0.2),20);
  return {s,tx:w/2-(x0+x1)/2*s-40,ty:h/2-(y0+y1)/2*s};
}
function symSvg(p,x,y,R,cls,r){
  const one=(cx)=>p.shape==='vuong'?`<rect class="${cls}" x="${cx-R}" y="${y-R}" width="${2*R}" height="${2*R}"/>`
    :p.shape==='cs'?`<circle class="${cls}" cx="${cx}" cy="${y}" r="${R}"/><path class="${cls}" style="fill:none" d="M${cx-R*.7} ${y-R*.7}L${cx+R*.7} ${y+R*.7}M${cx+R*.7} ${y-R*.7}L${cx-R*.7} ${y+R*.7}"/>`
    :`<circle class="${cls}" cx="${cx}" cy="${y}" r="${R}"/>`;
  if(p.shape==='tba'){const a=R*1.5;return `<rect class="${cls}" x="${x-a}" y="${y-a}" width="${2*a}" height="${2*a}"/><path class="fillk" d="M${x-a} ${y+a}L${x+a} ${y-a}L${x+a} ${y+a}Z"/>`}
  return isDoi(p,r)?one(x-R*0.95)+one(x+R*0.95):one(x);
}
function svgInner(v,w,h,o={}){
  const X=x=>+(x*v.s+v.tx).toFixed(1), Y=y=>+(y*v.s+v.ty).toFixed(1), k=o.k||1;
  let g='';
  if(!o.noGrid){let st=10;while(st*v.s<18)st*=5;
    const gx0=Math.floor(-v.tx/v.s/st)*st, gy0=Math.floor(-v.ty/v.s/st)*st;
    for(let x=gx0;x*v.s+v.tx<w;x+=st)g+=`<line class="grid" x1="${X(x)}" y1="0" x2="${X(x)}" y2="${h}"/>`;
    for(let y=gy0;y*v.s+v.ty<h;y+=st)g+=`<line class="grid" x1="0" y1="${Y(y)}" x2="${w}" y2="${Y(y)}"/>`;}
  for(const r of D.roads){const d='M'+r.pts.map(q=>X(q[0])+' '+Y(q[1])).join('L');
    g+=`<path class="road${r.id===selRoad&&!o.print?' sel':''}" d="${d}" style="stroke-width:${Math.max(r.w*v.s,6).toFixed(1)}px"/><path class="roadc" d="${d}"/>`;
    if(r.ten){const m=roadMid(r);g+=`<text class="lb rn" x="${X(m[0])}" y="${Y(m[1])+4}" text-anchor="middle">${esc(r.ten)}</text>`}}
  const sr=!o.print&&tool==='duong'&&selRoad&&D.roads.find(r=>r.id===selRoad);
  if(sr){for(let i=0;i<sr.pts.length-1;i++)g+=`<circle class="hm" cx="${X((sr.pts[i][0]+sr.pts[i+1][0])/2)}" cy="${Y((sr.pts[i][1]+sr.pts[i+1][1])/2)}" r="6"/>`;
    sr.pts.forEach((q,i)=>{g+=`<circle class="hd" cx="${X(q[0])}" cy="${Y(q[1])}" r="${i===0||i===sr.pts.length-1?9:7}"/>`})}
  if(tmpRoad)g+=`<path class="tmp" d="M${tmpRoad.map(q=>X(q[0])+' '+Y(q[1])).join('L')}"/>`;
  if(roadStart&&!o.print)g+=`<circle class="noiA" cx="${X(roadStart[0])}" cy="${Y(roadStart[1])}" r="7"/>`;
  const mocNear=(x,y)=>D.mocs.some(m=>Math.hypot(m.x-x,m.y-y)<8);
  for(const j of junctions()){const x=X(j.x),y=Y(j.y),a=5*k;
    g+=`<path class="jn" d="M${x} ${y-a}L${x+a} ${y}L${x} ${y+a}L${x-a} ${y}Z"/>`;
    if(!mocNear(j.x,j.y))g+=`<text class="lb jt" x="${x+8*k}" y="${y+12*k}">Ngã ${j.n===4?'tư':'ba'}</text>`}
  for(const [a,b] of D.edges){const A=byId(a),B=byId(b);if(A&&B)g+=`<line class="ed" x1="${X(A.x)}" y1="${Y(A.y)}" x2="${X(B.x)}" y2="${Y(B.y)}"/>`}
  const pr={};for(const p of D.poles)pr[p.id]=parse(p.code);
  for(const p of D.poles){const q=p.from&&byId(p.from);const kc=pr[p.id].kc;
    if(q&&kc&&hasEdge(p.id,q.id))g+=`<text class="lb kc" x="${((p.x+q.x)/2*v.s+v.tx).toFixed(1)}" y="${((p.y+q.y)/2*v.s+v.ty-5*k).toFixed(1)}" text-anchor="middle">${esc(String(kc).replace('.',','))}</text>`}
  for(const m of D.mocs){const x=X(m.x),y=Y(m.y);
    g+=`<path class="moc" d="M${x} ${y}L${x} ${y-16*k}L${x+11*k} ${y-12*k}L${x} ${y-8*k}Z"/><circle class="moc" cx="${x}" cy="${y}" r="${2.5*k}"/>`;
    g+=`<text class="lb mc" x="${x+13*k}" y="${y-6*k}">${esc(m.ten)}</text>`}
  const R=7*k;
  for(const p of D.poles){
    const x=X(p.x),y=Y(p.y),c='pole'+(p.id===D.active&&!o.print?' act':''),r=pr[p.id],doi=isDoi(p,r)&&p.shape!=='tba';
    if(p.id===editId&&!o.print)g+=`<circle class="ring" cx="${x}" cy="${y}" r="${R*(doi?2:1)+7}"/>`;
    if(p.id===noiA)g+=`<circle class="noiA" cx="${x}" cy="${y}" r="${R*(doi?2:1)+6}"/>`;
    g+=symSvg(p,x,y,R,c,r);
    const lx=x+R*(p.shape==='tba'?1.5:doi?2:1)+5;
    g+=`<text class="lb so" x="${lx}" y="${y-3*k}">${esc(r.so||(p.shape==='tba'?'TBA':'?'))}</text>`;
    const lines=[];for(const l of labelLines(p,r))lines.push(...wrap(l,o.print?40:30));
    if(lines.length)g+=`<text class="lb dt" x="${lx}" y="${y+11*k}">${lines.map((l,i)=>`<tspan x="${lx}" dy="${i?12.5*k:0}">${esc(l)}</tspan>`).join('')}</text>`;
  }
  if(fix&&D.geo&&!o.print){const m=geoToXY(fix.lat,fix.lon,false);const mx=X(m.x),my=Y(m.y);
    g+=`<circle class="meacc" cx="${mx}" cy="${my}" r="${Math.min(fix.acc*v.s,200).toFixed(1)}"/><circle class="me" cx="${mx}" cy="${my}" r="7"/>`}
  return g;
}
let rafP=false;
function draw(){if(rafP)return;rafP=true;requestAnimationFrame(()=>{rafP=false;render()})}

function status(){
  const a=activeP(),ed=editId&&byId(editId);let h='';
  if(tool==='noi')h=`<span class="pill solo">${noiA?'Chạm cột thứ hai để nối / bỏ nối':'Nối dây: chạm cột thứ nhất'}</span>`;
  else if(tool==='chon')h=`<span class="pill solo">Kéo cột, mốc để dời · chạm cột để sửa</span>`;
  else if(tool==='moc')h=`<span class="pill solo">Chạm để đặt mốc · chạm mốc để đổi tên / xoá</span>`;
  else if(tool==='duong')h=roadStart?`<span class="pill">Chạm điểm cuối của đường<button data-st="rx">Huỷ</button></span>`
      :selRoad?`<span class="pill solo">Kéo chấm vàng để sửa · chạm chỗ trống để bỏ chọn</span>`
      :`<span class="pill solo">Chạm điểm đầu rồi điểm cuối · chạm vào đường để sửa</span>`;
  else if(ed&&ed.auto)h=`<span class="pill solo">Cột tự đặt thẳng tuyến — chạm chỗ khác để dời tới đó</span>`;
  else if(a)h=`<span class="pill solo">Vẽ tiếp từ ${esc(parse(a.code).so||'cột ?')}</span>`;
  else h=`<span class="pill solo">${D.poles.length?'Đoạn mới — cột sau không nối':'Chạm lên bảng để đặt cột đầu tiên'}</span>`;

  $('#status').innerHTML=h;
}
function persistView(){D.view={s:V.s,tx:V.tx,ty:V.ty};save()}

/* ================= chạm / kéo / thu phóng ================= */
const ptrs=new Map();let G=null;
const loc=e=>{const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}};
const toW=pt=>[(pt.x-V.tx)/V.s,(pt.y-V.ty)/V.s];
function hit(pt){let best=null,bd=26*26;for(const p of D.poles){const dx=p.x*V.s+V.tx-pt.x,dy=p.y*V.s+V.ty-pt.y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=p}}return best}
function hitMoc(pt){return D.mocs.find(m=>Math.hypot(m.x*V.s+V.tx-pt.x,m.y*V.s+V.ty-8-pt.y)<22)}
function hitRoad(pt){const [x,y]=toW(pt);const b=nearestRoad(x,y,14/V.s);return b&&b.r}
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);const pt=loc(e);ptrs.set(e.pointerId,pt);
  if(ptrs.size===1){const hh=hitHandle(pt);
    G={type:'tap',p0:pt,v0:{...V},hh,hit:hh?null:tool==='moc'||tool==='chon'?(hit(pt)||hitMoc(pt)):hit(pt)};
    if(hh&&hh.kind==='v'&&hh.r.pts.length>2)G.lp=setTimeout(()=>{if(G&&G.type==='tap'&&G.hh===hh){snap();hh.r.pts.splice(hh.i,1);save();G=null;draw();toast('Đã bỏ điểm')}},650)}
  else if(ptrs.size===2){tmpRoad=null;if(G&&G.lp)clearTimeout(G.lp);const [a,b]=[...ptrs.values()];
    G={type:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y)||1,c0:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},v0:{...V}};draw()}
});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)||!G)return;const pt=loc(e);ptrs.set(e.pointerId,pt);
  if(G.type==='tap'){if(Math.hypot(pt.x-G.p0.x,pt.y-G.p0.y)>8){
      if(G.lp)clearTimeout(G.lp);
      if(G.hh){snap();G.type='rdrag';G.vi=G.hh.kind==='m'?(G.hh.r.pts.splice(G.hh.i+1,0,toW(pt)),G.hh.i+1):G.hh.i}
      else if(G.hit&&(tool==='chon'||G.hit.id===editId)){snap();G.type='drag'}
      else if(tool==='duong'){G.type='road';roadStart=null;tmpRoad=[toW(G.p0),toW(pt)]}
      else G.type='pan'}else return}
  if(G.type==='pan'){V.tx=G.v0.tx+pt.x-G.p0.x;V.ty=G.v0.ty+pt.y-G.p0.y;draw()}
  else if(G.type==='drag'){const [x,y]=toW(pt);G.hit.x=x;G.hit.y=y;if(G.hit.auto)G.hit.auto=false;draw()}
  else if(G.type==='road'){tmpRoad[1]=toW(pt);draw()}
  else if(G.type==='rdrag'){G.hh.r.pts[G.vi]=toW(pt);draw()}
  else if(G.type==='pinch'&&ptrs.size===2){const [a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y),c={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    const s=Math.min(Math.max(G.v0.s*d/G.d0,0.05),60);
    const wx=(G.c0.x-G.v0.tx)/G.v0.s,wy=(G.c0.y-G.v0.ty)/G.v0.s;
    V.s=s;V.tx=c.x-wx*s;V.ty=c.y-wy*s;draw()}
});
function pEnd(e){

/* điểm đầu/cuối đường: hít vào đầu mút đường cũ (nối dài) hoặc vào thân đường (ngã ba) */
function snapRoadPt(p,bo){
  let best=null;const tolE=24/V.s;
  for(const r of D.roads){if(r===bo)continue;const L=r.pts.length;for(const [e,first] of [[r.pts[0],true],[r.pts[L-1],false]]){
    const d=Math.hypot(e[0]-p[0],e[1]-p[1]);if(d<tolE&&(!best||d<best.d))best={d,pt:[e[0],e[1]],end:{r,first}}}}
  if(best)return best;
  for(const r of D.roads){if(r===bo)continue;const n=nearestOn(r.pts,p[0],p[1]);if(n&&n.d<Math.max(r.w/2,22/V.s)&&(!best||n.d<best.d))best={d:n.d,pt:[n.px,n.py]}}
  return best||{pt:p};
}
function makeRoad(a,b){
  const A=snapRoadPt(a),B=snapRoadPt(b),r3=q=>[+q[0].toFixed(3),+q[1].toFixed(3)],pa=r3(A.pt),pb=r3(B.pt);
  if(Math.hypot(pa[0]-pb[0],pa[1]-pb[1])*V.s<20){draw();return}
  snap();
  const extend=(E,q)=>{const r=E.r;if(E.first)r.pts.unshift(q);else r.pts.push(q)};
  if(A.end&&!(B.end&&B.end.r===A.end.r))extend(A.end,pb);
  else if(B.end&&!(A.end&&A.end.r===B.end.r))extend(B.end,pa);
  else D.roads.push({id:uid(),pts:[pa,pb],w:DB.roadW||7});
  save();draw();
}
function onTap(pt,h){

      else{D.edges.push([noiA,h.id]);toast('Đã nối dây')}save()}
    noiA=null;draw();return;
  }
  if(tool==='duong'){const w=toW(pt);
    if(roadStart){const a=roadStart;roadStart=null;makeRoad(a,w);return}
    const r=hitRoad(pt);if(r){openRoad(r);return}
    if(selRoad){closeRoad();return}
    roadStart=w;draw();return}
  if(tool==='moc'){
    if(h&&h.ten!==undefined){const t=prompt('Tên mốc (xoá hết chữ để bỏ mốc)',h.ten);if(t===null)return;snap();
      if(t.trim())h.ten=t.trim();else D.mocs=D.mocs.filter(m=>m!==h);save();draw();return}
    const [x,y]=toW(pt);const t=prompt('Tên mốc (vd: Ngã tư chợ, Cổng UBND)','');if(t===null)return;
    snap();D.mocs.push({id:uid(),x,y,ten:t.trim()||'Mốc'});save();draw();return;
  }
  if(h&&h.ten===undefined){if(h.id!==editId)dropAuto();D.active=h.id;save();openSheet(byId(h.id)||h);return}
  if(tool==='chon'){finishSheet();return}

  if(ed&&ed.auto){snap();ed.x=q.x;ed.y=q.y;save();draw();return}

}

function sizeKey(v){
  const u=norm(v),m=u.match(/^(\d*)([A-ZĐ]+)(\d+(?:[.,]\d+)?)(?:X(\d+(?:[.,]\d+)?))?$/),f=x=>parseFloat(String(x).replace(',','.'));
  if(!m)return [99,0,0,0,u];
  const ti=ORD.indexOf(m[2]);return [ti<0?50:ti,f(m[3]),m[4]?f(m[4]):0,+m[1]||1,u];
}
function cmpSize(a,b,boLoai){const A=sizeKey(a),B=sizeKey(b);for(let i=boLoai&&A[0]<50&&B[0]<50?1:0;i<4;i++)if(A[i]!==B[i])return A[i]-B[i];return A[4]<B[4]?-1:A[4]>B[4]?1:0}
function learned(kind){
  const src=kind==='cotTT'?'cot':kind==='dayTT'?'day':kind,cnt={};
  for(const d of Object.values(DB.ds))for(const p of d.poles){const r=parse(p.code);
    const vals=kind==='cot'?r.cotHT:kind==='cotTT'?r.cotTT:kind==='day'?r.dayHT:kind==='dayTT'?r.dayTT:kind==='sau'?r.sau:kind==='gc'?r.gc:[];
    for(const v of vals)if(v)cnt[v]=(cnt[v]||0)+1}
  const base=BASE[kind],have=new Set(base.map(norm));
  const all=base.concat(Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).filter(v=>!have.has(norm(v))).slice(0,12));
  return kind==='gc'?all:all.sort((x,y)=>cmpSize(x,y,src==='sau'));   /* dây sau CT: xếp theo tiết diện, không theo loại */

function hoa(v){return /\s/.test(v)?v:v.replace(/[a-zA-ZđĐ]+/g,(m,o,s)=>/^x$/i.test(m)&&/\d/.test(s[o-1]||'')&&/\d/.test(s[o+1]||'')?'x':m.toUpperCase())}
function codeOf(f){
  const t=[(f.so||'').trim()];

  t.push(...zip(f.cotHT,f.cotTT),...zip(f.dayHT,f.dayTT));
  for(const [k,l] of [['h1','H1'],['h2','H2'],['h4','H4'],['p3','3P']])if(f[k])t.push(l+':'+f[k]);
  t.push(...f.sau.map(v=>'S:'+v));

  return t.join(';')+(t.length>1?';':'');
}

/* ================= GPS ================= */
function geoToXY(lat,lon,setOrigin=true){
  if(!D.geo){if(!setOrigin)return {x:0,y:0};const a=activeP();D.geo={lat0:lat,lon0:lon,x0:a?a.x+30:0,y0:a?a.y:0}}
  const g=D.geo,kx=111320*Math.cos(g.lat0*Math.PI/180);
  return {x:g.x0+(lon-g.lon0)*kx,y:g.y0-(lat-g.lat0)*110574};
}
function gpsLab(){$('#gps-lab').textContent=fix?`±${Math.round(fix.acc)} m`:'GPS'}
function placeGps(){dropAuto();closeSheet();const xy=geoToXY(fix.lat,fix.lon);addPole(xy.x,xy.y,null,fix);
  if(fix.acc>15)toast(`GPS sai số ±${Math.round(fix.acc)} m — đứng chỗ thoáng cho chuẩn hơn`)}
$('#b-gps').addEventListener('click',()=>{
  if(!('geolocation' in navigator)){toast('Máy này không có định vị');return}
  if(watchId===null)watchId=navigator.geolocation.watchPosition(pos=>{
      fix={lat:pos.coords.latitude,lon:pos.coords.longitude,acc:pos.coords.accuracy,t:Date.now()};gpsLab();
      if(gpsPending){gpsPending=false;placeGps()}else draw()},
    err=>{gpsPending=false;if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;draw();
      toast(err.code===1?'Chưa cho phép định vị — bật quyền Vị trí cho trình duyệt':'Chưa bắt được GPS, ra chỗ thoáng rồi bấm lại')},
    {enableHighAccuracy:true,maximumAge:3000,timeout:60000});
  if(fix&&Date.now()-fix.t<15000)placeGps();else{gpsPending=true;draw()}
});

/* thứ tự đi tuyến: đầu mỗi đoạn theo thời gian, rồi lần lượt cột nối tiếp (cả đoạn gộp từ máy khác) */
function sorted(){
  const ids=new Set(D.poles.map(p=>p.id)),kids={},out=[],seen=new Set();
  for(const p of D.poles){const f=p.from&&ids.has(p.from)?p.from:'';(kids[f]=kids[f]||[]).push(p)}
  for(const k in kids)kids[k].sort((a,b)=>a.t-b.t);
  const st=(kids['']||[]).slice().reverse();
  while(st.length){const p=st.pop();if(seen.has(p.id))continue;seen.add(p.id);out.push(p);st.push(...(kids[p.id]||[]).slice().reverse())}
  for(const p of D.poles)if(!seen.has(p.id))out.push(p);
  return out;
}

}

function dxfTxt(s){return String(s).replace(/[^\x20-\x7e]/g,c=>'\\U+'+c.codePointAt(0).toString(16).toUpperCase().padStart(4,'0'))}
function buildDxf(){
  const L=[],a=(...x)=>{for(let i=0;i<x.length;i+=2)L.push(String(x[i]),String(x[i+1]))};
  const f=v=>(+v).toFixed(3),R=0.8;
  a(0,'SECTION',2,'HEADER',9,'$ACADVER',1,'AC1009',0,'ENDSEC');
  a(0,'SECTION',2,'TABLES');
  a(0,'TABLE',2,'LTYPE',70,1,0,'LTYPE',2,'CONTINUOUS',70,0,3,'Solid line',72,65,73,0,40,'0.0',0,'ENDTAB');
  const LY=[['KS_COT',1],['KS_DAY',5],['KS_CHU',7],['KS_KHOANG',3],['KS_DUONG',8],['KS_MOC',6]];
  a(0,'TABLE',2,'LAYER',70,LY.length);for(const [n,c] of LY)a(0,'LAYER',2,n,70,0,62,c,6,'CONTINUOUS');a(0,'ENDTAB');
  a(0,'TABLE',2,'STYLE',70,1,0,'STYLE',2,'KS',70,0,40,'0.0',41,'1.0',50,'0.0',71,0,42,'1.0',3,'arial.ttf',4,'',0,'ENDTAB');
  a(0,'ENDSEC',0,'SECTION',2,'ENTITIES');
  const line=(x1,y1,x2,y2,ly)=>a(0,'LINE',8,ly,10,f(x1),20,f(y1),30,'0.0',11,f(x2),21,f(y2),31,'0.0');
  const txt=(x,y,h,s,ly)=>a(0,'TEXT',8,ly,10,f(x),20,f(y),30,'0.0',40,h,1,dxfTxt(s),7,'KS');
  const circ=(x,y,r,ly)=>a(0,'CIRCLE',8,ly,10,f(x),20,f(y),30,'0.0',40,r);
  const sq=(x,y,r,ly)=>{const c=[[x-r,y-r],[x+r,y-r],[x+r,y+r],[x-r,y+r]];for(let k=0;k<4;k++)line(c[k][0],c[k][1],c[(k+1)%4][0],c[(k+1)%4][1],ly)};
  for(const r of D.roads){
    for(const o of [r.w/2,-r.w/2]){const e=offsetPts(r.pts,o);for(let i=0;i<e.length-1;i++)line(e[i][0],-e[i][1],e[i+1][0],-e[i+1][1],'KS_DUONG')}}
  for(const r of D.roads)if(r.ten){const m=roadMid(r);txt(m[0],-m[1]-0.6,'1.5',r.ten,'KS_DUONG')}
  for(const j of junctions())txt(j.x+1,-j.y-2,'1.2','Ngã '+(j.n===4?'tư':'ba'),'KS_MOC');
  for(const m of D.mocs){circ(m.x,-m.y,0.5,'KS_MOC');txt(m.x+1,-m.y+1,'1.5',m.ten,'KS_MOC')}
  for(const [i,j] of D.edges){const A=byId(i),B=byId(j);if(!A||!B)continue;
    const ax=A.x,ay=-A.y,bx=B.x,by=-B.y,dx=bx-ax,dy=by-ay,l=Math.hypot(dx,dy);if(l<=2*R)continue;const ux=dx/l,uy=dy/l;
    line(ax+ux*R,ay+uy*R,bx-ux*R,by-uy*R,'KS_DAY');
    const kc=parse(B.from===A.id?B.code:A.from===B.id?A.code:'').kc;
    if(kc)txt((ax+bx)/2,(ay+by)/2+0.4,'1.0',String(kc).replace('.',','),'KS_KHOANG');}
  for(const p of D.poles){const x=p.x,y=-p.y,r=parse(p.code),doi=isDoi(p,r)&&p.shape!=='tba';
    const one=cx=>{if(p.shape==='vuong')sq(cx,y,R,'KS_COT');else{circ(cx,y,R,'KS_COT');if(p.shape==='cs'){const d=R*0.7;line(cx-d,y-d,cx+d,y+d,'KS_COT');line(cx-d,y+d,cx+d,y-d,'KS_COT')}}};
    let w=R;
    if(p.shape==='tba'){const s=R*1.5;sq(x,y,s,'KS_COT');a(0,'SOLID',8,'KS_COT',10,f(x-s),20,f(y-s),30,'0.0',11,f(x+s),21,f(y-s),31,'0.0',12,f(x+s),22,f(y+s),32,'0.0',13,f(x+s),23,f(y+s),33,'0.0');w=s}
    else if(doi){one(x-R*0.95);one(x+R*0.95);w=R*2}else one(x);
    txt(x+w+0.4,y+0.9,'1.5',r.so||(p.shape==='tba'?'TBA':'?'),'KS_CHU');
    let yy=y-1.1;for(const l of labelLines(p,r)){txt(x+w+0.4,yy,'1.0',l,'KS_CHU');yy-=1.4}}
  a(0,'ENDSEC',0,'EOF');
  return L.join('\r\n')+'\r\n';
}

function gop(o){
  if(!o||!Array.isArray(o.poles))throw new Error('sai dinh dang');
  const soMap={};for(const p of D.poles){const s=parse(p.code).so;if(s)soMap[norm(s)]=p}
  const exOf=p=>{const s=parse(p.code).so;return s?soMap[norm(s)]:null};
  const ip=o.poles.map(p=>[p.x,p.y]).concat(...(o.roads||[]).map(r=>r.pts),(o.mocs||[]).map(m=>[m.x,m.y]));
  let dx=0,dy=0,how;
  const shared=o.poles.find(exOf);
  if(o.geo&&D.geo){const g=D.geo,kx=111320*Math.cos(g.lat0*Math.PI/180);
    dx=g.x0+(o.geo.lon0-g.lon0)*kx-o.geo.x0;dy=g.y0-(o.geo.lat0-g.lat0)*110574-o.geo.y0;how='theo GPS'}
  else if(shared){const e=exOf(shared);dx=e.x-shared.x;dy=e.y-shared.y;how='nối tại cột '+parse(shared.code).so}
  else if(allPts().length&&ip.length){const cur=allPts(),mx=Math.max(...cur.map(q=>q[0])),my=Math.min(...cur.map(q=>q[1]));
    dx=mx+40-Math.min(...ip.map(q=>q[0]));dy=my-Math.min(...ip.map(q=>q[1]));how='đặt bên phải bản vẽ'}
  else how='bản vẽ trống';
  if(!D.geo&&o.geo)D.geo={...o.geo,x0:o.geo.x0+dx,y0:o.geo.y0+dy};
  const idm={},moi=[];let them=0,trung=0;
  for(const p of o.poles){const ex=exOf(p);
    if(ex){idm[p.id]=ex.id;trung++;if(parse(p.code).toks.length>parse(ex.code).toks.length)ex.code=p.code;continue}
    const np={...p,id:uid(),x:p.x+dx,y:p.y+dy,auto:false};idm[p.id]=np.id;moi.push([np,p.from]);D.poles.push(np);them++}
  for(const [np,f] of moi)np.from=(f&&idm[f])||null;
  for(const [a,b] of o.edges||[]){const A=idm[a],B=idm[b];if(A&&B&&A!==B&&!hasEdge(A,B))D.edges.push([A,B])}
  for(const r of o.roads||[])D.roads.push({id:uid(),w:r.w||7,ten:r.ten||'',pts:r.pts.map(q=>[q[0]+dx,q[1]+dy])});
  for(const m of o.mocs||[])D.mocs.push({id:uid(),ten:m.ten,x:m.x+dx,y:m.y+dy});
  return {them,trung,how};
}

let delListT={};
panel.addEventListener('click',e=>{
  const tr=e.target.closest('tr[data-id]');
  if(tr){const p=byId(tr.dataset.id);closePanel();if(!p)return;
    tool='cot';for(const x of document.querySelectorAll('[data-tool]'))x.classList.toggle('on',x.dataset.tool==='cot');
    V.tx=W/2-p.x*V.s;V.ty=H*0.3-p.y*V.s;persistView();D.active=p.id;save();openSheet(p);return}
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  if(a==='close')closePanel();
  else if(a==='new'){const t=prompt('Tên TBA / tuyến','');if(t===null)return;switchTo(newD(t.trim()));closePanel()}
  else if(a==='open'){switchTo(DB.ds[id]);closePanel()}
  else if(a==='del'){if(!delListT[id]){b.textContent='Xoá thật?';b.classList.add('armed');delListT[id]=setTimeout(()=>{delete delListT[id];b.textContent='Xoá';b.classList.remove('armed')},3000);return}
    clearTimeout(delListT[id]);delete delListT[id];delete DB.ds[id];
    if(id===D.id){const rest=Object.values(DB.ds).sort((x,y)=>y.capNhat-x.capNhat);switchTo(rest[0]||newD())}
    saveNow();showList()}
  else if(a==='xlsx')xuatXlsx();else if(a==='dxf')xuatDxf();else if(a==='json')xuatJson();else if(a==='png')guiAnh();
});
panel.addEventListener('change',async e=>{
  const fl=e.target.files;if(!fl||!fl.length)return;
  if(e.target.id==='gop'){
    snap();const kq=[];
    for(const f of fl){try{const r=gop(JSON.parse(await docFile(f)));kq.push(`${f.name}: thêm ${r.them} cột${r.trung?`, ${r.trung} cột trùng số`:''} (${r.how})`)}
      catch(err){kq.push(`${f.name}: không đọc được`)}}
    save();closePanel();V=fitView(W,H,40);persistView();draw();toast(kq.join(' · '));return;
  }
  if(e.target.id==='imp'){
    try{const o=JSON.parse(await docFile(fl[0]));if(!Array.isArray(o.poles))throw 0;
      const d={id:uid(),ten:o.ten||'Tuyến nhập',ngay:o.ngay||today(),poles:o.poles,edges:o.edges||[],roads:o.roads||[],mocs:o.mocs||[],geo:o.geo||null,active:null,view:null,capNhat:Date.now()};
      DB.ds[d.id]=d;saveNow();switchTo(d);closePanel();toast('Đã mở file')}catch(err){toast('File không đúng định dạng của app')}
  }
});
$('#b-list').addEventListener('click',showList);
$('#b-export').addEventListener('click',showExport);
$('#b-table').addEventListener('click',showTable);
function switchTo(d){saveNow();D=d;D.roads=D.roads||[];D.mocs=D.mocs||[];DB.cur=d.id;undoSt=[];editId=null;F=null;noiA=null;selRoad=null;sheet.hidden=true;rsheet.hidden=true;V=D.view||fitView(W,H,40);saveNow();title();draw()}

/* ================= toast / khởi động ================= */
let toastT=null;
function toast(m){const el=$('#toast');el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},3200)}
async function keepAwake(){try{if('wakeLock' in navigator&&!document.hidden)await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)keepAwake()});
new ResizeObserver(()=>{sizeUp();if(!V)V=fitView(W,H,40);draw()}).observe(stage);
sizeUp();if(!V)V=fitView(W,H,40);title();draw();keepAwake();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
